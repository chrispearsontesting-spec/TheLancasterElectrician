<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Calendar</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--line:rgba(255,255,255,.12);--ring:#6b7280;--ice:#9fd8ff}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
h1{font-size:22px;margin:0 0 6px}
.nav{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.nav b{font-size:16px}
.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:800;background:radial-gradient(circle at 50% 28%,#5c5c5c 0%,#2a2a2a 45%,#121212 80%);color:#fff;border:1px solid var(--ring);text-decoration:none}
.wide{display:block;width:100%;text-align:center;margin-top:10px;padding:13px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{color:var(--dim);font-size:11px;text-align:center;padding:4px 0}
.day{background:#14161b;border:1px solid var(--line);border-radius:10px;min-height:48px;padding:6px 4px;color:var(--ink);text-align:left}
.day.empty{background:transparent;border-color:transparent}
.day.on{outline:1px solid #9fd8ff}
.day .n{font-size:12px;font-weight:800}
.day .dot{display:block;width:6px;height:6px;border-radius:50%;background:#9fd8ff;margin-top:6px}
.card{background:#14161b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.card b{display:block}
.muted{color:var(--dim);font-size:13px;margin:4px 0 0}
</style>
</head>
<body>
<h1>Journey calendar</h1>
<p class="muted">Trips logged when you press Start on Drive. Tap a day.</p>
<div class="nav">
  <button class="btn" type="button" id="prev">Prev</button>
  <b id="label"></b>
  <button class="btn" type="button" id="next">Next</button>
</div>
<div class="grid" id="dows"></div>
<div class="grid" id="grid"></div>
<div id="list"></div>
<a class="btn wide" href="drive.html">Drive</a>
<a class="btn wide" href="home.html">Back</a>
<script>
var view=new Date();
view.setDate(1);
function logs(){
  try{return JSON.parse(localStorage.getItem("gt.driveLog")||"[]")}catch(e){return []}
}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function byDay(){
  var map={};
  logs().forEach(function(t){
    var d=new Date(t.when||t.end||Date.now());
    var k=key(d);
    (map[k]=map[k]||[]).push(t);
  });
  return map;
}
function render(sel){
  var map=byDay();
  var y=view.getFullYear(),m=view.getMonth();
  document.getElementById("label").textContent=view.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  document.getElementById("dows").innerHTML=["Mo","Tu","We","Th","Fr","Sa","Su"].map(function(d){return "<div class='dow'>"+d+"</div>"}).join("");
  var first=new Date(y,m,1);
  var start=(first.getDay()+6)%7;
  var days=new Date(y,m+1,0).getDate();
  var html="";
  for(var i=0;i<start;i++) html+="<div class='day empty'></div>";
  for(var d=1;d<=days;d++){
    var k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var on=sel===k?" on":"";
    var dot=map[k]?"<span class='dot'></span>":"";
    html+="<button type='button' class='day"+on+"' data-k='"+k+"'><span class='n'>"+d+"</span>"+dot+"</button>";
  }
  document.getElementById("grid").innerHTML=html;
  var items=sel&&map[sel]?map[sel]:[];
  var box=document.getElementById("list");
  if(!sel){box.innerHTML="<p class='muted'>Tap a day with a blue dot.</p>";return}
  if(!items.length){box.innerHTML="<p class='muted'>No Drive trips on "+sel+".</p>";return}
  box.innerHTML=items.map(function(t){
    var tm=new Date(t.when).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    var end=t.end?new Date(t.end).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"";
    return "<div class='card'><b>"+tm+(end?" – "+end:"")+"</b><p class='muted'>"+(+t.miles||0).toFixed(2)+" mi · £"+(+t.cost||0).toFixed(2)+" · "+(t.mpg||"-")+" mpg</p>"+(t.hasClip?"<p class='muted'>Clip saved on this phone (Downloads / Dipstick calendar player later).</p>":"")+"</div>";
  }).join("");
}
var selected=key(new Date());
render(selected);
document.getElementById("grid").addEventListener("click",function(e){
  var b=e.target.closest("[data-k]"); if(!b)return;
  selected=b.getAttribute("data-k"); render(selected);
});
document.getElementById("prev").onclick=function(){view.setMonth(view.getMonth()-1);render(selected)};
document.getElementById("next").onclick=function(){view.setMonth(view.getMonth()+1);render(selected)};
</script>
</body>
</html>
