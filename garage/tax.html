<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<script src="./app-lock.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>Tax & MOT</title>
<link rel="stylesheet" href="./ui.css?v=78"/>
<script src="./mot-config.js"></script>
<style>
body{margin:0 auto;max-width:440px;padding:16px;background:#0b0c0e;color:#f3efe6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1{font-size:22px;margin:8px 0}
.plate{display:flex;align-items:center;justify-content:center;background:#f5c518;color:#111;font-weight:800;font-size:28px;letter-spacing:2px;border-radius:8px;padding:12px 16px;margin:16px auto;width:fit-content}
.box{border-radius:18px;color:#fff;text-align:center;padding:24px 16px;margin:14px 0;font-weight:700;border:1px solid rgba(255,255,255,.08)}
.ok{background:#1f5f2a}.bad{background:#8e2b20}.wait,.unk{background:#2a2b2f;color:#c9c5bb}
.box b{display:block;font-size:22px;margin-bottom:6px}
.box small{display:block;font-weight:500;font-size:14px;opacity:.85}
.note{color:#a8a39a;font-size:14px}
#gov{display:block;color:#f5c518;font-weight:600;margin:12px 0}
.back{display:flex;margin-top:16px;justify-content:center;text-decoration:none}
</style>
</head>
<body>
<h1>Tax &amp; MOT</h1>
<div class="plate" id="plate">—</div>
<div class="box wait" id="tax"><b>Checking…</b></div>
<div class="box wait" id="mot"><b>Checking…</b></div>
<p class="note" id="note"></p>
<a id="gov" href="https://vehicleenquiry.service.gov.uk/" target="_blank" rel="noopener">Open the official GOV.UK page</a>
<a class="btn back" href="home.html" data-ico="back">Back</a>
<script src="./icons.js?v=31"></script>
<script>
function unk(el,what){ el.className="box unk"; el.innerHTML="<b>Couldn't check "+what+"</b><small>Try again later, or use the GOV.UK link below.</small>"; }
function esc(x){ return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
var plate=(new URLSearchParams(location.search).get("plate")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
document.getElementById("plate").textContent=plate||"—";
var proxy=(window.MOT_PROXY||"").replace(/\/$/,"");
function j(u){ return fetch(u).then(function(r){ if(!r.ok) throw 0; return r.json(); }).catch(function(){ return {}; }); }
if(!proxy||!plate){ unk(document.getElementById("tax"),"Tax"); unk(document.getElementById("mot"),"MOT"); document.getElementById("note").textContent="No number plate given."; }
else Promise.all([ j(proxy+"/?plate="+plate+"&tax=1"), j(proxy+"/?plate="+plate) ]).then(function(both){
  var d=both[0]||{}, m=both[1]||{};
  var tax=document.getElementById("tax"), mot=document.getElementById("mot");
  // Only green when the service actually confirmed it. Anything unknown is grey, never green.
  var t=String(d.tax||"").trim();
  if(!t){ unk(tax,"Tax"); }
  else { var taxed=/taxed/i.test(t)&&!/untaxed/i.test(t), sorn=/sorn/i.test(t); tax.className="box "+(taxed?"ok":sorn?"wait":"bad"); tax.innerHTML="<b>"+esc(t)+"</b>"+(sorn?"<small>Declared off the road</small>":""); }
  var tests=m.motTests||[], latest=tests[0]||{}, exp=String(latest.expiryDate||"");
  if(!/^\d{4}-\d{2}-\d{2}/.test(exp)){ unk(mot,"MOT"); }
  else {
    var nice=exp.slice(8,10).replace(/^0/,"")+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+exp.slice(5,7)-1]+" "+exp.slice(0,4);
    var overdue=new Date(exp.slice(0,10)+"T23:59:59")<new Date();
    mot.className="box "+(overdue?"bad":"ok"); mot.innerHTML="<b>MOT</b>"+(overdue?"Expired: ":"Expires: ")+nice;
  }
  if(/unk/.test(tax.className+mot.className)) document.getElementById("note").textContent="We couldn't get an answer just now. The official GOV.UK page always has the latest.";
});
</script>
</body>
</html>
