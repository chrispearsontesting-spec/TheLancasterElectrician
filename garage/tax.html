<style>
body{margin:0 auto;max-width:440px;padding:16px;background:#0b0c0e;color:#f3efe6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1{font-size:22px;margin:8px 0}
.plate{display:flex;align-items:center;justify-content:center;background:#f5c518;color:#111;font-weight:800;font-size:28px;letter-spacing:2px;border-radius:8px;padding:12px 16px;margin:16px auto;width:fit-content}
.box{border-radius:18px;color:#fff;text-align:center;padding:24px 16px;margin:14px 0;font-weight:700;border:1px solid rgba(255,255,255,.08)}
.ok{background:#1f5f2a}.bad{background:#8e2b20}.amber{background:#7a5a0c;color:#fff3c4}.amber .link,.ok .link,.bad .link{color:#fff !important}.wait,.unk{background:#2a2b2f;color:#c9c5bb}
.box b{display:block;font-size:22px;margin-bottom:6px}
.box small{display:block;font-weight:500;font-size:14px;opacity:.85}
.note{color:#a8a39a;font-size:14px}
#tax .edit{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
#tax input[type=date]{background:#111214;color:#f3efe6;border:1px solid #3a3b40;border-radius:10px;padding:10px;font-size:16px;color-scheme:dark}
#tax button{background:#f5c518;color:#111;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px}
#tax .link{background:none;color:#f5c518;text-decoration:underline;padding:6px;font-weight:600}
#gov{display:block;color:#f5c518;font-weight:600;margin:12px 0}
</style>
</head>
<body>
<h1>Tax &amp; MOT</h1>
<div class="plate" id="plate">—</div>
<div class="box wait" id="tax"><b>Checking…</b></div>
<div class="box wait" id="mot"><b>Checking…</b></div>
<p class="note" id="note"></p>
<a id="gov" href="https://vehicleenquiry.service.gov.uk/" target="_blank" rel="noopener">Open the official GOV.UK page</a>
<a class="btn" href="home.html">Back</a>
<script src="./icons.js?v=32"></script>
<script>
function unk(el,what){ el.className="box unk"; el.innerHTML="<b>Couldn't check "+what+"</b><small>Try again later, or use the GOV.UK link below.</small>"; }
function esc(x){ return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
var plate=(new URLSearchParams(location.search).get("plate")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
document.getElementById("plate").textContent=plate||"—";
var proxy=(window.MOT_PROXY||"").replace(/\/$/,"");
function j(u){ return fetch(u).then(function(r){ if(!r.ok) throw 0; return r.json(); }).catch(function(){ return {}; }); }
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function uk(iso){ var x=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||""); return x?(+x[3])+" "+MON[+x[2]-1]+" "+x[1]:""; }
var toIso=D3Tax.toIso;
var G={cars:[]}; try{ G=JSON.parse(localStorage.getItem("gt.garage")||"{}")||{}; }catch(e){}
var car=(G.cars||[]).filter(function(c){ return String(c.plate||"").toUpperCase().replace(/[^A-Z0-9]/g,"")===plate; })[0]||null;
function saveGarage(){ try{ localStorage.setItem("gt.garage",JSON.stringify(G)); }catch(e){} }
var lastT="";
function paintTax(t, apiDue){
  lastT=t;
  var box=document.getElementById("tax"), due=(car&&car.tax)||apiDue||"";
  var ok=/^\d{4}-\d{2}-\d{2}$/.test(due), left=ok?Math.ceil((new Date(due+"T23:59:59")-new Date())/864e5):0;
  var taxed=/taxed/i.test(t)&&!/untaxed/i.test(t), sorn=/sorn/i.test(t);
  var label=t?esc(t):ok?(left>=0?"Taxed":"Untaxed"):"Couldn't check Tax";
  var cls=sorn?"amber":t&&!taxed?"bad":ok?(left<0?"bad":left<=30?"amber":"ok"):t?"ok":"unk";
  var sub=ok?(left<0?(-left)+" day"+(left===-1?"":"s")+" overdue":left===0?"Due today":left+" day"+(left===1?"":"s")+" left")+(t?"":" · from your saved date"):sorn?"Declared off the road":t?"":"Try again later, or use the GOV.UK link below.";
  var edit=car?"<div class='edit'><input type='date' id='taxIn' aria-label='Tax renewal date' value='"+(ok?due:"")+"'/><button type='button' id='taxSave'>Save date</button></div>":"<small>Add this car in My garage to save a renewal date.</small>";
  box.className="box "+cls;
  box.innerHTML="<b>"+label+(ok?" (Renew "+uk(due)+")":"")+"</b>"+(sub?"<small>"+sub+"</small>":"")+
    (ok?(car?"<button type='button' class='link' id='taxEdit'>Change date</button><div id='taxEd' style='display:none'>"+edit+"</div>":""):(car?"<button type='button' class='link' id='taxEdit'>Add renewal date</button><div id='taxEd' style='display:none'>"+edit+"</div>":edit));
  var e=document.getElementById("taxEdit"); if(e) e.onclick=function(){ document.getElementById("taxEd").style.display="block"; e.style.display="none"; };
  var sv=document.getElementById("taxSave"); if(sv) sv.onclick=function(){ var v=document.getElementById("taxIn").value; if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return; car.tax=v; saveGarage(); paintTax(lastT,""); };
}
if(!proxy||!plate){ unk(document.getElementById("tax"),"Tax"); unk(document.getElementById("mot"),"MOT"); document.getElementById("note").textContent="No number plate given."; }
else Promise.all([ j(proxy+"/?plate="+plate+"&tax=1"), j(proxy+"/?plate="+plate) ]).then(function(both){
  var d=both[0]||{}, m=both[1]||{};
  var tax=document.getElementById("tax"), mot=document.getElementById("mot");
  // Only green when the service actually confirmed it. Anything unknown is grey, never green.
  // The GOV.UK check can come back as a timed-out page whose title still says "taxed", so only trust a status the page really stated.
  var px=D3Tax.parse(d), t=px.status, apiDue=px.due;
  if(apiDue&&car&&car.tax!==apiDue){ car.tax=apiDue; saveGarage(); }
  paintTax(t, apiDue);
  var tests=m.motTests||[], latest=tests[0]||{}, exp=String(latest.expiryDate||"");
  if(!/^\d{4}-\d{2}-\d{2}/.test(exp)){ unk(mot,"MOT"); }
  else {
    var nice=exp.slice(8,10).replace(/^0/,"")+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+exp.slice(5,7)-1]+" "+exp.slice(0,4);
    var overdue=new Date(exp.slice(0,10)+"T23:59:59")<new Date();
    mot.className="box "+(overdue?"bad":"ok"); mot.innerHTML="<b>"+(overdue?"MOT expired":"MOT valid until")+"</b>"+nice;
  }
  if(/unk/.test(tax.className+mot.className)) document.getElementById("note").textContent="We couldn't get an answer just now. The official GOV.UK page always has the latest.";
});
</script>
</body>
</html>
