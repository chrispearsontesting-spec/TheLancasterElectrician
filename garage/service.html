<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>General costs and guides</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(10px + env(safe-area-inset-top)) 12px 28px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:#9aa3b0;font-size:13px;margin:0 0 16px}
label{display:block;color:#9aa3b0;font-size:12px;margin:10px 0 4px}
select,input[type=search]{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:16px}
input[type=search]::placeholder{color:#6b7280}
.row{display:flex;gap:8px}
.row input{flex:1}
.go{background:#171a20;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;white-space:nowrap}
.status{min-height:22px;margin:8px 0 4px;font-size:13px;color:#9aa3b0}
.status.ok{color:#9fd8ff;font-weight:700}
.status.wait{color:#f0c56a}
.spin{display:inline-block;width:10px;height:10px;border:2px solid #f0c56a;border-right-color:transparent;border-radius:50%;margin-right:6px;vertical-align:-1px;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#14161b;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.card h2{margin:0;padding:14px 14px 8px;font-size:15px;font-weight:800}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item span{font-size:14px}
.item b{font-size:15px;white-space:nowrap}
.note{padding:10px 14px 14px;color:#9aa3b0;font-size:12px;line-height:1.4}
.hide{display:none}
.btns{padding:0 14px 14px}
.btn{display:block;background:#171a20;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:800;font-size:15px;text-align:center;width:100%;margin-top:8px;cursor:pointer}
.btn.flash{outline:2px solid #9fd8ff}
</style>
</head>
<body>
<h1>General costs and guides</h1>
<p class="sub" id="carLine">Volvo XC60 D5</p>

<label>Search a part or job</label>
<form id="qForm">
  <div class="row">
    <input type="search" id="qBox" placeholder="e.g. boot strut, MAP sensor" autocomplete="off" enterkeyhint="search"/>
    <button class="go" type="submit">Search</button>
  </div>
</form>
<p class="status" id="status"></p>

<label>Or pick a common job</label>
<select id="jobPick">
  <option value="">Select a job</option>
</select>

<div class="card hide" id="quoteBox">
  <div id="quotes"></div>
  <p class="note" id="jobNote"></p>
</div>

<div class="card">
  <h2>Where to buy</h2>
  <div class="btns">
    <a class="btn" id="btnGsf" target="_blank" rel="noopener" href="#">GSF Car Parts</a>
    <a class="btn" id="btnEbay" target="_blank" rel="noopener" href="#">eBay</a>
  </div>
</div>

<div class="card">
  <h2>How to guides</h2>
  <div class="btns">
    <a class="btn" id="btnYt" target="_blank" rel="noopener" href="#">YouTube</a>
    <a class="btn" id="btnHaynes" target="_blank" rel="noopener" href="#">Haynes</a>
  </div>
</div>

<a class="btn" href="home.html">Back</a>

<script>
var WORK=[
  {id:"service",name:"Interim service (oil + filter)",buy:"service kit",hrs:1,plo:35,phi:90,note:"Full service is more."},
  {id:"full",name:"Full service",buy:"full service kit",hrs:1.6,plo:55,phi:140,note:"Oil, filters and plugs or fuel filter."},
  {id:"beltwp",name:"Timing belt + water pump",buy:"timing belt kit water pump",hrs:4.5,plo:80,phi:180,note:"Do the pump while it is open. Some engines use a chain."},
  {id:"belt",name:"Timing belt only",buy:"timing belt kit",hrs:4,plo:40,phi:120,note:"Usually false economy not to do the pump."},
  {id:"clutch",name:"Clutch kit",buy:"clutch kit",hrs:6,plo:160,phi:350,note:"Gearbox out. Dual-mass flywheel extra if worn."},
  {id:"clutchdmf",name:"Clutch + dual-mass flywheel",buy:"clutch kit dual mass flywheel",hrs:6.5,plo:350,phi:700,note:"Common on diesels."},
  {id:"shaft",name:"Driveshaft (one side)",buy:"driveshaft",hrs:2,plo:80,phi:220,note:"Clicking on lock is the usual clue."},
  {id:"fpads",name:"Front pads and discs",buy:"front brake pads discs",hrs:1.5,plo:80,phi:220,note:""},
  {id:"rpads",name:"Rear pads and discs",buy:"rear brake pads discs",hrs:1.5,plo:70,phi:200,note:""},
  {id:"batt",name:"Battery",buy:"car battery",hrs:0.4,plo:70,phi:180,note:"Stop-start batteries cost more."},
  {id:"alt",name:"Alternator",buy:"alternator",hrs:2,plo:120,phi:350,note:""},
  {id:"start",name:"Starter motor",buy:"starter motor",hrs:1.8,plo:100,phi:280,note:""},
  {id:"damp",name:"Pair of dampers",buy:"shock absorbers",hrs:2,plo:120,phi:350,note:""}
];
var RATE=80, MULT={small:0.85,family:1,suv:1.15,premium:1.35};
var waitT=null;
function car(){
  try{
    var s=JSON.parse(localStorage.getItem("gt.garage")||"null");
    if(s&&s.cars&&s.cars.length) return s.cars[s.i]||s.cars[0];
  }catch(e){}
  return {nick:"Volvo XC60 D5",name:"Volvo XC60 D5",plate:"SB61LGZ",fuel:"diesel",cls:"suv"};
}
function qname(c){
  var n=String(c.nick||c.name||"").trim();
  if(!n||/your car details/i.test(n)) n="";
  return n||String(c.plate||"car").replace(/\s+/g,"").toUpperCase();
}
function row(n,p){return "<div class='item'><span>"+n+"</span><b>"+p+"</b></div>"}
function term(){
  var typed=document.getElementById("qBox").value.trim();
  if(typed) return typed;
  var id=document.getElementById("jobPick").value;
  var job=WORK.filter(function(w){return w.id===id})[0];
  return job?job.buy:"";
}
function setStatus(html, cls){
  var el=document.getElementById("status");
  el.className="status "+(cls||"");
  el.innerHTML=html||"";
}
function flashBtns(){
  ["btnGsf","btnEbay","btnYt","btnHaynes"].forEach(function(id){
    var b=document.getElementById(id);
    b.classList.remove("flash");
    void b.offsetWidth;
    b.classList.add("flash");
    setTimeout(function(){b.classList.remove("flash");},900);
  });
}
function links(){
  var c=car(), name=qname(c), buy=term()||"service kit";
  var q=encodeURIComponent(name+" "+buy);
  var qn=encodeURIComponent(name);
  document.getElementById("btnGsf").href="https://www.gsfcarparts.com/catalogsearch/result/?q="+q;
  document.getElementById("btnEbay").href="https://www.ebay.co.uk/sch/i.html?_nkw="+q;
  document.getElementById("btnYt").href="https://www.youtube.com/results?search_query="+encodeURIComponent(name+" "+buy+" how to UK");
  document.getElementById("btnHaynes").href="https://uk.haynes.com/search?q="+qn;
}
function draw(){
  var c=car(), name=qname(c), cls=c.cls||"suv";
  var plate=String(c.plate||"").toUpperCase();
  document.getElementById("carLine").textContent=name+(plate?" \u00b7 "+plate:"");
  var typed=document.getElementById("qBox").value.trim();
  var id=document.getElementById("jobPick").value;
  var job=WORK.filter(function(w){return w.id===id})[0];
  if(job && !typed){
    var m=MULT[cls]||1;
    var lab=job.hrs*RATE*m;
    var lo=Math.round((lab*0.85+job.plo*m)/10)*10;
    var hi=Math.round((lab*1.2+job.phi*m)/10)*10;
    document.getElementById("quotes").innerHTML=
      row("Independent","\u00a3"+lo+"-\u00a3"+hi)+
      row("Main dealer","\u00a3"+Math.round(lo*1.35/10)*10+"-\u00a3"+Math.round(hi*1.45/10)*10);
    document.getElementById("jobNote").textContent=job.note||"Guide only \u2014 not a firm quote.";
    document.getElementById("quoteBox").className="card";
  }else{
    document.getElementById("quoteBox").className="card hide";
  }
  links();
}
function finishSearch(){
  var buy=term();
  var name=qname(car());
  draw();
  if(!buy){
    setStatus("Type a part, then tap Search.","");
    return;
  }
  setStatus("Ready \u2014 "+buy+" for "+name+". Use the buttons below.","ok");
  flashBtns();
}
function runSearch(){
  var buy=document.getElementById("qBox").value.trim();
  if(!buy){finishSearch();return;}
  document.getElementById("qBox").blur();
  setStatus("<span class='spin'></span>Searching "+buy+"\u2026","wait");
  clearTimeout(waitT);
  waitT=setTimeout(finishSearch,450);
}
var sel=document.getElementById("jobPick");
sel.innerHTML="<option value=\"\">Select a job</option>"+WORK.map(function(w){return "<option value='"+w.id+"'>"+w.name+"</option>"}).join("");
sel.onchange=function(){
  document.getElementById("qBox").value="";
  draw();
  var job=WORK.filter(function(w){return w.id===sel.value})[0];
  if(job) setStatus("Ready \u2014 "+job.name+". Use the buttons below.","ok");
  else setStatus("","");
};
document.getElementById("qForm").addEventListener("submit",function(e){e.preventDefault();runSearch();});
draw();
</script>
</body>
</html>
