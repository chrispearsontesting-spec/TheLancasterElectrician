<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>Performance</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100%;overflow:hidden}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.overlay{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
.hud{background:rgba(0,0,0,.45);border-radius:14px;padding:8px 12px;text-align:center;min-width:70px;backdrop-filter:blur(4px)}
.hud b{font-size:22px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.hud span{font-size:10px;color:#ccc;text-transform:uppercase}
#gDot{width:64px;height:64px;border-radius:50%;background:rgba(20,20,22,.55);border:1px solid rgba(255,255,255,.25);position:relative}
#gDot i{position:absolute;width:10px;height:10px;border-radius:50%;background:#73BDE0;left:50%;top:50%;transform:translate(-50%,-50%)}
.top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:8px;flex-wrap:wrap;z-index:6;background:linear-gradient(#000,#0000)}
select,button,.btn{background:#1c1c1e;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.disclaimer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);padding:16px;border-radius:14px;text-align:center;max-width:280px;z-index:10;font-size:13px}
.chart-wrap{position:fixed;inset:0;background:#0b0c0e;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.chart-wrap.show{display:flex}
canvas#chart{width:100%;max-width:360px;height:160px;background:#141416;border-radius:12px}
</style>
</head>
<body>
<video id="vid" playsinline muted autoplay></video>
<div class="top">
  <select id="run">
    <option value="60">0–60 mph</option>
    <option value="100">0–100 mph</option>
    <option value="quarter">Quarter mile</option>
    <option value="half">Half mile</option>
    <option value="100-200">100–200 km/h</option>
  </select>
  <button id="arm" type="button">Start run</button>
  <label style="font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="keep"/> Keep video</label>
  <a class="btn" href="drive-hub.html">Back</a>
</div>
<div class="overlay">
  <div class="hud"><b id="time">0.0</b><span>Time</span></div>
  <div id="gDot"><i id="dot"></i></div>
  <div class="hud"><b id="spd">0</b><span>mph</span></div>
</div>
<div class="disclaimer" id="disc">Closed roads or tracks only.<br>Phone estimate — not for public roads.<br><button id="ok" type="button" style="margin-top:10px">I understand</button></div>
<div class="chart-wrap" id="chartWrap">
  <h2 id="result" style="margin:0 0 8px">Run complete</h2>
  <canvas id="chart" width="340" height="160"></canvas>
  <p id="saved" style="font-size:13px;color:#aaa;margin:8px 0"></p>
  <button id="dlChart" type="button">Download chart</button>
  <button id="again" type="button">New run</button>
</div>
<script>
const vid = document.getElementById('vid');
const timeEl = document.getElementById('time');
const spdEl = document.getElementById('spd');
const dot = document.getElementById('dot');
const armBtn = document.getElementById('arm');
const runSel = document.getElementById('run');
const keepChk = document.getElementById('keep');
const chartWrap = document.getElementById('chartWrap');
const resultEl = document.getElementById('result');
const savedEl = document.getElementById('saved');
let stream, recorder, chunks = [], running = false, startTs = 0, speed = 0, lon = 0, samples = [], watchId = null, lastFrame = null, motionStart = false;

document.getElementById('ok').onclick = () => document.getElementById('disc').style.display = 'none';
document.getElementById('again').onclick = () => { chartWrap.classList.remove('show'); location.reload(); };

async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1280}}, audio:false});
    vid.srcObject = stream;
  }catch(e){ alert('Camera needed'); }
}
startCam();

function onMotion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if(!a) return;
  const raw = (a.y||0)/9.81;
  lon = lon*0.65 + raw*0.35;
  const x = (a.x||0)/9.81;
  dot.style.transform = `translate(calc(-50% + ${x*18}px), calc(-50% - ${lon*18}px))`;
  if(running && !startTs && (lon > 0.28 || motionStart)){
    startTs = performance.now();
    statusUpdate();
  }
  if(running && startTs){
    const t = (performance.now()-startTs)/1000;
    timeEl.textContent = t.toFixed(1);
    samples.push({t, speed, lon});
    checkFinish(t);
  }
}
window.addEventListener('devicemotion', onMotion);

// simple visual motion trigger from video frames
function checkVisual(){
  if(!running || startTs || !vid.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = 64; c.height = 36;
  const ctx = c.getContext('2d');
  ctx.drawImage(vid, 0, 0, 64, 36);
  const data = ctx.getImageData(0,0,64,36).data;
  if(lastFrame){
    let diff = 0;
    for(let i=0;i<data.length;i+=16) diff += Math.abs(data[i]-lastFrame[i]);
    if(diff > 8000) motionStart = true;
  }
  lastFrame = data;
}
setInterval(checkVisual, 100);

function checkFinish(t){
  const mode = runSel.value;
  let done = false, label = '';
  if(mode==='60' && speed>=60){ done=true; label='0–60'; }
  else if(mode==='100' && speed>=100){ done=true; label='0–100'; }
  else if(mode==='quarter' && speed>0 && t>8){ done=true; label='Quarter'; } // rough
  else if(mode==='half' && t>15){ done=true; label='Half'; }
  else if(mode==='100-200' && speed>=124){ done=true; label='100–200'; }
  if(done) finish(t, label);
}

function finish(t, label){
  running = false;
  if(recorder && recorder.state==='recording') recorder.stop();
  if(watchId) navigator.geolocation.clearWatch(watchId);
  resultEl.textContent = label + '  ' + t.toFixed(2) + 's';
  chartWrap.classList.add('show');
  drawChart();
  if(!keepChk.checked){
    savedEl.textContent = 'Video discarded (Keep video was off)';
    chunks = [];
  } else {
    savedEl.textContent = 'Video saved — check your downloads';
  }
}

function drawChart(){
  const cv = document.getElementById('chart');
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  if(samples.length<2) return;
  ctx.strokeStyle='#73BDE0'; ctx.lineWidth=2; ctx.beginPath();
  samples.forEach((s,i)=>{
    const x=10+(i/(samples.length-1))*(cv.width-20);
    const y=cv.height-10-(Math.min(s.speed,140)/140)*(cv.height-20);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}
document.getElementById('dlChart').onclick = () => {
  const a = document.createElement('a');
  a.href = document.getElementById('chart').toDataURL('image/jpeg',0.9);
  a.download = 'dipstick-run.jpg';
  a.click();
};

armBtn.onclick = async () => {
  if(running){ running=false; armBtn.textContent='Start run'; return; }
  running = true; startTs = 0; samples = []; motionStart = false; speed = 0;
  timeEl.textContent = '0.0';
  armBtn.textContent = 'Cancel';
  chunks = [];
  if(stream){
    recorder = new MediaRecorder(stream, {mimeType:'video/webm'});
    recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      if(keepChk.checked && chunks.length){
        const blob = new Blob(chunks, {type:'video/webm'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'dipstick-run.webm';
        a.click();
      }
    };
    recorder.start();
  }
  if(navigator.geolocation){
    watchId = navigator.geolocation.watchPosition(pos => {
      if(pos.coords.speed!=null) speed = pos.coords.speed * 2.23694;
      spdEl.textContent = Math.round(speed);
    }, ()=>{}, {enableHighAccuracy:true, maximumAge:500});
  }
};
</script>
</body>
</html>
