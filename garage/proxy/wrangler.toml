name = "dipstick-mot"
main = "mot-worker.js"
compatibility_date = "2026-09-15"

# Per-IP rate limit (needs Wrangler 4.36.0 or later). 20 lookups per minute per IP,
# counted separately in each Cloudflare location and approximate.
# If this binding is missing, the Worker falls back to a weaker in-memory limit.
[[ratelimits]]
name = "MOT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Remembered garage contacts (business email/website only), free tier KV.
[[kv_namespaces]]
binding = "GARAGE_CONTACTS"
id = "60239f21ec7a4cff882b6e6467136b36"

# Refresh the official Fuel Finder snapshot about every 30 minutes (UTC).
# One KV write per run, reused by /fuel so we stay inside the free-tier write cap.
[triggers]
crons = ["*/30 * * * *"]
