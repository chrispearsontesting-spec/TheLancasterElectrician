<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<link rel="stylesheet" href="./ui.css?v=71"/>
<title>MOT</title>
<style>
body{margin:0 auto;max-width:440px;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 28px}
h1{margin:0;font-size:22px}
.sub{color:#8b8b8b;font-size:13px;margin:2px 0 12px}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;background:#161618;border:1px solid #2a2a2e;color:#f2f2f2;border-radius:14px;padding:8px 4px;font-size:13px;cursor:pointer}
.tabs button.on{background:#1c1c1e;color:#f3efe6}
.card{background:#141416;border:1px solid #2a2a2e;border-radius:18px;padding:8px 12px}
.card.hide{display:none}
.row{padding:10px 0;border-bottom:1px solid #2a2a2e}
.row b{display:block}
.muted{color:#8b8b8b;font-size:13px;margin:4px 0 0}
.pass{color:#3dd68c;font-weight:700}
.fail{color:#ff6b6b;font-weight:700}
</style>
</head>
<body>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<div>
<h1 id="title">MOT</h1>
<p class="sub" id="sub">History and work for this car</p>
</div>
<div id="motStatus" style="background:#14532d;color:#bbf7d0;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700;text-align:center;line-height:1.3;min-width:90px"></div>
</div>
<div class="tabs">
<button type="button" id="tabHist" class="on">History</button>
<button type="button" id="tabWork">Recent work</button>
<button type="button" id="tabFuture">Future costs</button>
</div>
<div id="hist" class="card"></div>
<div id="work" class="card hide"></div>
<div id="future" class="card hide"></div>
<a class="btn wide" href="home.html" data-ico="back" style="margin-top:14px"><span class="lab">Back</span></a>
<a class="btn wide" id="official" href="https://www.check-mot.service.gov.uk/" target="_blank" rel="noopener" style="margin-top:8px">Official MOT history</a>
<script src="mot-config.js"></script>
<script src="mot-client.js"></script>
<script src="icons.js?v=28"></script>
<script>
function $(id){return document.getElementById(id)}
var plate=new URLSearchParams(location.search).get("plate")||"";
function show(which){
  ["hist","work","future"].forEach(function(id){$(id).className=id===which?"card":"card hide"});
  $("tabHist").className=which==="hist"?"on":"";
  $("tabWork").className=which==="work"?"on":"";
  $("tabFuture").className=which==="future"?"on":"";
}
function date(s){
  if(!s) return "";
  var d=new Date(s);
  if(isNaN(d)) return s;
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}
function miles(n){return String(n||"").replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function itemLine(it){
  var type=it.type||"";
  var text=it.text||"";
  var cls=type==="FAIL"||type==="DANGEROUS"?"fail":(type==="MAJOR"?"fail":"muted");
  return "<p class='"+cls+"' style='margin:2px 0'>"+(type?type+": ":"")+text+"</p>";
}
function render(info){
  var tests=(info&&info.tests)||[];
  var hist=$("hist"), work=$("work");
  if(!tests.length){
    hist.innerHTML="<p class='muted'>No tests returned.</p>";
    if(work) work.innerHTML="";
    if($("future")) $("future").innerHTML="";
    return;
  }
  var rows=tests.map(function(t){
    var ok=String(t.testResult||"").toUpperCase()==="PASSED";
    var items=(t.defects||[]).map(itemLine).join("");
    return "<div class='row'><b>"+date(t.completedDate||t.testDate)+"</b><p class='"+(ok?"pass":"fail")+"'>"+(ok?"Passed":"Failed")+"</p><p class='muted'>"+miles(t.odometerValue)+" "+(t.odometerUnit||"")+"</p>"+items+"</div>";
  }).join("");
  hist.innerHTML=rows||"<p class='muted'>No tests.</p>";
  var fails=[];
  tests.forEach(function(t){
    (t.defects||[]).forEach(function(it){
      var type=String(it.type||"").toUpperCase();
      if(type==="FAIL"||type==="MAJOR"||type==="DANGEROUS"){
        fails.push({date:date(t.completedDate||t.testDate),text:it.text||"",type:type});
      }
    });
  });
  if(work){
    work.innerHTML=fails.length?fails.map(function(f){return "<div class='row'><b>"+f.date+"</b><p class='fail'>"+f.type+": "+f.text+"</p></div>"}).join(""):"<p class='muted'>No major defects in the last tests.</p>";
  }
  var latest=tests[0]||{};
  var milesNow=+(String(latest.odometerValue||"0").replace(/\D/g,""))||0;
  var year=+(info.manufactureYear||info.yearOfManufacture||0);
  var age=year? (new Date().getFullYear()-year) : 0;
  function lastHit(re){
    var i,j;
    for(i=0;i<tests.length;i++){
      var defs=tests[i].defects||[];
      for(j=0;j<defs.length;j++){
        var t=String(defs[j].text||"").toLowerCase();
        if(re.test(t)){
          var type=String(defs[j].type||"").toUpperCase();
          return {date:date(tests[i].completedDate||tests[i].testDate),text:defs[j].text||"",major:type==="FAIL"||type==="MAJOR"||type==="DANGEROUS"};
        }
      }
    }
    return null;
  }
  function line(title, life, cost, hit, soon){
    var state=soon?"Due soon":"Plan for";
    var note=life;
    if(hit&&hit.major){ state="Seen in a fail"; note="Last recorded "+hit.date+". A fail usually means it was put right. "+life; }
    else if(hit){ state="Advised"; note="MOT said: "+hit.text+". "+life; }
    return "<div class='row' data-job='"+title+"'><div><b>"+title+"</b> <b>("+cost+")</b><p class='muted'>"+state+". "+note+"</p></div><label style='display:flex;align-items:center;gap:6px;font-size:13px'><input type='checkbox' class='done'> Done</label></div>";
  }
  var tyre=lastHit(/tyre/);
  var brake=lastHit(/brake/);
  var sus=lastHit(/suspension|spring|arm|bush/);
  var exh=lastHit(/exhaust|corrosion/);
  var soon=[], lo=0, hi=0;
  function add(on, name, a, b){ if(on){ soon.push(name); lo+=a; hi+=b; } }
  add(!!(tyre&&!tyre.major)||age>=6, "tyres", 250, 500);
  add(!!(brake&&!brake.major), "brakes", 150, 350);
  add(age>=8||!!(sus&&!sus.major), "suspension", 150, 400);
  add(age>=8||!!(exh&&!exh.major), "exhaust", 150, 400);
  add(true, "a service", 150, 300);
  add(age>=5||milesNow>80000, "a timing belt check", 0, 900);
  var summary="<p class='muted'><b>Next few years.</b> Plan for the items below.</p>";
  var future=[
    line("Tyres","A set often lasts 20,000 to 30,000 miles, or about five years.", "\u00a3250 to \u00a3500", tyre, !!(tyre&&!tyre.major) || age>=6),
    line("Brakes","Pads are often 25,000 to 40,000 miles. Discs last longer.", "\u00a3150 to \u00a3350 an axle", brake, !!(brake&&!brake.major)),
    line("Suspension","Bushes, arms and springs commonly need attention after 60,000 miles or eight to ten years.", "\u00a3150 to \u00a3400 a corner", sus, age>=8 || !!(sus&&!sus.major)),
    line("Exhaust","A section often lasts eight to twelve years, sooner if corrosion was advised.", "\u00a3150 to \u00a3400", exh, age>=8 || !!(exh&&!exh.major)),
    line("Service","Due every year, or 10,000 to 12,000 miles.", "\u00a3150 to \u00a3300", null, true),
    line("Timing belt","Many belts are five years or 60,000 to 100,000 miles. A chain has no set date. Ask for the invoice.", milesNow>80000||age>=5?"\u00a3400 to \u00a3900 if it is a belt":"Check the schedule", null, age>=5||milesNow>80000)
  ];
  var best=0, worst=0;
  future.forEach(function(html){
    var m=html.match(/\(\u00a3(\d+) to \u00a3(\d+)/);
    if(m){ best+=+m[1]; worst+=+m[2]; }
  });
  var totals="<div class='row' style='display:grid;grid-template-columns:1fr 1fr;gap:12px'><div><b>Best case</b><p class='muted'>\u00a3"+best+"</p></div><div><b>Worst case</b><p class='muted'>\u00a3"+worst+"</p></div></div>";
  $("future").innerHTML=totals+summary+future.join("")+"<p class='muted'>"+(milesNow?miles(milesNow)+" miles on the latest test. ":"")+"About "+age+" years on record. Typical life, not a quote, and only for this car.</p>";
  var done = JSON.parse(localStorage.getItem("gt.motDone")||"{}");
  function updateTotals(){
    var best=0, worst=0;
    document.querySelectorAll("#future .row[data-job]").forEach(function(row){
      var cb = row.querySelector(".done");
      if(cb && cb.checked) return;
      var m = row.innerHTML.match(/\u00a3(\d+) to \u00a3(\d+)/);
      if(m){ best+=+m[1]; worst+=+m[2]; }
    });
    var bestEl = document.querySelector("#future .row b");
    if(bestEl && bestEl.textContent==="Best case"){
      var nums = document.querySelectorAll("#future .row .muted");
      if(nums[0]) nums[0].textContent = "\u00a3"+best;
      if(nums[1]) nums[1].textContent = "\u00a3"+worst;
    }
  }
  document.querySelectorAll("#future .done").forEach(function(cb){
    var row = cb.closest(".row");
    var job = row.getAttribute("data-job");
    function style(checked){
      row.style.opacity = checked ? "0.45" : "1";
      row.style.textDecoration = checked ? "line-through" : "none";
      var label = row.querySelector("label");
      if(label) label.textContent = checked ? "Undone" : "Done";
    }
    if(done[job]){ cb.checked=true; style(true); }
    cb.onchange = function(){
      done[job] = cb.checked;
      localStorage.setItem("gt.motDone", JSON.stringify(done));
      style(cb.checked);
      updateTotals();
    };
  });
  updateTotals();
}
$("tabHist").onclick=function(){show("hist")};
$("tabWork").onclick=function(){show("work")};
$("tabFuture").onclick=function(){show("future")};
if(!plate||!window.fetchMotVehicle){$("hist").innerHTML="<p class='muted'>Open this from Reminders after a plate is saved.</p>"}
else{
  $("sub").textContent=plate;
  $("official").href="https://www.check-mot.service.gov.uk/results?registration="+encodeURIComponent(plate.replace(/\s/g,""));
  fetchMotVehicle(plate).then(function(info){
    render(info);
    var status=$("motStatus");
    if(status && info && info.tests && info.tests.length){
      var latest=info.tests[0];
      var exp=latest.expiryDate||"";
      var passed=String(latest.testResult||"").toUpperCase()==="PASSED";
      if(exp){
        var d=new Date(exp);
        var nice=isNaN(d)?exp:d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
        status.textContent=passed?("MOT valid\nExp. "+nice):("MOT failed\nExp. "+nice);
        status.style.background=passed?"#14532d":"#7f1d1d";
        status.style.color=passed?"#bbf7d0":"#fecaca";
      }
    }
  }).catch(function(e){
    $("hist").innerHTML="<p class='muted'>Could not load MOT data. "+(e&&e.message?e.message:"")+"</p>";
  });
}
var hash=location.hash.replace("#","");
if(hash==="work"||hash==="future"||hash==="hist") show(hash);
</script>
</body>
</html>
