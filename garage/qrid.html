*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:calc(64px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}

.sp{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;width:100%;border:0;border-radius:16px;padding:14px;font-weight:650;font-size:16px;background:#1c1c1e;color:#f2f2f2;text-align:center;text-decoration:none;margin-top:12px}
