<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Garage trip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--teal:#0d9488;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 24px}
h1{font-size:22px;margin:0 0 4px}
.car{color:var(--dim);font-size:15px;margin:0 0 12px}
.car b{color:var(--ink)}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
input{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px;font-size:16px}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;margin-top:8px;background:var(--teal);color:#fff}
.ghost{background:#171a20;color:var(--ink);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#14161b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.hit{width:100%;text-align:left;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px;margin-top:5px}
.err{color:#e7b1a0;font-size:13px;min-height:16px}
.muted{color:var(--dim);font-size:12px}
#map{height:200px;border-radius:14px;margin-top:10px;border:1px solid var(--line);background:#0d1117}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mode span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase}
.mode b{display:block;font-size:24px;margin-top:2px}
.hide{display:none}
</style>
</head>
<body>
<h1>Trip cost</h1>
<p class="car" id="carLine"><b>Volvo XC60 D5</b> (diesel)</p>
<p class="muted" id="libLine"></p>
<label>Number plate</label>
<input id="plate" placeholder="SB61 LGZ" autocapitalize="characters"/>
<label>Search cars</label>
<input id="q" placeholder="XC60, Golf GTI, Model 3"/>
<div id="hits"></div>
<label>From</label>
<input id="from"/>
<label>To</label>
<input id="to"/>
<button class="btn" id="go" type="button">Check trip</button>
<p class="err" id="err"></p>
<div id="map"></div>
<div class="card hide" id="result">
  <b id="rTitle">Trip</b>
  <p class="muted" id="rMeta"></p>
  <div class="pair">
    <div class="mode"><span>Steady</span><b id="rEco">-</b><span class="muted" id="rEcoMeta"></span></div>
    <div class="mode"><span>Quick</span><b id="rQuick">-</b><span class="muted" id="rQuickMeta"></span></div>
  </div>
  <p class="muted" id="rRoads"></p>
  <div class="row">
    <button class="btn ghost" id="saveFav" type="button">Save</button>
    <button class="btn ghost" id="setHome" type="button">Set home</button>
  </div>
</div>
<div class="card">
  <div class="row">
    <div><label>MPG</label><input id="mpgOverride" type="number" step="0.1" value="38"/></div>
    <div><label>PHEV electric mi</label><input id="evRange" type="number" placeholder="auto"/></div>
  </div>
  <p class="muted" id="priceLine"></p>
  <div id="favs"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="trip-specs.js"></script>
<script>
var PRICE={date:"6 Sep 2026",petrol:165.3,diesel:186.6,electric:26.1};
var car=null,lastTrip=null,map,line,UK_GALLON=4.54609,MILE=1609.34;
function $(id){return document.getElementById(id)}
function money(n){return (n==null||isNaN(n))?"-":"\u00a3"+n.toFixed(2)}
function labelFuel(k){return k==="phev"||k==="hybrid"?"hybrid":k==="electric"?"electric":k==="diesel"?"diesel":"petrol"}
function kind(fuel){fuel=String(fuel||"").toLowerCase();if(fuel.indexOf("electric")>=0&&fuel.indexOf("hybrid")<0&&fuel.indexOf("plug")<0)return "electric";if(fuel.indexOf("plug")>=0||fuel.indexOf("phev")>=0)return "phev";if(fuel.indexOf("diesel")>=0)return "diesel";if(fuel.indexOf("hybrid")>=0)return "hybrid";return "petrol"}
function garageCar(){try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");return s&&s.cars&&s.cars.length?(s.cars[s.i]||s.cars[0]):null}catch(e){return null}}
function tripState(){try{return JSON.parse(localStorage.getItem("gt.trip.v1")||"null")||{}}catch(e){return {}}}
function saveTrip(t){localStorage.setItem("gt.trip.v1",JSON.stringify(t))}
function plateYear(p){var k=String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(k.length<5)return null;var n=parseInt(k.replace(/^[A-Z]+/,"").slice(0,2),10);if(!(n>=2&&n<=79))return null;return n>=50?2000+(n-50):2000+n}
function setCar(c){car=c;$("carLine").innerHTML="<b>"+c.name+"</b> ("+labelFuel(c.kind)+")";if(c.mpg)$("mpgOverride").value=c.mpg;paintFavs()}
function pplFor(k){return k==="diesel"?PRICE.diesel:(k==="electric"?PRICE.electric:PRICE.petrol)}
function costs(miles,secs){var over=parseFloat($("mpgOverride").value),evR=parseFloat($("evRange").value),k=car?car.kind:"diesel",mins=secs/60;if(k==="electric"){var mpk=over||(car.range&&car.kwh?car.range/car.kwh:3.5),eco=miles/Math.max(mpk,.4),q=miles/Math.max(mpk*.82,.3),p=PRICE.electric/100;return{ecoGBP:eco*p,quickGBP:q*p,ecoMin:mins,quickMin:mins*.88,ecoUse:eco.toFixed(1)+" kWh",quickUse:q.toFixed(1)+" kWh"}}var mpg=over||car.mpg||38,ppl=pplFor(k==="diesel"?"diesel":"petrol")/100;if(k==="phev"){var eMiles=Math.min(miles,evR||car.range||30),pMiles=Math.max(0,miles-eMiles),mpk=car.range&&car.kwh?car.range/car.kwh:3.5,ecoL=pMiles/Math.max(mpg,1)*UK_GALLON,qL=pMiles/Math.max(mpg*.8,1)*UK_GALLON,ep=PRICE.electric/100;return{ecoGBP:(eMiles/mpk)*ep+ecoL*ppl,quickGBP:(eMiles/(mpk*.82))*ep+qL*ppl,ecoMin:mins,quickMin:mins*.88,ecoUse:(eMiles?eMiles.toFixed(0)+" mi EV + ":"")+ecoL.toFixed(1)+" L",quickUse:(eMiles?eMiles.toFixed(0)+" mi EV + ":"")+qL.toFixed(1)+" L"}}var ecoL=miles/Math.max(mpg,1)*UK_GALLON,qL=miles/Math.max(mpg*.8,1)*UK_GALLON;return{ecoGBP:ecoL*ppl,quickGBP:qL*ppl,ecoMin:mins,quickMin:mins*.88,ecoUse:ecoL.toFixed(1)+" L",quickUse:qL.toFixed(1)+" L"}}
async function geocode(q){var res=await fetch("https://photon.komoot.io/api/?q="+encodeURIComponent(q+", United Kingdom")+"&limit=1&lang=en");if(!res.ok)throw new Error("Place lookup failed");var data=await res.json(),f=data.features&&data.features[0];if(!f)throw new Error("Could not find that place");var p=f.properties||{};return{lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],name:[p.name,p.postcode,p.city||p.town||p.village].filter(Boolean).slice(0,3).join(", ")||q}}
async function route(a,b){var res=await fetch("https://router.project-osrm.org/route/v1/driving/"+a.lon+","+a.lat+";"+b.lon+","+b.lat+"?overview=full&geometries=geojson&steps=true");if(!res.ok)throw new Error("Route failed");var data=await res.json();if(data.code!=="Ok")throw new Error("No driving route");var r=data.routes[0],merged=[];r.legs.forEach(function(leg){(leg.steps||[]).forEach(function(st){var name=st.ref||st.name;if(!name)return;if(merged.length&&merged[merged.length-1].n===name)merged[merged.length-1].m+=st.distance;else merged.push({n:name,m:st.distance})})});return{miles:r.distance/MILE,secs:r.duration,roads:merged.filter(function(x){return x.m>=1500}).sort(function(a,b){return b.m-a.m}).slice(0,4).map(function(x){return x.n+" "+(x.m/MILE).toFixed(1)+" mi"}),geo:r.geometry}}
function showErr(m){$("err").textContent=m||""}
function drawRoute(geo){if(!map){map=L.map("map",{zoomControl:false}).setView([54.05,-2.7],9);L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,attribution:"OSM CARTO"}).addTo(map)}if(line)map.removeLayer(line);line=L.geoJSON(geo,{style:{color:"#14b8a6",weight:5,opacity:.95}}).addTo(map);setTimeout(function(){map.invalidateSize();map.fitBounds(line.getBounds(),{padding:[20,20]})},80)}
function paintResult(title,miles,secs,roads){var c=costs(miles,secs);$("result").className="card";$("rTitle").textContent=title;$("rMeta").textContent=miles.toFixed(1)+" mi \u00b7 ~"+Math.round(c.ecoMin)+" min";$("rEco").textContent=money(c.ecoGBP);$("rQuick").textContent=money(c.quickGBP);$("rEcoMeta").textContent=c.ecoUse;$("rQuickMeta").textContent=c.quickUse;$("rRoads").textContent=roads&&roads.length?roads.join(" \u00b7 "):"";lastTrip={title:title,miles:miles,secs:secs,roads:roads||[]}}
function lib(){return window.TRIPS||window.TRIPSPECS||[]}
function searchLib(){var q=($("q").value||"").trim().toLowerCase(),yr=plateYear($("plate").value),box=$("hits");if(q.length<2&&!yr){box.innerHTML="";return}var list=lib(),out=[],i;for(i=0;i<list.length&&out.length<10;i++){var r=list[i],hay=(r[0]+" "+r[1]+" "+r[2]+" "+r[5]).toLowerCase();if(q&&hay.indexOf(q)<0)continue;if(yr){var y0=parseInt(r[3],10)||0,y1=parseInt(r[4],10)||9999;if(yr<y0||yr>y1)continue}out.push({i:i,r:r})}box.innerHTML=out.map(function(o){var r=o.r;return '<button class="hit" type="button" data-i="'+o.i+'">'+r[0]+" "+r[1]+" ("+labelFuel(kind(r[5]))+")</button>"}).join("")||"<p class='muted'>No match in the loaded list.</p>"}
function setCarFromRow(r){setCar({name:[r[0],r[1],r[2]].filter(Boolean).join(" "),fuel:r[5],kind:kind(r[5]),mpg:r[6]||null,kwh:r[7]||null,range:r[8]||null})}
$("q").addEventListener("input",searchLib);
$("plate").addEventListener("input",function(){this.value=this.value.toUpperCase();searchLib()});
$("hits").addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(!b)return;setCarFromRow(lib()[+b.getAttribute("data-i")]);$("hits").innerHTML=""});
$("go").onclick=async function(){showErr("");if(!car){showErr("Pick a car first.");return}var destQ=$("to").value.trim();if(!destQ){showErr("Enter a destination.");return}var t=tripState();$("go").textContent="Looking up\u2026";try{var startQ=$("from").value.trim()||t.home||"";if(!startQ)throw new Error("Set a home first.");var start=(t.homeLat&&startQ===t.home)?{lat:t.homeLat,lon:t.homeLon,name:t.home}:await geocode(startQ);if(startQ!==t.home){t.home=start.name;t.homeLat=start.lat;t.homeLon=start.lon;saveTrip(t)}var dest=await geocode(destQ);var rt=await route(start,dest);lastTrip=Object.assign({query:destQ},rt);paintResult((start.name.split(",")[0])+" \u2192 "+(dest.name.split(",")[0]),rt.miles,rt.secs,rt.roads);if(rt.geo)drawRoute(rt.geo)}catch(err){showErr(err.message||"Could not check that trip")}$("go").textContent="Check trip"};
function paintFavs(){var favs=(tripState().favs)||[];$("favs").innerHTML=favs.map(function(f,i){var c=car?costs(f.miles,f.secs||0):null;return '<button class="hit" type="button" data-f="'+i+'">'+f.label+(c?" \u00b7 "+money(c.ecoGBP):"")+"</button>"}).join("")}
$("favs").addEventListener("click",function(e){var b=e.target.closest("[data-f]");if(!b)return;var f=(tripState().favs||[])[+b.getAttribute("data-f")];if(!f)return;$("to").value=f.query||f.label;paintResult((tripState().home||"Home").split(",")[0]+" \u2192 "+f.label,f.miles,f.secs||0,f.roads||[])});
$("saveFav").onclick=function(){if(!lastTrip||!lastTrip.miles){showErr("Check a trip first.");return}var label=prompt("Name",(lastTrip.title||"").split("\u2192").pop().trim()||"Favourite");if(!label)return;var t=tripState();t.favs=(t.favs||[]).filter(function(f){return f.label!==label});t.favs.unshift({label:label,query:$("to").value.trim(),miles:lastTrip.miles,secs:lastTrip.secs,roads:lastTrip.roads||[]});t.favs=t.favs.slice(0,5);saveTrip(t);paintFavs()};
$("setHome").onclick=async function(){var q=$("from").value.trim();if(!q){showErr("Type a start first.");return}try{var g=await geocode(q);var t=tripState();t.home=g.name;t.homeLat=g.lat;t.homeLon=g.lon;saveTrip(t);$("from").value=g.name;showErr("")}catch(err){showErr(err.message)}};
if(!window.TRIPS||!window.TRIPS.length){window.TRIPS=window.TRIPSPECS&&window.TRIPSPECS.length?window.TRIPSPECS:[["Volvo","XC60 D5","D5","2008","2017","Diesel",38,"",""],["Volvo","XC60 T8","T8","2015","2021","Plug In Hybrid",40,10.4,27],["Volvo","XC60 B4","B4","2017","2026","Diesel",45,"",""],["Mitsubishi","Outlander PHEV","","2014","2021","Plug In Hybrid",40,12,28],["Tesla","Model 3","","2019","2026","Electric","",60,270],["Toyota","Prius","","2016","2022","Hybrid Petrol",83,"",""],["BMW","320d","","2012","2019","Diesel",58,"",""],["VW","Golf GTI","","2009","2020","Petrol",38,"",""],["Skoda","Octavia","","2013","2020","Diesel",64,"",""],["Honda","Civic Type R","","2017","2022","Petrol",36,"",""]]}
(function init(){var t=tripState(),g=garageCar();$("from").value=t.home||"Lancaster";$("to").value="Samlesbury brewery";$("plate").value="SB61LGZ";if(g)setCar({name:g.nick||g.name||"Garage car",fuel:g.fuel||"Diesel",kind:kind(g.fuel),mpg:+g.mpg||38,range:+g.range||null,kwh:+g.kwh||null});else setCar({name:"Volvo XC60 D5",fuel:"Diesel",kind:"diesel",mpg:38});$("libLine").textContent=lib().length.toLocaleString()+" in this Pages build. The 31,973-row sheet was never uploaded (too large for one file).";$("priceLine").textContent="Diesel "+PRICE.diesel+"p \u00b7 petrol "+PRICE.petrol+"p";paintFavs();fetch("prices.json?t="+Date.now()).then(function(r){return r.json()}).then(function(p){PRICE.date=p.date||PRICE.date;PRICE.petrol=+p.petrol_ppl||PRICE.petrol;PRICE.diesel=+p.diesel_ppl||PRICE.diesel;PRICE.electric=+p.electric_pkwh||PRICE.electric;$("priceLine").textContent="Diesel "+PRICE.diesel+"p \u00b7 petrol "+PRICE.petrol+"p \u00b7 "+PRICE.date}).catch(function(){});searchLib()})();
</script>
</body>
</html>
