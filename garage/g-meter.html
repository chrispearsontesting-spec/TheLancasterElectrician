<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>G & Tip</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));min-height:100%}
h1{font-size:20px;margin:4px 0 2px;font-weight:650}
.muted{color:#8b8b8b;font-size:12px;margin:0 0 10px;text-align:center}
.gauge-wrap{position:relative;width:280px;height:280px;flex-shrink:0}
canvas#c{width:280px;height:280px;background:#141416;border-radius:50%;border:1px solid #2a2a2e}
.vals{display:flex;gap:28px;margin:12px 0 4px;font-size:13px;text-align:center;min-height:48px}
.vals b{font-size:20px;display:block;font-weight:650;font-variant-numeric:tabular-nums}
.peaks{font-size:12px;color:#8b8b8b;margin:2px 0 10px;min-height:16px;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.btn{padding:10px 14px;background:#1c1c1e;color:#fff;border:0;border-radius:12px;font-weight:600;text-decoration:none;display:inline-block;font-size:14px}
.btn.rec{background:#e10600}
.btn.rec.on{background:#3dd68c;color:#111}
.chart-wrap{width:100%;max-width:360px;margin-top:14px;display:none}
.chart-wrap.show{display:block}
canvas#chart{width:100%;height:180px;background:#141416;border-radius:12px;border:1px solid #2a2a2e}
.legend{display:flex;gap:14px;font-size:11px;color:#8b8b8b;margin-top:6px;justify-content:center}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%}
.comps{margin-top:10px;font-size:11px;color:#aaa;line-height:1.5}
.comps b{color:#f2f2f2;font-weight:600}
.note{font-size:11px;color:#6a6a6a;margin-top:12px;text-align:center;max-width:320px;line-height:1.4}
</style>
</head>
<body>
<h1>G-force & Tip</h1>
<p class="muted">Mount firmly · Zero when level</p>
<div class="gauge-wrap">
  <canvas id="c"></canvas>
</div>
<div class="vals">
  <div>Lateral<br><b id="lat">0.00</b></div>
  <div>Long<br><b id="lon">0.00</b></div>
  <div>Tip<br><b id="tip">0°</b></div>
</div>
<div class="peaks">Peak lat <span id="pLat">0.00</span> · Peak long <span id="pLon">0.00</span> · Max tip <span id="pTip">0°</span></div>
<div class="btns">
<button class="btn" id="zero" type="button">Zero</button>
<button class="btn rec" id="rec" type="button">Start</button>
<button class="btn" id="allow" type="button">Sensors</button>
<a class="btn" href="drive-hub.html">Back</a>
</div>
<div class="chart-wrap" id="chartWrap">
  <canvas id="chart"></canvas>
  <div class="legend">
    <span><i class="dot" style="background:#73BDE0"></i> Lateral</span>
    <span><i class="dot" style="background:#f5a623"></i> Long</span>
  </div>
  <div class="comps" id="comps"></div>
  <button class="btn" id="dl" type="button" style="margin-top:8px">Download chart</button>
</div>
<p class="note">Rings at 0.5 / 1.0 / 1.5 G. Blue dot = live G. Tip ball: green <15°, amber 15–25°, red >25°. Start recording for a chart.</p>
<script>
const dpr = Math.min(window.devicePixelRatio || 2, 3);
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const chart = document.getElementById('chart');
const cctx = chart.getContext('2d');

function setupCanvas(canvas, cssW, cssH) {
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const context = canvas.getContext('2d');
  context.scale(dpr, dpr);
  return context;
}
setupCanvas(c, 280, 280);
setupCanvas(chart, 340, 180);

const latEl = document.getElementById('lat');
const lonEl = document.getElementById('lon');
const tipEl = document.getElementById('tip');
const pLatEl = document.getElementById('pLat');
const pLonEl = document.getElementById('pLon');
const pTipEl = document.getElementById('pTip');
const allowBtn = document.getElementById('allow');
const zeroBtn = document.getElementById('zero');
const recBtn = document.getElementById('rec');
const chartWrap = document.getElementById('chartWrap');

let lat = 0, lon = 0, tip = 0;
let peakLat = 0, peakLon = 0, peakTip = 0;
let offsetX = 0, offsetY = 0;
const trail = [];
const MAX_TRAIL = 40;
let recording = false;
let samples = [];
let lastPos = null;
let watchId = null;

function drawGauge() {
  const w = 280, h = 280, cx = w/2, cy = h/2, r = 112;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = '#2a2a2e';
  ctx.lineWidth = 1;
  [0.5,1,1.5].forEach(g => {
    ctx.beginPath();
    ctx.arc(cx, cy, r * (g/1.5), 0, Math.PI*2);
    ctx.stroke();
  });
  ctx.beginPath();
  ctx.moveTo(cx-r, cy); ctx.lineTo(cx+r, cy);
  ctx.moveTo(cx, cy-r); ctx.lineTo(cx, cy+r);
  ctx.stroke();

  trail.forEach((p,i) => {
    ctx.fillStyle = `rgba(115,189,224,${(i+1)/trail.length*0.4})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI*2); ctx.fill();
  });

  const absTip = Math.abs(tip);
  let tipCol = '#3dd68c';
  if (absTip > 25) tipCol = '#e10600';
  else if (absTip > 15) tipCol = '#f5a623';
  const tipX = cx + Math.sin(tip * Math.PI/180) * r * 0.48;
  const tipY = cy - Math.cos(tip * Math.PI/180) * r * 0.08;
  ctx.fillStyle = tipCol;
  ctx.beginPath(); ctx.arc(tipX, tipY, 11, 0, Math.PI*2); ctx.fill();

  const scale = r / 1.5;
  const gx = cx + lat * scale;
  const gy = cy - lon * scale;
  ctx.fillStyle = '#73BDE0';
  ctx.beginPath(); ctx.arc(gx, gy, 6.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.stroke();

  ctx.fillStyle = '#555';
  ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI*2); ctx.fill();

  trail.push({x:gx, y:gy});
  if (trail.length > MAX_TRAIL) trail.shift();
}

function drawChart() {
  const w = 340, h = 180;
  cctx.clearRect(0,0,w,h);
  if (samples.length < 2) return;
  const padL = 38, padR = 14, padT = 24, padB = 30;
  const maxG = 4;
  const n = samples.length;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  function x(i){ return padL + (i/(n-1))*plotW; }
  function yG(v){ return padT + plotH/2 - (v/maxG)*(plotH/2); }

  cctx.strokeStyle = '#222';
  cctx.lineWidth = 0.6;
  cctx.font = '11px -apple-system, sans-serif';
  cctx.fillStyle = '#999';
  cctx.textAlign = 'right';
  [-4,-3,-2,-1,0,1,2,3,4].forEach(g => {
    const yy = yG(g);
    cctx.beginPath(); cctx.moveTo(padL, yy); cctx.lineTo(w-padR, yy); cctx.stroke();
    cctx.fillText(g.toFixed(1), padL-6, yy+4);
  });

  cctx.textAlign = 'center';
  cctx.fillStyle = '#999';
  const approxSec = Math.max(1, Math.round(n * 0.04));
  cctx.fillText('0s', padL, h-10);
  cctx.fillText(approxSec+'s', w-padR, h-10);

  cctx.textAlign = 'left';
  cctx.fillStyle = '#ddd';
  cctx.font = '12px -apple-system, sans-serif';
  cctx.fillText('G-force', padL, 16);

  function line(key, col) {
    cctx.strokeStyle = col;
    cctx.lineWidth = 2;
    cctx.lineJoin = 'round';
    cctx.lineCap = 'round';
    cctx.beginPath();
    samples.forEach((s,i) => {
      const yy = yG(s[key]);
      if (i===0) cctx.moveTo(x(i), yy); else cctx.lineTo(x(i), yy);
    });
    cctx.stroke();
  }
  line('lat', '#73BDE0');
  line('lon', '#f5a623');
  // fun comparisons based on peak
  const peak = Math.max(peakLat, peakLon);
  const comps = [
    [0.3, 'Hard braking in a normal car'],
    [0.8, 'Quick road car corner'],
    [1.5, 'Hot hatch / sports car limit'],
    [2.5, 'Rally car on loose surface'],
    [4.0, 'F1 car in a fast corner'],
    [5.0, 'Motorbike knee-down lean'],
    [9.0, 'Fighter jet sustained turn'],
    [20, 'Rocket launch (brief)']
  ];
  let html = '<b>How that compares</b><br>';
  comps.forEach(([g, label]) => {
    const mark = peak >= g ? '●' : '○';
    html += mark + ' ' + g + ' G — ' + label + '<br>';
  });
  document.getElementById('comps').innerHTML = html;
}

document.getElementById('dl').onclick = () => {
  if (samples.length < 2) return;
  const scale = 4;
  const exp = document.createElement('canvas');
  exp.width = 340 * scale;
  exp.height = 180 * scale;
  const ectx = exp.getContext('2d');
  ectx.scale(scale, scale);
  // redraw chart into export canvas by reusing logic is complex; draw current high-dpr canvas
  ectx.drawImage(chart, 0, 0, chart.width/dpr, chart.height/dpr);
  const a = document.createElement('a');
  a.href = exp.toDataURL('image/jpeg', 0.92);
  a.download = 'driv3-g-chart.jpg';
  a.click();
};

function onMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  const rawLat = ((a.x||0)/9.81) - offsetX;
  const rawLon = ((a.y||0)/9.81) - offsetY;
  const rawTip = Math.atan2(a.x||0, a.y||0) * 180 / Math.PI;
  const alpha = 0.28;
  lat = lat * (1-alpha) + rawLat * alpha;
  lon = lon * (1-alpha) + rawLon * alpha;
  tip = tip * (1-alpha) + rawTip * alpha;
  peakLat = Math.max(peakLat, Math.abs(lat));
  peakLon = Math.max(peakLon, Math.abs(lon));
  peakTip = Math.max(peakTip, Math.abs(tip));
  latEl.textContent = lat.toFixed(2);
  lonEl.textContent = lon.toFixed(2);
  tipEl.textContent = Math.round(Math.abs(tip)) + '°';
  pLatEl.textContent = peakLat.toFixed(2);
  pLonEl.textContent = peakLon.toFixed(2);
  pTipEl.textContent = Math.round(peakTip) + '°';
  drawGauge();
  if (recording) {
    samples.push({lat, lon, glat: lastPos ? lastPos.lat : null, glon: lastPos ? lastPos.lon : null, t: Date.now()});
    if (samples.length > 1200) samples.shift();
  }
}

zeroBtn.onclick = () => {
  offsetX = lat + offsetX;
  offsetY = lon + offsetY;
  peakLat = peakLon = peakTip = 0;
  trail.length = 0;
};

recBtn.onclick = () => {
  if (!recording) {
    recording = true;
    samples = [];
    chartWrap.classList.remove('show');
    recBtn.textContent = 'Stop';
    recBtn.classList.add('on');
    if (navigator.geolocation) {
      watchId = navigator.geolocation.watchPosition(pos => {
        lastPos = {lat: pos.coords.latitude, lon: pos.coords.longitude};
      }, () => {}, {enableHighAccuracy: true, maximumAge: 1000});
    }
  } else {
    recording = false;
    recBtn.textContent = 'Start';
    recBtn.classList.remove('on');
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (samples.length > 2) {
      chartWrap.classList.add('show');
      drawChart();
      showPeaks();
    }
  }
};

function showPeaks() {
  const peaks = samples.filter(s => Math.abs(s.lat) > 0.7 || Math.abs(s.lon) > 0.7);
  if (!peaks.length) return;
  const withPos = peaks.filter(s => s.glat);
  let html = '<b>High-G moments</b><br>';
  if (withPos.length) {
    // group roughly
    const seen = new Set();
    withPos.slice(0, 8).forEach(s => {
      const key = s.glat.toFixed(4) + ',' + s.glon.toFixed(4);
      if (seen.has(key)) return;
      seen.add(key);
      const g = Math.max(Math.abs(s.lat), Math.abs(s.lon)).toFixed(2);
      html += g + ' G near <a href="https://www.google.com/maps?q=' + s.glat + ',' + s.glon + '" target="_blank" style="color:#73BDE0">map</a><br>';
    });
  } else {
    html += 'GPS not available for this recording.<br>';
  }
  document.getElementById('comps').innerHTML += '<br>' + html;
}

allowBtn.onclick = async () => {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try { await DeviceMotionEvent.requestPermission(); } catch(e){}
    }
    window.addEventListener('devicemotion', onMotion);
    allowBtn.textContent = 'Listening';
    allowBtn.disabled = true;
  } catch(err) {
    alert('Could not start sensors');
  }
};

if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') {
  window.addEventListener('devicemotion', onMotion);
  allowBtn.style.display = 'none';
}
drawGauge();
</script>
</body>
</html>
