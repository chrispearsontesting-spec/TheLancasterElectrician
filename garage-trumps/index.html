<!DOCTYPE html><html lang=en-GB><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=apple-mobile-web-app-capable content=yes><meta name=theme-color content=#0b0c0f><title>Garage</title><style>:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--gold:#e4c48a;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,sans-serif;overflow:hidden;height:100dvh}#deck{display:flex;width:200%;height:100%;transition:transform .28s ease}#deck.game{transform:translateX(-50%)}.page{width:50%;height:100%;padding:calc(16px + env(safe-area-inset-top)) 16px 22px;overflow:auto}.hint{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.hero{border-radius:22px;overflow:hidden;border:1px solid rgba(228,196,138,.35);background:#14110c}.hero img{width:100%;height:200px;object-fit:cover;display:block;background:#1a1712}.hero .cap{padding:12px 14px}.hero h1{margin:0;font-size:20px}.addshot{display:block;text-align:center;padding:70px 16px;color:var(--gold);font-weight:800}.due,.money{margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#14161b}.due .r,.money .r{display:flex;justify-content:space-between;padding:11px 12px;border-top:1px solid var(--line);font-size:14px}.due .r:first-child,.money .r:first-child{border-top:0}.soon{color:#e4c48a}.late{color:#e7b1a0}.btn{width:100%;border:0;border-radius:14px;padding:12px;font-weight:800;margin-top:8px}.gold{background:var(--gold);color:#111}.ghost{background:#171a20;color:var(--ink);border:1px solid var(--line)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font-size:16px}label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);padding:calc(20px + env(safe-area-inset-top)) 14px 20px;overflow:auto;z-index:5}.sheet.on{display:block}.panel{background:#14161b;border-radius:18px;padding:14px;max-width:440px;margin:0 auto}.qr{width:120px;height:120px;background:#fff;border-radius:12px;float:right;margin:0 0 8px 8px}.win{background:#2a2418;border:1px solid rgba(228,196,138,.35);border-radius:16px;padding:12px;margin-top:10px;clear:both}.grid{display:grid;grid-template-columns:1fr 1fr}.stat{padding:10px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line)}.stat:nth-child(2n){border-right:0}.stat span{display:block;color:var(--dim);font-size:10px;text-transform:uppercase}.stat b{font-size:18px}</style></head><body><div id=deck><section class=page><div class=hint>Swipe left for Garage Trumps</div><div class=hero id=hero></div><div class=due id=dues></div><div class=money id=money></div><div class=row2><button class="btn ghost" id=openSet>Settings</button><button class="btn gold" id=toGame>Trumps</button></div></section><section class=page><div class=hint>Swipe right for garage</div><img class=qr id=qr alt=QR><div class=hero id=card></div><p class=hint id=joinStr style="text-transform:none;letter-spacing:0;font-size:11px;clear:both;word-break:break-all"></p><label>Rounds</label><select id=rounds><option>3</option><option selected>5</option><option>7</option></select><button class="btn gold" id=deal>Deal next</button><button class="btn ghost" id=recap>Who won</button><div id=out></div></section></div><div class=sheet id=sheet><div class=panel><h2 style=margin:0 0 8px>Settings</h2><label>Car name</label><input id=carName placeholder="Your car details here"><label>Photo — camera or camera roll, stays on this phone</label><input id=photo type=file accept=image/* capture=environment><label>MOT</label><input id=mot type=date><label>Tax</label><input id=tax type=date><label>Insurance</label><input id=ins type=date><label>Oil / service</label><input id=oil type=date><label>Tyres fitted</label><input id=tyreDate type=date><label>Tyre life (miles)</label><input id=tyreLife type=number placeholder=20000><label>Miles per year</label><input id=miles type=number placeholder=12000><label>MPG</label><input id=mpg type=number placeholder=38><label>Fuel</label><select id=fuel><option value=petrol>Petrol</option><option value=diesel>Diesel</option></select><label>Pence per litre (UK average, editable)</label><input id=ppl type=number step=0.1><label>Insurance pounds / year</label><input id=insCost type=number><label>Tax pounds / year</label><input id=taxCost type=number><label>0-60 / BHP (Trumps only)</label><div class=row2><input id=s060 placeholder=0-60><input id=bhp placeholder=BHP></div><label>Torque Nm / boot L</label><div class=row2><input id=nm placeholder=Nm><input id=boot placeholder=Boot></div><label>Garage phone</label><input id=gPhone type=tel><label>Remind days before</label><select id=lead><option>7</option><option selected>14</option><option>30</option></select><button class="btn gold" id=save>Save</button><button class="btn ghost" id=cal>Add dates to Calendar</button><button class="btn ghost" id=close>Back</button></div></div><script>var SEED={petrol:162.1,diesel:183.6,asof:"2 Sep 2026"};function $(i){return document.getElementById(i)}function load(){try{return JSON.parse(localStorage.getItem("gt.me")||"null")}catch(e){return null}}function dates(){try{return JSON.parse(localStorage.getItem("gt.dates")||"{}")}catch(e){return {}}}function saveCar(c){localStorage.setItem("gt.me",JSON.stringify(c))}function saveDates(d){localStorage.setItem("gt.dates",JSON.stringify(d))}function blank(){return {name:"Your car details here",nick:"Your car details here",s060:"-",bhp:"-",nm:"-",boot:"-"}}function code(){var c=localStorage.getItem("gt.code");if(!c){c="GT-"+Math.random().toString(36).slice(2,6).toUpperCase();localStorage.setItem("gt.code",c)}return c}function days(iso){if(!iso)return null;return Math.round((new Date(iso+"T12:00:00")-new Date())/86400000)}function label(n){if(n==null)return "Set date";if(n<0)return Math.abs(n)+" days overdue";if(n===0)return "Due today";return n+" days"}function tone(n){if(n==null)return "";if(n<0)return "late";if(n<=+(dates().lead||14))return "soon";return ""}function tyreLeft(d){if(!d.tyreDate||!d.tyreLife||!d.miles)return null;var used=(new Date()-new Date(d.tyreDate+"T12:00:00"))/86400000/365*(+d.miles);return Math.max(0,Math.round(100*(1-used/+d.tyreLife)))}function fuelCost(d){var miles=+(d.miles||0),mpg=+(d.mpg||0),ppl=+(d.ppl||SEED[d.fuel||"petrol"]);if(!miles||!mpg)return null;var y=miles/mpg*4.546*ppl/100;return {month:y/12,year:y,ppl:ppl}}function paint(){var c=load()||blank(),d=dates();var shot=c.photo?'<img src="'+c.photo+'" alt="car">':'<label class=addshot>Tap to add a photo of your car<input id=photoTop type=file accept=image/* capture=environment style=display:none></label>';$("hero").innerHTML=shot+'<div class=cap><h1>'+(c.nick||c.name)+'</h1><div class=dim>Garage reminder</div></div>';var top=$("photoTop");if(top)top.onchange=$("photo").onchange;var tl=tyreLeft(d);$("dues").innerHTML=[["MOT",label(days(d.mot)),tone(days(d.mot))],["Tax",label(days(d.tax)),tone(days(d.tax))],["Insurance",label(days(d.ins)),tone(days(d.ins))],["Oil / service",label(days(d.oil)),tone(days(d.oil))],["Tyres",tl==null?"Set tyres":tl+"% left",tl!=null&&tl<=20?"soon":""]].map(function(r){return '<div class=r><span>'+r[0]+'</span><b class="'+r[2]+'">'+r[1]+'</b></div>'}).join("");var f=fuelCost(d),ins=+(d.insCost||0),tax=+(d.taxCost||0),month=(ins+tax)/12+(f?f.month:0);$("money").innerHTML='<div class=r><span>Fuel this month</span><b>'+(f?"£"+f.month.toFixed(0):"Set miles + MPG")+'</b></div><div class=r><span>Fuel this year</span><b>'+(f?"£"+f.year.toFixed(0):"-")+'</b></div><div class=r><span>Tax + insurance / year</span><b>'+(ins||tax?"£"+(ins+tax).toFixed(0):"Set in settings")+'</b></div><div class=r><span>Running total / month</span><b>'+(month?"£"+month.toFixed(0):"-")+'</b></div><div class=r><span>UK '+(d.fuel||"petrol")+' avg</span><b>'+(d.ppl||SEED[d.fuel||"petrol"])+"p · "+SEED.asof+"</b></div>";var cardShot=c.photo?'<img src="'+c.photo+'" alt="">':'<div class=addshot>Add a photo in Settings</div>';$("card").innerHTML=cardShot+'<div class=cap><h1>'+(c.nick||c.name)+'</h1></div><div class=grid>'+[["0-60",(c.s060||"-")+"s"],["BHP",c.bhp||"-"],["Torque",(c.nm||"-")+" Nm"],["Boot",(c.boot||"-")+" L"]].map(function(s){return '<div class=stat><span>'+s[0]+'</span><b>'+s[1]+'</b></div>'}).join("")+'</div>';var payload=["GTJOIN",code(),c.nick||c.name,c.s060||"",c.bhp||"",c.nm||"",c.boot||"",0].join("|");var url=location.origin+location.pathname.replace(/index.html$/,"")+"?join="+encodeURIComponent(payload);$("joinStr").textContent=url;$("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+encodeURIComponent(url);$("carName").value=c.nick||c.name||"";$("mot").value=d.mot||"";$("tax").value=d.tax||"";$("ins").value=d.ins||"";$("oil").value=d.oil||"";$("tyreDate").value=d.tyreDate||"";$("tyreLife").value=d.tyreLife||"";$("miles").value=d.miles||"";$("mpg").value=d.mpg||"";$("fuel").value=d.fuel||"petrol";$("ppl").value=d.ppl||SEED[d.fuel||"petrol"];$("insCost").value=d.insCost||"";$("taxCost").value=d.taxCost||"";$("s060").value=c.s060&&c.s060!=="-"?c.s060:"";$("bhp").value=c.bhp&&c.bhp!=="-"?c.bhp:"";$("nm").value=c.nm&&c.nm!=="-"?c.nm:"";$("boot").value=c.boot&&c.boot!=="-"?c.boot:"";$("gPhone").value=d.gPhone||"";$("lead").value=String(d.lead||14)}$("openSet").onclick=function(){$("sheet").className="sheet on"};$("close").onclick=function(){$("sheet").className="sheet"};$("toGame").onclick=function(){$("deck").className="game"};var x0=0;document.getElementById("deck").addEventListener("touchstart",function(e){x0=e.changedTouches[0].clientX});document.getElementById("deck").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-x0;if(dx<-40)$("deck").className="game";if(dx>40)$("deck").className=""});$("save").onclick=function(){var c=load()||blank();c.nick=$("carName").value||"Your car details here";c.name=c.nick;c.s060=$("s060").value||"-";c.bhp=$("bhp").value||"-";c.nm=$("nm").value||"-";c.boot=$("boot").value||"-";saveDates({mot:$("mot").value,tax:$("tax").value,ins:$("ins").value,oil:$("oil").value,tyreDate:$("tyreDate").value,tyreLife:$("tyreLife").value,miles:$("miles").value,mpg:$("mpg").value,fuel:$("fuel").value,ppl:$("ppl").value,insCost:$("insCost").value,taxCost:$("taxCost").value,gPhone:$("gPhone").value,lead:+$("lead").value});saveCar(c);paint();$("sheet").className="sheet"};function readPhoto(input){input.onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var cv=document.createElement("canvas"),w=720,h=Math.round(img.height/img.width*720);cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);var c=load()||blank();c.photo=cv.toDataURL("image/jpeg",0.72);saveCar(c);paint()};img.src=r.result};r.readAsDataURL(f)}}readPhoto($("photo"));$("cal").onclick=function(){var d=dates(),lead=+(d.lead||14),ev=[];[["MOT",d.mot],["Tax",d.tax],["Insurance",d.ins],["Oil",d.oil]].forEach(function(x){if(!x[1])return;var s=new Date(x[1]+"T12:00:00");s.setDate(s.getDate()-lead);ev.push("BEGIN:VEVENT\nSUMMARY:"+x[0]+" reminder\nDTSTART;VALUE=DATE:"+s.toISOString().slice(0,10).replace(/-/g,"")+"\nEND:VEVENT")});var a=document.createElement("a");a.href="data:text/calendar,"+encodeURIComponent("BEGIN:VCALENDAR\nVERSION:2.0\n"+ev.join("\n")+"\nEND:VCALENDAR");a.download="garage.ics";a.click()};var JOBS=[{t:"Flash flood.",fn:function(c){return (c.clear||1)*6},w:"Height wins.",l:"Street furniture."},{t:"Ikea run.",fn:function(c){return (parseFloat(c.boot)||300)/15},w:"Swallows the Billy.",l:"Allen key only."},{t:"Last orders.",fn:function(c){return (12-(parseFloat(c.s060)||10))*3},w:"First to the door.",l:"Arrives as a rumour."},{t:"Wet dog.",fn:function(c){return (parseFloat(c.boot)||300)/20},w:"Dog in the boot.",l:"Dog on a lap."},{t:"Black ice.",fn:function(c){return (c.awd||0)*6},w:"Driven wheels.",l:"A slide."}];var st={i:0,order:[],scores:{},log:[]};function rival(){try{var r=JSON.parse(localStorage.getItem("gt.rival")||"null");if(r)return r}catch(e){}return {name:"Friend's car details here",s060:"-",bhp:"-",nm:"-",boot:"-"}}$("deal").onclick=function(){var me=load()||blank(),them=rival();if(!st.order.length){var n=+$("rounds").value;st={i:0,order:JOBS.map(function(_,i){return i}).sort(function(){return Math.random()-.5}).slice(0,n),scores:{},log:[]}}if(st.i>=st.order.length){$("recap").click();return}var job=JOBS[st.order[st.i++]],a={c:me,s:job.fn(me)},b={c:them,s:job.fn(them)};var ranked=[a,b].sort(function(x,y){return y.s-x.s}),kn=function(c){return c.nick||c.name};st.scores[kn(ranked[0].c)]=(st.scores[kn(ranked[0].c)]||0)+3;st.scores[kn(ranked[1].c)]=(st.scores[kn(ranked[1].c)]||0)+1;st.log.push({t:job.t,win:kn(ranked[0].c)});$("out").innerHTML='<div class=win><div class=dim>'+st.log.length+' / '+st.order.length+'</div><h3 style=margin:6px 0>'+job.t+'</h3><b>'+kn(ranked[0].c)+' - '+job.w+'</b><p>'+kn(ranked[1].c)+' - '+job.l+'</p></div>'};$("recap").onclick=function(){var board=Object.keys(st.scores).map(function(k){return {k:k,s:st.scores[k]}}).sort(function(a,b){return b.s-a.s});$("out").innerHTML='<div class=win><h3>'+(board[0]?board[0].k:"?")+' takes the table</h3>'+board.map(function(b){return '<div>'+b.k+' - '+b.s+' pts</div>'}).join('')+'</div>';st={i:0,order:[],scores:{},log:[]}};(function(){var q=new URLSearchParams(location.search).get("join");if(!q)return;var p=decodeURIComponent(q).split("|");if(p[0]!=="GTJOIN")return;localStorage.setItem("gt.rival",JSON.stringify({name:p[2]||"Friend's car",nick:p[2],s060:p[3],bhp:p[4],nm:p[5],boot:p[6]}));if(p[1])localStorage.setItem("gt.code",p[1]);$("deck").className="game"})();paint();</script></body></html>
