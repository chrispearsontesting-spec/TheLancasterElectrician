<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<link rel="stylesheet" href="./ui.css"/>
<title>Service cost estimates</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(10px + env(safe-area-inset-top)) 12px 28px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:#9aa3b0;font-size:13px;margin:0 0 16px}
label{display:block;color:#9aa3b0;font-size:12px;margin:10px 0 4px}
input[type=search]{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:16px}
.status{min-height:18px;margin:6px 0 0;font-size:13px;color:#9aa3b0}
.status.ok{color:#9fd8ff;font-weight:700}
.sugs{margin-top:6px}
.sug{display:block;width:100%;text-align:left;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;margin-top:5px;font-size:15px;font-weight:600;cursor:pointer}
.sug b{color:#9fd8ff;font-weight:800}
.card{background:#14161b;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.note{padding:10px 14px 14px;color:#9aa3b0;font-size:12px;line-height:1.4}
.hide{display:none}
.btn{display:block;background:#2a2e36;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:800;font-size:15px;text-align:center;width:100%;margin-top:8px;cursor:pointer}
.acc{background:#14161b;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.acc > button{width:100%;background:transparent;border:0;color:var(--ink);font:inherit;font-size:15px;font-weight:800;text-align:left;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.acc > button span{color:#9aa3b0;font-size:18px;line-height:1}
.acc .panel{display:none;padding:0 14px 14px}
.acc.open .panel{display:block}
.acc.open > button span{transform:rotate(45deg)}
</style>
</head>
<body>
<h1>Service cost estimates</h1>
<p class="sub" id="carLine">Volvo XC60 D5</p>
<label>Search a job or part</label>
<input type="search" id="qBox" placeholder="Start typing, e.g. clutch" autocomplete="off"/>
<div class="sugs" id="sugs"></div>
<p class="status" id="status"></p>
<div class="card hide" id="quoteBox"><div id="quotes"></div><p class="note" id="jobNote"></p></div>
<div class="acc" id="buyAcc">
  <button type="button" id="buyToggle">Where to buy <span>+</span></button>
  <div class="panel">
    <a class="btn" id="btnGsf" target="_blank" rel="noopener" href="#">GSF Car Parts</a>
    <a class="btn" id="btnEcp" target="_blank" rel="noopener" href="#">Euro Car Parts</a>
    <a class="btn" id="btnEbay" target="_blank" rel="noopener" href="#">eBay</a>
  </div>
</div>
<div class="acc" id="guideAcc">
  <button type="button" id="guideToggle">How-to guides <span>+</span></button>
  <div class="panel">
    <a class="btn" id="btnYt" target="_blank" rel="noopener" href="#">YouTube</a>
    <a class="btn" id="btnHaynes" target="_blank" rel="noopener" href="#">Haynes</a>
  </div>
</div>
<a class="btn" href="home.html">Back</a>
<script src="./jobs-data.js"></script>
<script>
var picked=null;
function car(){
  try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");if(s&&s.cars&&s.cars.length)return s.cars[s.i]||s.cars[0]}catch(e){}
  return {nick:"Volvo XC60 D5",name:"Volvo XC60 D5",plate:"SB61LGZ",fuel:"diesel"};
}
function qname(c){return String(c.nick||c.name||"").trim()||"car"}
function clsOf(c){
  var n=(qname(c)+" "+String(c.fuel||"")).toLowerCase();
  if(/ferrari|lamborghini|mclaren|bugatti|pagani|koenigsegg|aston martin/.test(n)) return {k:"exotic",m:3.2,lab:"exotic",indie:120,dealer:240};
  if(/rolls-royce|rolls royce|bentley|maybach/.test(n)) return {k:"luxury",m:2.2,lab:"luxury",indie:95,dealer:190};
  if(/911|cayman|boxster|amg |\\bm3\\b|\\bm4\\b|\\bm5\\b|rs3|rs4|rs6|supra|gt-r|civic type r|gr yaris|lotus|focus rs/.test(n)) return {k:"sports",m:1.7,lab:"sports",indie:75,dealer:150};
  if(/range rover|defender|discovery|xc90|xc60|xc40|x5|x6|x7|q7|q8|gle|gls|glc|cayenne|macan|touareg|land cruiser/.test(n)) return {k:"prem_suv",m:1.55,lab:"premium SUV",indie:70,dealer:140};
  if(/qashqai|tiguan|kuga|sportage|tucson|rav4|cr-v|karoq|ateca|outlander|santa fe|sorento|forester|cx-5|kodiaq/.test(n)) return {k:"suv",m:1.25,lab:"SUV",indie:62,dealer:115};
  if(/bmw|mercedes|benz|audi|porsche|lexus|jaguar|land rover|volvo|mini cooper|maserati|alfa romeo/.test(n)) return {k:"premium",m:1.4,lab:"premium",indie:68,dealer:130};
  if(/fiesta|corsa|polo|ibiza|fabia|yaris|jazz|swift|i20|clio|208|c3|micra/.test(n)) return {k:"small",m:0.85,lab:"small car",indie:58,dealer:100};
  if(/aygo|108|107|i10|picanto|up!|citigo|spark|c1/.test(n)) return {k:"city",m:0.75,lab:"city car",indie:55,dealer:95};
  if(/transit|vivaro|sprinter|crafter|ducato|boxer|relay|trafic|transporter|hilux|ranger|l200/.test(n)) return {k:"van",m:1.2,lab:"van / pickup",indie:60,dealer:105};
  return {k:"family",m:1,lab:"family car",indie:60,dealer:110};
}
function gbp(n){return "\u00a3"+Math.round(n/10)*10}
function row(n,p){return "<div class='item'><span>"+n+"</span><b>"+p+"</b></div>"}
function term(){return picked?picked.buy:(document.getElementById("qBox").value.trim()||"service kit")}
function links(){
  var name=qname(car()), buy=term();
  var q=encodeURIComponent(name+" "+buy);
  document.getElementById("btnGsf").href="https://www.gsfcarparts.com/catalogsearch/result/?q="+q;
  document.getElementById("btnEcp").href="https://www.eurocarparts.com/search?q="+q;
  document.getElementById("btnEbay").href="https://www.ebay.co.uk/sch/i.html?_nkw="+q;
  document.getElementById("btnYt").href="https://www.youtube.com/results?search_query="+encodeURIComponent(name+" "+buy+" how to UK");
  document.getElementById("btnHaynes").href="https://uk.haynes.com/search?q="+encodeURIComponent(name);
}
function matchJobs(q){
  q=String(q||"").toLowerCase().trim();
  if(q.length<1)return [];
  var hits=WORK.filter(function(w){return (w.name+" "+w.buy+" "+w.id).toLowerCase().indexOf(q)>=0});
  hits.sort(function(a,b){
    var an=a.name.toLowerCase(), bn=b.name.toLowerCase();
    var as=an.indexOf(q)===0?0:(an.indexOf(q)>=0?1:2);
    var bs=bn.indexOf(q)===0?0:(bn.indexOf(q)>=0?1:2);
    return as-bs || an.length-bn.length;
  });
  return hits.slice(0,6);
}
function mark(text,q){
  var i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return text;
  return text.slice(0,i)+"<b>"+text.slice(i,i+q.length)+"</b>"+text.slice(i+q.length);
}
function showSugs(){
  var q=document.getElementById("qBox").value;
  var box=document.getElementById("sugs");
  if(picked && picked.name===q){box.innerHTML="";return}
  var hits=matchJobs(q);
  box.innerHTML=hits.map(function(w){return "<button type='button' class='sug' data-id='"+w.id+"'>"+mark(w.name,q)+"</button>"}).join("");
}
function pickJob(id){
  picked=WORK.filter(function(w){return w.id===id})[0]||null;
  if(!picked)return;
  document.getElementById("qBox").value=picked.name;
  document.getElementById("sugs").innerHTML="";
  document.getElementById("status").textContent="Estimate for "+picked.name;
  document.getElementById("status").className="status ok";
  draw();
}
function draw(){
  var c=car(), name=qname(c), cls=clsOf(c);
  document.getElementById("carLine").textContent=name+(c.plate?(" \u00b7 "+String(c.plate).toUpperCase()):"")+" \u00b7 "+cls.lab+" estimate";
  var job=picked;
  if(job){
    var m=cls.m;
    var partsLo=job.plo*m, partsHi=job.phi*m;
    var indLo=job.hrs*cls.indie+partsLo;
    var indHi=job.hrs*cls.indie+partsHi;
    var dealLo=job.hrs*cls.dealer+partsLo*1.35;
    var dealHi=job.hrs*cls.dealer+partsHi*1.45;
    document.getElementById("quotes").innerHTML=
      row("DIY (parts only)",gbp(partsLo)+"\u2013"+gbp(partsHi))+
      row("Local garage",gbp(indLo)+"\u2013"+gbp(indHi))+
      row("Main dealer",gbp(dealLo)+"\u2013"+gbp(dealHi))+
      row("Labour used",job.hrs+" hrs \u00b7 indie \u00a3"+cls.indie+"/hr \u00b7 dealer \u00a3"+cls.dealer+"/hr");
    document.getElementById("jobNote").textContent=(job.note?job.note+" ":"")+"North West 2026 estimate for a "+cls.lab+". Not a quote.";
    document.getElementById("quoteBox").className="card";
  }else document.getElementById("quoteBox").className="card hide";
  links();
}
function toggleAcc(id){
  var el=document.getElementById(id);
  el.className=el.className.indexOf("open")>=0?"acc":"acc open";
}
document.getElementById("buyToggle").onclick=function(){toggleAcc("buyAcc")};
document.getElementById("guideToggle").onclick=function(){toggleAcc("guideAcc")};
document.getElementById("qBox").addEventListener("input",function(){
  picked=null;
  document.getElementById("quoteBox").className="card hide";
  document.getElementById("status").textContent="";
  showSugs();
  links();
});
document.getElementById("sugs").addEventListener("click",function(e){
  var b=e.target.closest("[data-id]");
  if(b) pickJob(b.getAttribute("data-id"));
});
document.getElementById("qBox").addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  e.preventDefault();
  var hits=matchJobs(this.value);
  if(hits[0]) pickJob(hits[0].id);
  else {
    document.getElementById("status").textContent="No saved estimate for that — buy and guide links are ready.";
    document.getElementById("status").className="status ok";
    links();
  }
});
(function(){
  var p=new URLSearchParams(location.search);
  if(p.get("q")) document.getElementById("qBox").value=p.get("q");
  if(p.get("job")) pickJob(p.get("job"));
  else { showSugs(); draw(); }
})();
</script>
</body>
</html>
