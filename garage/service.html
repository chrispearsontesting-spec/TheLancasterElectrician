<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(10px + env(safe-area-inset-top)) 12px 28px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:#9aa3b0;font-size:13px;margin:0 0 16px}
label{display:block;color:#9aa3b0;font-size:12px;margin:10px 0 4px}
input[type=search]{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:16px}
.status{min-height:18px;margin:6px 0 0;font-size:13px;color:#9aa3b0}
.status.ok{color:#9fd8ff;font-weight:700}
.sugs{margin-top:6px}
.sug{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;margin-top:5px;font-size:15px;font-weight:600;cursor:pointer}
.card{background:#14161b;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.note{padding:10px 14px 14px;color:#9aa3b0;font-size:12px;line-height:1.4}
.hide{display:none}
.status:empty,.sugs:empty{display:none}
.acc > button{background:none !important;box-shadow:none !important;border:0 !important;min-height:52px}
.btn{display:flex;align-items:center;justify-content:flex-start;gap:10px;background:#1c1c1e;color:var(--ink);text-decoration:none;border:0;border-radius:18px;padding:14px 16px;font-weight:600;font-size:15px;text-align:left;width:100%;margin-top:8px;cursor:pointer}
.acc{background:#141416;border:1px solid #2a2a2e;border-radius:18px;overflow:hidden;margin:14px 0}
.acc > button{width:100%;margin:0;background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;font-weight:600;text-align:left;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:12px}
.acc > button .chev{margin-left:auto;color:#8b8b8b;font-size:18px}
.acc .panel{display:none;padding:0 14px 14px}
.acc.open .panel{display:block}
.acc.open > button .chev{transform:rotate(45deg)}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 6px}
.chip{appearance:none;-webkit-appearance:none;background:#1c1f26;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;max-width:100%}
.rate{display:flex;align-items:center;gap:6px;background:#1c1f26;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;color:#9aa3b0;margin:0}
.rate input{width:56px;background:transparent;border:0;color:var(--ink);font-size:14px;font-weight:600;padding:4px 0}
.hcard{background:#14161b;border:1px solid var(--line);border-radius:16px;margin:14px 0;padding:4px 14px 12px}
.hcard h2{font-size:16px;margin:12px 0 4px}
.pRow{border-top:1px solid var(--line);padding:11px 0}.pRow:first-of-type{border-top:0}
.pTop{display:flex;align-items:center;gap:8px}.pTop b{flex:1;font-size:15px}
.pWhen{font-size:12px;color:#9aa3b0}.pWhen.over{color:#f59e0b}
.pX{background:none;border:0;color:#8b8b8b;font-size:15px;padding:2px 4px;cursor:pointer}
.pRow.isDone .pTop b{text-decoration:line-through;color:#9aa3b0}.pMoney.done{color:#3dd68c}.pDone{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;border:1px solid #2a2a2e;border-radius:12px;font-size:13px;cursor:pointer}.pDone input{width:20px;height:20px;margin:0;accent-color:#3dd68c}.pRow.isDone .pDone{background:#11241f;color:#a7f3d0;border-color:#1e3a34}.pDoneBtn{margin-top:6px;padding:6px 10px;border:1px solid #2a2a2e;border-radius:12px;background:none;color:inherit;font-size:13px}
.pEst{margin:4px 0 0;font-size:14px;color:#e8e3d8}.pEst.muted,.muted{color:#9aa3b0}
.pPick{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:12px}
.pPick select{flex:1;min-width:0;background:#171a20;border:1px solid var(--line);color:#cfd5de;border-radius:8px;padding:5px 6px;font-size:12px}
.pEmpty{font-size:13px;margin:8px 0}
.tot{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:14px}.tot:empty{display:none}
.tot b{color:#fff}.tot small,.act small{color:#8b93a0;font-size:11px;margin-left:4px}
.act{margin:6px 0 0;font-size:13px;color:#cfd5de}.act b{color:#7ee0a1}
.gSearch{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px;font-size:15px;margin:2px 0 6px}
.gRow{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.gTxt{flex:1;min-width:0}.gTxt b{display:block;font-size:14px}.gTxt small{display:block;font-size:13px;color:#e8e3d8;margin-top:2px}.gTxt .gH{color:#8b93a0;font-size:12px}
.gAdd{background:#1f2a1f;color:#a7f3d0;border:1px solid #2c4a33;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;white-space:nowrap}.gAdd[disabled]{opacity:.55}
.gCat{margin:14px 0 2px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#9fd8ff}.gW{display:block;font-size:12px;color:#f59e0b;margin-top:2px}
.gCount{font-size:12px;color:#8b93a0;margin:0 0 4px}
.pAmt{display:flex;align-items:center;gap:2px;color:#9aa3b0;font-size:14px}.pAmt input{width:70px;background:#171a20;border:1px solid var(--line);color:#fff;border-radius:8px;padding:5px 6px;font-size:14px;font-weight:600}
.pMoney{font-size:14px;font-weight:700;color:#fff;white-space:nowrap}.pMoney.q{color:#f59e0b;font-weight:600;font-size:13px}
.pDate{background:#171a20;border:1px solid var(--line);color:#fff;border-radius:8px;padding:4px 6px;font-size:13px;margin-left:4px}
.src{font-size:12px;color:#9fd8ff;margin:4px 0 2px}.tg{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;background:#2a2f38;color:#cfd5de}.tg.major,.tg.dangerous,.tg.fail{background:#3a1d1d;color:#fca5a5}.tg.minor{background:#3a2e14;color:#fcd34d}
.addPlan{margin:0 14px 14px;width:calc(100% - 28px);background:#1f2a1f;color:#a7f3d0;border:1px solid #2c4a33;border-radius:12px;padding:11px;font-size:14px;font-weight:600}

.gCatBox{margin:0;border:0;padding:0}
.gCatBox>summary.gCat{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.gCatBox>summary.gCat::-webkit-details-marker{display:none}
.gCatBox>summary.gCat::after{content:"\203A";margin-left:auto;color:#8b8b8b;font-size:16px;letter-spacing:0;text-transform:none}
.gCatBox[open]>summary.gCat::after{transform:rotate(90deg)}
</style>
</head>
<body>
<a class="hback" href="home.html" style="display:inline-block;color:#a8ccff;text-decoration:none;font-size:13px;padding:4px 0 8px">‹ Home</a>
<h1>Maintenance planner</h1>
<p class="sub" id="carLine"></p>
<div class="chips"><select class="chip" id="sizeSel" aria-label="Car size for estimates"></select><label class="rate" for="rateIn">Labour £<input id="rateIn" type="number" inputmode="decimal" min="10" max="400" step="1"/>/hr</label></div>
<div class="acc" id="planCard"><button type="button" id="planToggle" data-ico="cal"><span id="planHead">Planned work</span> <span class="chev">+</span></button><div class="panel"><div id="planList"></div><p class="tot" id="planTot"></p><p class="act" id="planAct"></p></div></div>
<div class="acc" id="motAcc"><button type="button" id="motToggle" data-ico="check"><span id="motHead">Expected costs from MOT</span> <span class="chev">+</span></button><div class="panel"><div id="motList"></div><p class="note" style="padding:6px 0 0">Estimates for your car's size. Advisories don't always need doing straight away.</p></div></div>
<label>Search a job or part</label>
<input type="search" id="qBox" placeholder="Start typing, e.g. clutch" autocomplete="off"/>
<div class="sugs" id="sugs"></div>
<p class="status" id="status"></p>
<div class="card hide" id="quoteBox"><div id="quotes"></div><p class="note" id="jobNote"></p></div>
<div class="acc" id="buyAcc">
  <button type="button" id="buyToggle" data-ico="box">Where to buy <span class="chev">+</span></button>
  <div class="panel">
    <a class="btn" id="btnGsf" data-ico="box" target="_blank" rel="noopener" href="#">GSF Car Parts</a>
    <a class="btn" id="btnEcp" data-ico="box" target="_blank" rel="noopener" href="#">Euro Car Parts</a>
    <a class="btn" id="btnEbay" data-ico="box" target="_blank" rel="noopener" href="#">eBay</a>
  </div>
</div>
<div class="acc" id="guideAcc">
  <button type="button" id="guideToggle" data-ico="play">How-to guides <span class="chev">+</span></button>
  <div class="panel">
    <a class="btn" id="btnYt" data-ico="yt" target="_blank" rel="noopener" href="#">YouTube</a>
    <a class="btn" id="btnHaynes" data-ico="book" target="_blank" rel="noopener" href="#">Haynes</a>
  </div>
</div>
<div class="acc" id="costAcc">
  <button type="button" id="costToggle" data-ico="book">Job cost guide <span class="chev">+</span></button>
  <div class="panel"><p class="gCount" id="guideCount"></p><input type="search" class="gSearch" id="guideQ" placeholder="Search jobs, e.g. timing belt" autocomplete="off"/><div id="guideList"></div>
  <p class="note" style="padding:8px 0 0">North West estimates for 2026, sized for your car. DIY is parts only; a garage adds labour at your rate. Not a quote.</p></div>
</div>
<script src="./jobs-data.js"></script>
<script src="./car-scope.js?v=1"></script>
<script src="./reminders-core.js?v=5"></script>
<script src="./diy-work.js?v=3"></script>
<script src="./mot-config.js"></script>
<script src="./mot-client.js"></script>
<script src="./maint-link.js?v=1"></script>
<script src="./planner-costs.js?v=5"></script>
<script src="./icons.js?v=32"></script>
<script>
var picked=null;
function car(){
  try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");if(s&&s.cars&&s.cars.length)return s.cars[s.i]||s.cars[0]}catch(e){}
  return {nick:"",name:"",plate:"",fuel:"",none:true};
}
function qname(c){return String(c.nick||c.name||"").trim()||"car"}
function clsOf(c){
  var n=(qname(c)+" "+String(c.fuel||"")).toLowerCase();
  if(/ferrari|lamborghini|mclaren|bugatti|pagani|koenigsegg|aston martin/.test(n)) return {k:"exotic",m:3.2,lab:"exotic",indie:120,dealer:240};
  if(/rolls-royce|rolls royce|bentley|maybach/.test(n)) return {k:"luxury",m:2.2,lab:"luxury",indie:95,dealer:190};
  if(/911|cayman|boxster|amg |\\bm3\\b|\\bm4\\b|\\bm5\\b|rs3|rs4|rs6|supra|gt-r|civic type r|gr yaris|lotus|focus rs/.test(n)) return {k:"sports",m:1.7,lab:"sports",indie:75,dealer:150};
  if(/range rover|defender|discovery|xc90|xc60|xc40|x5|x6|x7|q7|q8|gle|gls|glc|cayenne|macan|touareg|land cruiser/.test(n)) return {k:"prem_suv",m:1.55,lab:"premium SUV",indie:70,dealer:140};
  if(/qashqai|tiguan|kuga|sportage|tucson|rav4|cr-v|karoq|ateca|outlander|santa fe|sorento|forester|cx-5|kodiaq/.test(n)) return {k:"suv",m:1.25,lab:"SUV",indie:62,dealer:115};
  if(/bmw|mercedes|benz|audi|porsche|lexus|jaguar|land rover|volvo|mini cooper|maserati|alfa romeo/.test(n)) return {k:"premium",m:1.4,lab:"premium",indie:68,dealer:130};
  if(/fiesta|corsa|polo|ibiza|fabia|yaris|jazz|swift|i20|clio|208|c3|micra/.test(n)) return {k:"small",m:0.85,lab:"small car",indie:58,dealer:100};
  if(/aygo|108|107|i10|picanto|up!|citigo|spark|c1/.test(n)) return {k:"city",m:0.75,lab:"city car",indie:55,dealer:95};
  if(/transit|vivaro|sprinter|crafter|ducato|boxer|relay|trafic|transporter|hilux|ranger|l200/.test(n)) return {k:"van",m:1.2,lab:"van / pickup",indie:60,dealer:105};
  return {k:"family",m:1,lab:"family car",indie:60,dealer:110};
}
function gbp(n){return "\u00a3"+Math.round(n/10)*10}
function row(n,p){return "<div class='item'><span>"+n+"</span><b>"+p+"</b></div>"}
function term(){return picked?picked.buy:(document.getElementById("qBox").value.trim()||"service kit")}
function links(){
  var name=qname(car()), buy=term();
  var q=encodeURIComponent(name+" "+buy);
  document.getElementById("btnGsf").href="https://www.gsfcarparts.com/catalogsearch/result/?q="+q;
  document.getElementById("btnEcp").href="https://www.eurocarparts.com/search?q="+q;
  document.getElementById("btnEbay").href="https://www.ebay.co.uk/sch/i.html?_nkw="+q;
  document.getElementById("btnYt").href="https://www.youtube.com/results?search_query="+encodeURIComponent(name+" "+buy+" how to UK");
  document.getElementById("btnHaynes").href="https://uk.haynes.com/search?q="+encodeURIComponent(name);
}
function matchJobs(q){
  q=String(q||"").toLowerCase().trim();
  if(q.length<1)return [];
  var hits=WORK.filter(function(w){return (w.name+" "+w.buy+" "+w.id).toLowerCase().indexOf(q)>=0});
  hits.sort(function(a,b){
    var an=a.name.toLowerCase(), bn=b.name.toLowerCase();
    var as=an.indexOf(q)===0?0:(an.indexOf(q)>=0?1:2);
    var bs=bn.indexOf(q)===0?0:(bn.indexOf(q)>=0?1:2);
    return as-bs || an.length-bn.length;
  });
  return hits.slice(0,6);
}
function mark(text,q){
  var i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return text;
  return text.slice(0,i)+"<b>"+text.slice(i,i+q.length)+"</b>"+text.slice(i+q.length);
}
function showSugs(){
  var q=document.getElementById("qBox").value;
  var box=document.getElementById("sugs");
  if(picked && picked.name===q){box.innerHTML="";return}
  var hits=matchJobs(q);
  box.innerHTML=hits.map(function(w){return "<button type='button' class='sug' data-id='"+w.id+"'>"+mark(w.name,q)+"</button>"}).join("");
}
function pickJob(id){
  picked=WORK.filter(function(w){return w.id===id})[0]||null;
  if(!picked)return;
  document.getElementById("qBox").value=picked.name;
  document.getElementById("sugs").innerHTML="";
  document.getElementById("status").textContent="Estimate for "+picked.name;
  document.getElementById("status").className="status ok";
  draw();
}
function draw(){
  var c=car(), name=qname(c), sz=D3Cost.size(), R=D3Cost.rate();
  document.getElementById("carLine").textContent=c.none?"No car yet. Add one on the home screen.":name+(c.plate?(" \u00b7 "+String(c.plate).toUpperCase()):"");
  var job=picked;
  if(job){
    var e=D3Cost.est(job)||{dlo:0,dhi:0,glo:0,ghi:0,h:job.hrs}, m=job.cls?1:D3Cost.MULT[sz], dealer=(window.LABOUR&&LABOUR.dealer)?Math.round((LABOUR.dealer[0]+LABOUR.dealer[1])/2):Math.round(R*1.75), hrs=e.h!=null?e.h:job.hrs;
    var dLo=Math.round((e.dlo*1.35+hrs*dealer)/5)*5, dHi=Math.round((e.dhi*1.45+hrs*dealer)/5)*5;
    document.getElementById("quotes").innerHTML=
      row("DIY (parts only)","\u00a3"+e.dlo+"\u2013\u00a3"+e.dhi)+
      row("Local garage","\u00a3"+e.glo+"\u2013\u00a3"+e.ghi)+
      row("Main dealer","\u00a3"+dLo+"\u2013\u00a3"+dHi)+
      row("Labour used",hrs+" hrs \u00b7 \u00a3"+R+"/hr \u00b7 dealer about \u00a3"+dealer+"/hr");
    document.getElementById("jobNote").textContent=(job.note?job.note+" ":"")+"Estimate sized for a "+D3Cost.LAB[sz].toLowerCase()+". Not a quote.";
    document.getElementById("quoteBox").className="card";
  }else document.getElementById("quoteBox").className="card hide";
  links();
}
window.plannerRedraw=draw;
document.getElementById("costToggle").onclick=function(){toggleAcc("costAcc")};
function toggleAcc(id){
  var el=document.getElementById(id);
  el.className=el.className.indexOf("open")>=0?"acc":"acc open";
}
document.getElementById("buyToggle").onclick=function(){toggleAcc("buyAcc")};
document.getElementById("guideToggle").onclick=function(){toggleAcc("guideAcc")};
document.getElementById("qBox").addEventListener("input",function(){
  picked=null;
  document.getElementById("quoteBox").className="card hide";
  document.getElementById("status").textContent="";
  showSugs();
  links();
});
document.getElementById("sugs").addEventListener("click",function(e){
  var b=e.target.closest("[data-id]");
  if(b) pickJob(b.getAttribute("data-id"));
});
document.getElementById("qBox").addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  e.preventDefault();
  var hits=matchJobs(this.value);
  if(hits[0]) pickJob(hits[0].id);
  else {
    document.getElementById("status").textContent="No saved estimate for that — parts and guide links are ready.";
    document.getElementById("status").className="status ok";
    links();
  }
});
(function(){
  var p=new URLSearchParams(location.search);
  if(p.get("q")) document.getElementById("qBox").value=p.get("q");
  if(p.get("job")) pickJob(p.get("job"));
  else { showSugs(); draw(); }
})();
</script>
</body>
</html>
