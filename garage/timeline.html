<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Journey log</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
h1{font-size:22px;margin:0 0 6px}
.muted{color:var(--dim);font-size:13px;line-height:1.45}
label{display:block;color:var(--dim);font-size:12px;margin:10px 0 4px}
input{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px;font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;margin-top:10px;background:#2a2e36;color:#fff;text-align:center;text-decoration:none}
.card{background:#14161b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.day{width:100%;text-align:left;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;margin-top:8px}
.day b{display:block;font-size:16px}
.trip{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.trip:first-child{border-top:0}
.row{display:flex;justify-content:space-between;gap:10px}
.hide{display:none}
.err{color:#e7b1a0;font-size:13px}
.tot{font-size:20px;font-weight:800}
</style>
</head>
<body>
<h1>Journey log</h1>
<p class="muted">This stays on your phone. Upload a Google Timeline export and we estimate fuel from your saved MPG. It is not a live link to Maps.</p>
<label>MPG</label>
<input id="mpg" type="number" step="0.1" value="38"/>
<label>Diesel p / litre</label>
<input id="ppl" type="number" step="0.1" value="195.2"/>
<label>Timeline file (.json)</label>
<input id="file" type="file" accept=".json,application/json"/>
<p class="err" id="err"></p>
<div class="card hide" id="sum">
  <div class="tot" id="tot">£0</div>
  <p class="muted" id="meta"></p>
</div>
<div id="days"></div>
<a class="btn" href="./index.html">Back to route cost</a>
<script>
var UK_GALLON=4.54609, MILE=1609.34, trips=[];
function garageMpg(){
  try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");var c=s&&s.cars&&(s.cars[s.i]||s.cars[0]);if(c&&+c.mpg)return +c.mpg}catch(e){}
  return 38;
}
function money(n){return "\u00a3"+(+n||0).toFixed(2)}
function cost(miles){
  var mpg=parseFloat(document.getElementById("mpg").value)||38;
  var ppl=(parseFloat(document.getElementById("ppl").value)||195.2)/100;
  return (miles/Math.max(mpg,1))*UK_GALLON*ppl;
}
function latlng(v){
  if(!v)return null;
  if(typeof v==="string"){
    var m=v.replace(/[\u00b0]/g,"").match(/(-?\d+\.\d+)[^\d-]+(-?\d+\.\d+)/);
    return m?{lat:+m[1],lon:+m[2]}:null;
  }
  if(v.latitudeE7!=null)return {lat:v.latitudeE7/1e7,lon:v.longitudeE7/1e7};
  if(v.lat!=null)return {lat:+v.lat,lon:+(v.lng||v.lon)};
  return null;
}
function placeName(p){
  if(!p)return "Unknown";
  return p.name||p.address||p.semanticType||"Place";
}
function haversine(a,b){
  if(!a||!b)return 0;
  var R=6371000, dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lon-a.lon)*Math.PI/180;
  var x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
function isDrive(t){
  t=String(t||"").toUpperCase();
  return /VEHICLE|IN_PASSENGER|IN_CAR|DRIVING|MOTORCYCLE/.test(t) && !/BUS|TRAIN|SUBWAY|TRAM|PLANE|FLYING|WALK|CYCLE|BICYCLE|RUN/.test(t);
}
function pushTrip(start,end,from,to,metres,mode){
  if(!isDrive(mode) && !(metres>800 && isDrive(mode||"IN_PASSENGER_VEHICLE"))) {
    if(!isDrive(mode)) return;
  }
  var miles=(+metres||0)/MILE;
  if(miles<0.4)return;
  var when=new Date(start||end||Date.now());
  if(isNaN(+when))return;
  trips.push({
    day:when.toISOString().slice(0,10),
    when:when,
    from:from||"Start",
    to:to||"Finish",
    miles:miles,
    mode:mode||"car"
  });
}
function walk(obj){
  if(!obj)return;
  if(Array.isArray(obj)){obj.forEach(walk);return}
  if(typeof obj!=="object")return;
  if(obj.activitySegment){
    var a=obj.activitySegment;
    var metres=a.distance||a.distanceMeters||0;
    if(!metres && a.startLocation && a.endLocation) metres=haversine(latlng(a.startLocation),latlng(a.endLocation));
    pushTrip(a.duration&&a.duration.startTimestamp, a.duration&&a.duration.endTimestamp, placeName(a.startLocation), placeName(a.endLocation), metres, (a.activityType||a.activities&&a.activities[0]&&a.activities[0].activityType));
  }
  if(obj.semanticSegments || obj.timelineObjects || obj.rawSignals){
    walk(obj.semanticSegments||obj.timelineObjects||obj.rawSignals);
  }
  if(obj.activity && (obj.activity.distanceMeters||obj.activity.type)){
    var metres2=obj.activity.distanceMeters||obj.distanceMeters||0;
    var s=latlng(obj.start && (obj.start.latLng||obj.start));
    var e=latlng(obj.end && (obj.end.latLng||obj.end));
    if(!metres2) metres2=haversine(s,e);
    pushTrip(obj.startTime||obj.startTimestamp, obj.endTime||obj.endTimestamp, placeName(obj.start), placeName(obj.end), metres2, obj.activity.type||obj.activityType);
  }
  Object.keys(obj).forEach(function(k){
    if(k==="activitySegment"||k==="semanticSegments"||k==="timelineObjects"||k==="activity")return;
    var v=obj[k];
    if(v&&typeof v==="object")walk(v);
  });
}
function render(){
  var box=document.getElementById("days");
  if(!trips.length){box.innerHTML="";document.getElementById("sum").className="card hide";return}
  trips.sort(function(a,b){return b.when-a.when});
  var days={};
  trips.forEach(function(t){(days[t.day]=days[t.day]||[]).push(t)});
  var keys=Object.keys(days).sort().reverse();
  var allMiles=trips.reduce(function(s,t){return s+t.miles},0);
  var allCost=cost(allMiles);
  document.getElementById("sum").className="card";
  document.getElementById("tot").textContent=money(allCost);
  document.getElementById("meta").textContent=trips.length+" car journeys \u00b7 "+allMiles.toFixed(0)+" miles \u00b7 "+keys.length+" days";
  box.innerHTML=keys.map(function(day){
    var list=days[day];
    var miles=list.reduce(function(s,t){return s+t.miles},0);
    var html=list.map(function(t){
      return "<div class='trip'><div class='row'><span>"+t.from+" \u2192 "+t.to+"</span><b>"+money(cost(t.miles))+"</b></div><div class='muted'>"+t.miles.toFixed(1)+" mi \u00b7 "+t.when.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+"</div></div>";
    }).join("");
    var label=new Date(day+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    return "<button type='button' class='day' data-day='"+day+"'><div class='row'><b>"+label+"</b><span>"+money(cost(miles))+"</span></div><div class='muted'>"+list.length+" trips \u00b7 "+miles.toFixed(1)+" mi</div><div class='body hide'>"+html+"</div></button>";
  }).join("");
}
document.getElementById("days").addEventListener("click",function(e){
  var b=e.target.closest(".day"); if(!b)return;
  var body=b.querySelector(".body"); if(body) body.className=body.className.indexOf("hide")>=0?"body":"body hide";
});
document.getElementById("mpg").addEventListener("input",render);
document.getElementById("ppl").addEventListener("input",render);
document.getElementById("file").addEventListener("change",function(){
  var f=this.files&&this.files[0]; if(!f)return;
  document.getElementById("err").textContent="Reading "+f.name+"\u2026";
  var r=new FileReader();
  r.onerror=function(){document.getElementById("err").textContent="Could not read that file."};
  r.onload=function(){
    trips=[];
    try{
      var data=JSON.parse(r.result);
      walk(data);
      if(!trips.length) document.getElementById("err").textContent="File opened, but no car journeys were found. Try the Timeline.json export from Google Maps.";
      else document.getElementById("err").textContent="";
      render();
    }catch(err){
      document.getElementById("err").textContent="That file is not valid JSON.";
    }
  };
  r.readAsText(f);
});
document.getElementById("mpg").value=garageMpg();
</script>
</body>
</html>
