<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
h1{font-size:22px;margin:0 0 6px;font-weight:650}
.nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin:8px 0 12px}
.nav b{font-size:clamp(15px,4.4vw,18px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.btn{border:0;border-radius:18px;padding:10px 14px;font-weight:600;background:#1c1c1e;color:#f2f2f2;text-decoration:none}
.wide{display:block;width:100%;text-align:left;margin-top:10px;padding:16px 18px;border-radius:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{color:#8b8b8b;font-size:11px;text-align:center;padding:4px 0}
.day{background:#141416;border:1px solid #2a2a2e;border-radius:12px;min-height:48px;padding:6px 4px;color:#f2f2f2;text-align:left}
.day.empty{background:transparent;border-color:transparent}
.day.on{outline:1px solid #3a3a3e}
.day .n{font-size:12px;font-weight:650}
.day .dot{display:block;width:6px;height:6px;border-radius:50%;background:#8b8b8b;margin-top:6px}
.card{background:#141416;border:1px solid #2a2a2e;border-radius:18px;padding:12px;margin-top:10px}
.card b.title{display:block;font-size:16px}
.muted{color:#8b8b8b;font-size:13px;margin:4px 0 0;line-height:1.4}
.kv{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:14px}
.kv span{color:#8b8b8b}
.row{display:flex;gap:8px;margin-top:10px}
.row .btn{flex:1}
.edit{margin-top:10px;padding-top:10px;border-top:1px solid #2a2a2e}
.edit.hide{display:none}
label{display:block;color:#8b8b8b;font-size:12px;margin:8px 0 4px}
input{width:100%;background:#161618;border:1px solid #2a2a2e;color:#f2f2f2;border-radius:12px;padding:10px;font-size:16px}
.rh{font-size:18px;margin:22px 0 2px}
.route{display:block;width:100%;text-align:left;background:#141416;border:1px solid #2a2a2e;border-radius:18px;padding:12px;margin-top:10px;color:#f2f2f2;font:inherit}
.route .top{display:flex;justify-content:space-between;gap:10px}.route .cost{font-weight:800;color:#3dd68c}
.route .more.hide{display:none}.route .rdel{background:none;border:0;color:#8b8b8b;text-decoration:underline;font-size:12px;padding:8px 0 0}
.day .dot.r{background:#7dd3fc}
.dot.rem{background:var(--rc)}
.evs{display:flex;gap:2px;justify-content:center;margin-top:2px}.evs i{width:6px;height:6px;border-radius:50%;display:block}
.rem-card{border-left:4px solid var(--rc)!important}
.rem-card .row a,.rem-card .row button{flex:1;text-align:center;text-decoration:none}
#upNext .rem-card{margin-bottom:8px}
.day .dot.w{background:#3dd68c}
.diy{border-left:4px solid #3dd68c!important}
.diy .ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.diy .ph img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid #2a2a2e}
.diy .inv{display:block;color:#7dd3fc;font-size:14px;margin-top:6px}
.addw{display:block;width:100%;margin-top:10px;background:#14532d;color:#fff;text-align:center}
.wsheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.wsheet .panel{background:#141416;border:1px solid #2a2a2e;border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.wsheet h2{margin:0 0 4px;font-size:19px}
textarea{width:100%;min-height:90px;background:#161618;border:1px solid #2a2a2e;color:#f2f2f2;border-radius:12px;padding:10px;font:inherit;font-size:16px}
.fl{display:flex;gap:8px;align-items:center;margin-top:8px;background:#1c1c1e;border-radius:12px;padding:6px}
.fl img{width:48px;height:48px;object-fit:cover;border-radius:8px}.fl .fi{flex:1;min-width:0;font-size:13px}
.fl input{padding:6px 8px;font-size:14px;margin-top:4px}.fl .x{background:none;border:0;color:#f87171;font-size:13px;padding:6px}
.pick{display:flex;gap:8px;margin-top:8px}.pick label{flex:1;margin:0;text-align:center;background:#1c1c1e;color:#f2f2f2;border-radius:14px;padding:11px 6px;font-size:14px;font-weight:600}
.pick input{display:none}
.day .dot.m{background:#f5c518}
:root{--c-due:#ff9f68;--c-over:#ff6b6b;--c-done:#3dd68c;--c-jour:#5aa9ff;--c-media:#f5c518}
.day .dots{display:flex;gap:3px;justify-content:center;margin-top:6px;min-height:6px}
.day .dots .dot{margin:0}
.day .dot.due{background:var(--c-due)}.day .dot.over{background:var(--c-over)}.day .dot.w{background:var(--c-done)}.day .dot.j{background:var(--c-jour)}.day .dot.m{background:var(--c-media)}
.rem-card{--rc:var(--c-due)!important}.rem-card.over{--rc:var(--c-over)!important}
.card.diy,.card.media.own,.card.media.mech{border-left:4px solid var(--c-done)}
.card[data-id],.card.media.run,.card.route{border-left:4px solid var(--c-jour)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.ddb .cdots{display:inline-flex;gap:3px;margin-left:-4px}
.clItem .cdot{margin-right:-2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#8b8b8b;margin:8px 2px 0}.legend span{display:inline-flex;align-items:center;gap:5px}

#calLists{margin-top:18px}
.ddb{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:16px 18px;border-radius:18px;background:#1c1c1e;border:1px solid #2a2a2e;color:#f2f2f2;font:inherit;font-size:17px;font-weight:600;text-align:left}
.ddb .ddi{width:22px;text-align:center}.ddb .chev{margin-left:auto;font-size:15px;opacity:.75;transition:transform .2s ease}
.ddb[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ddMenu{background:#141416;border:1px solid #2a2a2e;border-radius:18px;margin-top:8px;padding:10px;animation:ddIn .18s ease-out}
.ddMenu.hide{display:none}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.clQ{margin:0 0 6px;padding:10px 12px;font-size:15px;-webkit-appearance:none}
.clHead{font-size:13px;color:#8b8b8b;margin:12px 4px 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.clHead .clTot{color:#3dd68c;font-weight:700}
.clItem{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid #2a2a2e;color:#f2f2f2;padding:11px 4px;font:inherit;text-align:left}
.clItem:first-of-type{border-top:0}.clIco{width:22px;text-align:center}.clTxt{flex:1;min-width:0}.clTxt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clTxt small{color:#8b8b8b;font-size:12px}
.clHead.clOver{color:#ff6b6b;font-weight:700}
.clR{font-weight:700;color:#3dd68c;font-size:14px}.clEmpty{margin:6px 4px}
.clRoutes{margin-top:10px;border-top:1px solid #2a2a2e;padding-top:8px}.clRoutes summary{cursor:pointer;font-weight:600;padding:8px 4px;color:#f2f2f2}
.media{border-left:4px solid #3dd68c!important}.media.run{border-left-color:#f5b84a!important}.media.mech{border-left-color:#7dd3fc!important}
.media .ph,.diy .ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.media .ph img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid #2a2a2e;cursor:pointer}
.diy .ph img{cursor:pointer}.media .inv{display:block;color:#7dd3fc;font-size:14px;margin-top:6px}
.newTag{font-size:11px;background:#14532d;color:#bbf7d0;border-radius:8px;padding:2px 6px;vertical-align:middle}
.mviewer{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
.mvtop{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#ddd;font-size:14px}
.mvx{background:#1c1c1e;color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:18px}
.mvstrip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.mvstrip::-webkit-scrollbar{display:none}
.mvstrip figure{flex:0 0 100%;margin:0;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 0 calc(14px + env(safe-area-inset-bottom))}
.mvstrip img,.mvstrip video{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
.mvstrip figcaption{color:#bbb;font-size:13px;margin-top:8px;text-align:center;padding:0 12px}
</style>
</head>
<body>
<h1>Drive diary</h1>
<p class="muted">Your car's past and future in one place. Tap a day to see work, mechanic uploads, photos and run videos, or to add work you did.</p>
<p class="muted" id="mechStatus" style="display:none"></p>
<div class="nav">
  <button class="btn" type="button" id="prev">Prev</button>
  <b id="label"></b>
  <button class="btn" type="button" id="next">Next</button>
</div>
<div class="grid" id="dows"></div>
<div class="grid" id="grid"></div>
<p class="legend" aria-label="Dot colours"><span><i class="cdot" style="background:var(--c-due)"></i>Due</span><span><i class="cdot" style="background:var(--c-over)"></i>Overdue</span><span><i class="cdot" style="background:var(--c-done)"></i>Work done</span><span><i class="cdot" style="background:var(--c-jour)"></i>Journeys</span><span><i class="cdot" style="background:var(--c-media)"></i>Photos/video</span></p>
<div id="list"></div>
<section id="calLists">
<button class="ddb" type="button" id="clRecent" aria-expanded="false" aria-controls="clRecentMenu"><span class="ddi">🕘</span><span class="lab">Recent</span><span class="chev" aria-hidden="true">&#9662;</span></button>
<div class="ddMenu hide" id="clRecentMenu"><input type="search" class="clQ" id="cl_recent_q" placeholder="Search recent" aria-label="Search recent"/><div id="cl_recent_list"></div></div>
<button class="ddb" type="button" id="clMaint" aria-expanded="false" aria-controls="clMaintMenu"><span class="ddi">🔧</span><span class="lab">Maintenance</span><span class="chev" aria-hidden="true">&#9662;</span></button>
<div class="ddMenu hide" id="clMaintMenu"><input type="search" class="clQ" id="cl_maint_q" placeholder="Search maintenance" aria-label="Search maintenance"/><div id="cl_maint_list"></div></div>
<button class="ddb" type="button" id="clJourn" aria-expanded="false" aria-controls="clJournMenu"><span class="ddi">📍</span><span class="lab">Journeys</span><span class="chev" aria-hidden="true">&#9662;</span></button>
<div class="ddMenu hide" id="clJournMenu"><input type="search" class="clQ" id="cl_journ_q" placeholder="Search journeys" aria-label="Search journeys"/><div id="cl_journ_list"></div><details class="clRoutes" id="routes"><summary>Saved routes <span class="muted" id="rCount"></span></summary><p class="muted">Routes you saved in Route costs. Tap one for the breakdown.</p><div id="rList"></div><a class="btn wide" href="route.html">Check a route cost</a></details></div>
</section>
<a class="btn wide" href="drive.html">Let’s drive</a>
<a class="btn" href="home.html#hist">Back</a>
<script src="./trip-engine.js"></script>
<script src="./reminders-core.js?v=3"></script>
<script src="./reminders-web.js?v=1"></script>
<script src="./car-scope.js?v=1"></script>
<script src="./diy-work.js?v=3"></script>
<script>
var view=new Date();
view.setDate(1);
function logs(){
  try{return JSON.parse(localStorage.getItem("gt.driveLog")||"[]")}catch(e){return []}
}
function saveLogs(list){localStorage.setItem("gt.driveLog",JSON.stringify(list))}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function byDay(){
  var map={};
  logs().filter(function(t){return !window.D3Car||D3Car.owns(t.plate)}).forEach(function(t){
    var d=new Date(t.when||t.end||Date.now());
    (map[key(d)]=map[key(d)]||[]).push(t);
  });
  return map;
}
function costOf(t,mpg){
  var ppl=+t.ppl||197.1;
  return (+t.miles||0)/Math.max(+mpg||1,1)*4.54609*(ppl/100);
}
function render(sel){
  var remMap=remByDay();
  var wmap=diyByDay();
  var map=byDay(), rmap={}; tripStore().forEach(function(t){ var dk=key(new Date(t.when||0)); (rmap[dk]=rmap[dk]||[]).push(t); });
  var y=view.getFullYear(),m=view.getMonth();
  document.getElementById("label").textContent=view.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  document.getElementById("dows").innerHTML=["Mo","Tu","We","Th","Fr","Sa","Su"].map(function(d){return "<div class='dow'>"+d+"</div>"}).join("");
  var first=new Date(y,m,1), start=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate(), html="";
  for(var i=0;i<start;i++) html+="<div class='day empty'></div>";
  var _t=new Date(), todayK=_t.getFullYear()+"-"+String(_t.getMonth()+1).padStart(2,"0")+"-"+String(_t.getDate()).padStart(2,"0");
  for(var d=1;d<=days;d++){
    var k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    html+="<button type='button' class='day"+(sel===k?" on":"")+"' data-k='"+k+"'><span class='n'>"+d+"</span>"+"<span class='dots'>"+(remMap[k]?(k<todayK?"<span class='dot over' title='Overdue'></span>":"<span class='dot due' title='Due'></span>"):"")+(wmap[k]?"<span class='dot w' title='Work done'></span>":"")+(map[k]||rmap[k]?"<span class='dot j' title='Journey'></span>":"")+"</span>"+"</button>";
  }
  document.getElementById("grid").innerHTML=html;
  var items=sel&&map[sel]?map[sel]:[];
  var box=document.getElementById("list");
  var rItems=sel&&rmap[sel]?rmap[sel]:[];
  var remItems=sel&&remMap[sel]?remMap[sel]:[];
  var wItems=sel&&wmap[sel]?wmap[sel]:[];
  var wHtml=sel?"<p class='muted' style='margin-top:12px'>"+D3Rem.niceDate(sel)+"</p>"+wItems.map(diyCard).join("")+"<button class='btn addw' type='button' data-addw='"+sel+"'>+ Add work</button>":"";
  setTimeout(function(){fillThumbs(box)},0);
  if(!items.length&&!rItems.length&&!remItems.length){box.innerHTML=wHtml+(wItems.length?"":"<p class='muted'>Nothing else on this day.</p>")+upNext();return}
  box.innerHTML=wHtml+remItems.map(remCard).join("")+items.map(function(t){
    var tm=new Date(t.when).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    var end=t.end?new Date(t.end).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):"";
    var ico = t.type==="run" ? "🏁 " : "📍 ";
    return "<div class='card' data-id='"+t.id+"'><b class='title'>"+ico+(t.from||"Start")+" → "+(t.to||"Finish")+"</b><p class='muted'>"+tm+(end?" – "+end:"")+(t.type==="run"&&t.time?" · "+t.time:"")+"</p><div class='kv'><span>Miles</span><b>"+(+t.miles||0).toFixed(2)+"</b></div><div class='kv'><span>Cost</span><b>£"+(+t.cost||0).toFixed(2)+"</b></div><div class='kv'><span>MPG</span><b>"+(t.mpg||"-")+"</b></div><div class='row'><button class='btn' type='button' data-edit='"+t.id+"'>✎ Edit</button></div><div class='edit hide' id='ed-"+t.id+"'><label>Miles per gallon for this trip</label><input type='number' step='0.1' value='"+(t.mpg||"")+"' data-mpg='"+t.id+"'/><div class='row'><button class='btn' type='button' data-save='"+t.id+"'>Save mpg</button><button class='btn' type='button' data-del='"+t.id+"'>Delete journey</button></div></div></div>";
  }).join("")+rItems.map(function(t){ return "<div class='card route'><b class='title'>🗺 "+escR(t.title||((t.from||"")+" \u2192 "+(t.to||"")))+"</b><p class='muted'>Saved route · "+(+t.miles||0).toFixed(1)+" mi · one way "+moneyTxt(t.oneGBP!=null?t.oneGBP:scoreTrip(t).gbp)+"</p></div>"; }).join("");
}
function remByDay(){
  var m={}; if(!window.D3Rem) return m;
  var g; try{g=JSON.parse(localStorage.getItem("gt.garage")||"null")}catch(e){}
  var ci=window.D3Car?D3Car.curIndex():0;
  D3Rem.dueItems(g).filter(function(e){return e.carIndex===ci}).forEach(function(e){(m[e.due]=m[e.due]||[]).push(e)}); return m;
}
function remCard(e){
  var d=D3Rem.daysUntil(e.due), left=d<0?(-d)+" days overdue":d===0?"Due today":d+" days left";
  var acts=[];
  if(e.type==="mot") acts.push("<a class='btn' href='mot.html?plate="+e.vrn+"#history'>View history</a>");
  if(e.book) acts.push("<a class='btn' href='"+e.bookLink+"'>Book with my garage</a>");
  if(e.type==="tax") acts.push("<a class='btn' href='https://www.gov.uk/vehicle-tax' target='_blank' rel='noopener'>Renew</a>","<a class='btn' href='tax.html?plate="+e.vrn+"'>Check tax</a>");
  if(e.type==="insurance") acts.push("<a class='btn' href='insurance.html?v=19'>Policy</a>","<a class='btn' href='renew.html?v=13'>Renew</a>");
  return "<div class='card rem-card"+(D3Rem.daysUntil(e.due)<0?" over":"")+"'><b class='title'>"+e.icon+" "+escR(e.label)+" · "+escR(e.plate)+"</b><p class='muted'>"+escR(e.name)+" · "+D3Rem.niceDate(e.due)+" · "+left+"</p><div class='row'>"+acts.join("")+"</div></div>";
}
function upNext(){
  return ""; // replaced by the Maintenance dropdown below the calendar
  if(!window.D3Rem) return "";
  var g; try{g=JSON.parse(localStorage.getItem("gt.garage")||"null")}catch(e){}
  var ci=window.D3Car?D3Car.curIndex():0;
  var n=D3Rem.dueItems(g).filter(function(e){return e.carIndex===ci&& D3Rem.daysUntil(e.due)>=-30}).slice(0,4);
  return n.length?"<div id='upNext'><p class='muted'>Coming up</p>"+n.map(remCard).join("")+"</div>":"";
}
function escR(x){ return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
function kindLabel(t){ return t.isYear?"Yearly commute":(t.isReturn?"Return":"One way"); }
function renderRoutes(){
  var list=tripStore(), box=document.getElementById("rList");
  document.getElementById("rCount").textContent=list.length?("("+list.length+")"):"";
  if(!list.length){ box.innerHTML="<p class='muted'>No saved routes yet. Check a route, then tap Save.</p>"; return; }
  box.innerHTML=list.map(function(t,i){
    var miles=(+t.miles||0).toFixed(1), mins=t.mins||Math.round((+t.oneSecs||0)/60);
    var head=t.isYear&&t.yearGBP!=null?t.yearGBP:(t.isReturn&&t.retGBP!=null?t.retGBP:(t.oneGBP!=null?t.oneGBP:scoreTrip(t).gbp));
    var ex="<div class='kv'><span>One way</span><b>"+moneyTxt(t.oneGBP)+"</b></div><div class='kv'><span>Return</span><b>"+moneyTxt(t.retGBP)+"</b></div>"+
      (t.isYear?"<div class='kv'><span>Year ("+(t.days||5)+" \u00d7 "+(t.weeks||46)+")</span><b>"+moneyTxt(t.yearGBP)+"</b></div>":"")+
      "<div class='kv'><span>Time one way</span><b>"+(mins||"-")+" min</b></div><div class='kv'><span>MPG used</span><b>"+(t.rated?Number(t.rated).toFixed(1):"-")+"</b></div>"+
      "<div class='kv'><span>Fuel price</span><b>"+(t.ppl?Number(t.ppl).toFixed(1)+"p":"-")+"</b></div>"+
      (t.roads&&t.roads.length?"<p class='muted'>"+escR(t.roads.join(" \u00b7 "))+"</p>":"")+
      "<p class='muted'>Saved "+new Date(t.when||Date.now()).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})+"</p><button type='button' class='rdel' data-rdel='"+i+"'>Delete this route</button>";
    return "<div class='route' data-i='"+i+"' role='button' tabindex='0'><div class='top'><div><b class='title'>"+escR(t.title||((t.from||"")+" \u2192 "+(t.to||"")))+"</b><div class='muted'>"+miles+" mi \u00b7 "+kindLabel(t)+"</div></div><div class='cost'>"+moneyTxt(head)+"</div></div><div class='more hide'>"+ex+"</div></div>";
  }).join("");
}
document.getElementById("rList").addEventListener("click",function(e){
  var d=e.target.closest("[data-rdel]");
  if(d){ if(confirm("Delete this saved route?")){ var l=tripStore(); l.splice(+d.getAttribute("data-rdel"),1); saveTrips(l); renderRoutes(); render(selected); } return; }
  var b=e.target.closest(".route"); if(!b) return; var m=b.querySelector(".more"); if(m) m.classList.toggle("hide");
});
renderRoutes();
if(window.D3Diy) try{D3Diy.backfill()}catch(e){}
var qd=/[?&]d=(\d{4}-\d\d-\d\d)/.exec(location.search);
var selected=qd?qd[1]:key(new Date());
if(qd){ view=new Date(+qd[1].slice(0,4),+qd[1].slice(5,7)-1,1); }
render(selected);
document.getElementById("grid").addEventListener("click",function(e){
  var b=e.target.closest("[data-k]"); if(!b)return;
  selected=b.getAttribute("data-k"); render(selected);
});
document.getElementById("list").addEventListener("click",function(e){
  var aw=e.target.closest("[data-addw]"); if(aw){ openWork(null,aw.getAttribute("data-addw")); return; }
  var ow=e.target.closest("[data-openw]"); if(ow){ openWork(ow.getAttribute("data-openw")); return; }
  var edit=e.target.closest("[data-edit]");
  if(edit){
    var box=document.getElementById("ed-"+edit.getAttribute("data-edit"));
    if(box) box.classList.toggle("hide");
    return;
  }
  var save=e.target.closest("[data-save]");
  if(save){
    var id=save.getAttribute("data-save");
    var inp=document.querySelector("[data-mpg='"+id+"']");
    var mpg=parseFloat(inp&&inp.value);
    if(!mpg||mpg<=0) return;
    var list=logs().map(function(t){
      if(t.id!==id) return t;
      t.mpg=mpg;
      t.cost=+costOf(t,mpg).toFixed(2);
      return t;
    });
    saveLogs(list); render(selected); return;
  }
  var del=e.target.closest("[data-del]");
  if(del && confirm("Delete this journey?")){
    var id=del.getAttribute("data-del");
    saveLogs(logs().filter(function(t){return t.id!==id}));
    render(selected);
  }
});
/* ---- DIY "Work done" entries (shared with History via diy-work.js) ---- */
function curPlate(){ try{var g=JSON.parse(localStorage.getItem("gt.garage")||"null");var c=g&&g.cars&&(g.cars[g.i]||g.cars[0]);return c?c.plate:""}catch(e){return ""} }
function diyByDay(){ var m={}; if(!window.D3Diy) return m; D3Diy.forPlate(curPlate()).forEach(function(w){(m[w.date]=m[w.date]||[]).push(w)}); return m; }
function diyCard(w){
  var ph=(w.files||[]).filter(function(f){return f.kind==="photo"}), inv=(w.files||[]).filter(function(f){return f.kind!=="photo"});
  return "<div class='card diy'><b class='title'>🔧 "+escR(w.title||"Work done")+"</b><p class='muted'>DIY work"+(ph.length?" · "+ph.length+" photo"+(ph.length>1?"s":""):"")+(inv.length?" · "+inv.length+" invoice"+(inv.length>1?"s":""):"")+"</p>"+
    (w.desc?"<p style='margin:6px 0 0;font-size:14px;white-space:pre-wrap'>"+escR(w.desc)+"</p>":"")+
    "<div class='ph'>"+ph.map(function(f){return "<img alt='' data-blob='"+f.id+"'/>"}).join("")+"</div>"+
    inv.map(function(f){return "<a class='inv' target='_blank' rel='noopener' data-blob='"+f.id+"' data-type='"+escR(f.type)+"'>🧾 "+escR(f.title||f.name)+(f.price?" · £"+escR(f.price):"")+"</a>"}).join("")+
    "<div class='row'><button class='btn' type='button' data-openw='"+w.id+"'>✎ Open / edit</button></div></div>";
}
var diyUrls=[];
function fillThumbs(root){
  root.querySelectorAll("[data-blob]").forEach(function(el){
    D3Diy.getBlob(el.getAttribute("data-blob")).then(function(b){ if(!b) return; var u=URL.createObjectURL(b); diyUrls.push(u); if(el.tagName==="IMG") el.src=u; else el.href=u; }).catch(function(){});
  });
}
function openWork(id,date){
  var w=id?JSON.parse(JSON.stringify(D3Diy.get(id))):{date:date,plate:D3Diy.vrn(curPlate()),title:"",desc:"",files:[]};
  if(!w) return;
  var pending=[], removed=[];
  var sh=document.createElement("div"); sh.className="wsheet"; sh.id="wSheet";
  sh.innerHTML="<div class='panel'><h2>"+(id?"Work done":"Add work")+"</h2><p class='muted'>Your own DIY work. Saved on this phone and shown on this day in the Drive diary.</p>"+
    "<label>Date</label><input type='date' id='wDate' value='"+escR(w.date)+"'/>"+
    "<label>What did you do?</label><input id='wTitle' maxlength='80' placeholder='e.g. Full service, oil + filters' value='"+escR(w.title)+"'/>"+
    "<label>Description</label><textarea id='wDesc' placeholder='Parts used, mileage, notes…'>"+escR(w.desc)+"</textarea>"+
    "<label>Photos</label><div class='pick'><label>📷 Camera<input type='file' accept='image/*' capture='environment' id='wCam'/></label><label>🖼 Gallery<input type='file' accept='image/*' multiple id='wGal'/></label></div>"+
    "<label>Invoices / receipts</label><div class='pick'><label>🧾 Add PDF or photo<input type='file' accept='application/pdf,image/*' multiple id='wInv'/></label></div>"+
    "<div id='wFiles'></div>"+
    "<div class='row'><button class='btn' type='button' id='wCancel'>Cancel</button><button class='btn' type='button' id='wSave' style='background:#14532d;color:#fff'>Save</button></div>"+
    (id?"<button class='btn' type='button' id='wDel' style='display:block;width:100%;margin-top:10px;background:#3a1414;color:#fca5a5'>Delete this work</button>":"")+"</div>";
  document.body.appendChild(sh);
  var urls=[];
  function list(){
    var box=sh.querySelector("#wFiles"), rows=[];
    w.files.forEach(function(f){ if(removed.indexOf(f.id)<0) rows.push({old:f}); });
    pending.forEach(function(p){ rows.push({p:p}); });
    box.innerHTML=rows.map(function(r,i){ var f=r.old||r.p, inv=f.kind!=="photo";
      return "<div class='fl'>"+(inv?"<span style='font-size:26px'>🧾</span>":"<img alt='' data-i='"+i+"'/>")+"<div class='fi'>"+escR(f.name)+
        (inv?"<input placeholder='Title (optional)' data-t='"+i+"' value='"+escR(f.title||"")+"'/><input placeholder='Price £ (optional)' inputmode='decimal' data-pr='"+i+"' value='"+escR(f.price||"")+"'/>":"")+
        "</div><button class='x' type='button' data-rm='"+i+"'>Remove</button></div>"; }).join("");
    rows.forEach(function(r,i){ var im=box.querySelector("img[data-i='"+i+"']"); if(!im) return;
      if(r.p){ var u=URL.createObjectURL(r.p.file); urls.push(u); im.src=u; } else D3Diy.getBlob(r.old.id).then(function(b){ if(b){var u=URL.createObjectURL(b);urls.push(u);im.src=u;} }); });
    box.oninput=function(e){ var t=e.target, i=t.getAttribute("data-t")||t.getAttribute("data-pr"); if(i==null) return; var f=rows[+i].old||rows[+i].p; if(t.hasAttribute("data-t")) f.title=t.value; else f.price=t.value; };
    box.onclick=function(e){ var b=e.target.closest("[data-rm]"); if(!b) return; var r=rows[+b.getAttribute("data-rm")]; if(r.old) removed.push(r.old.id); else pending.splice(pending.indexOf(r.p),1); list(); };
  }
  function add(inp,kind){ inp.onchange=function(){ Array.prototype.forEach.call(inp.files,function(f){ pending.push({file:f,kind:kind==="inv"&&/^image\//.test(f.type)?"invoice":kind==="inv"?"invoice":"photo",name:f.name,title:"",price:""}); }); inp.value=""; list(); }; }
  add(sh.querySelector("#wCam"),"photo"); add(sh.querySelector("#wGal"),"photo"); add(sh.querySelector("#wInv"),"inv");
  list();
  function close(){ urls.forEach(function(u){URL.revokeObjectURL(u)}); sh.remove(); }
  sh.querySelector("#wCancel").onclick=close;
  if(id) sh.querySelector("#wDel").onclick=function(){ if(!confirm("Delete this work entry and its photos/invoices?")) return; D3Diy.remove(id).then(function(){ close(); render(selected); }); };
  sh.querySelector("#wSave").onclick=async function(){
    var btn=this; w.date=sh.querySelector("#wDate").value||w.date; w.title=sh.querySelector("#wTitle").value.trim()||"Work done"; w.desc=sh.querySelector("#wDesc").value.trim();
    btn.disabled=true; btn.textContent="Saving…";
    try{
      for(var i=0;i<removed.length;i++){ await D3Diy.delBlob(removed[i]).catch(function(){}); }
      w.files=w.files.filter(function(f){return removed.indexOf(f.id)<0});
      for(var j=0;j<pending.length;j++){ var p=pending[j]; await D3Diy.addFile(w,p.file,p.kind,p.title,p.price); }
      D3Diy.save(w);
    }catch(e){ alert("Could not save — phone storage may be full."); btn.disabled=false; btn.textContent="Save"; return; }
    close(); selected=w.date; view=new Date(+w.date.slice(0,4),+w.date.slice(5,7)-1,1); render(selected);
  };
}
document.getElementById("prev").onclick=function(){view.setMonth(view.getMonth()-1);render(selected)};
document.getElementById("next").onclick=function(){view.setMonth(view.getMonth()+1);render(selected)};
</script>
