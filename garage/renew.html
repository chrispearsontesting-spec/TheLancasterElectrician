<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<script src="./app-lock.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>Renew insurance</title>
<link rel="stylesheet" href="./ui.css?v=78"/>
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
h1{font-size:22px;margin:0 0 12px;font-weight:650}
.card{background:#141416;border:1px solid #2a2a2e;border-radius:18px;padding:14px;margin-bottom:12px}
.when{font-size:20px;font-weight:650;margin:0}.note,.left{color:#8b8b8b;font-size:13px;margin:4px 0 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;background:#1c1c1e;color:#f2f2f2;text-decoration:none;border:0;border-radius:18px;padding:16px 18px;font-weight:650;font-size:16px;margin-top:10px;min-height:56px;cursor:pointer}
input{width:100%;margin-top:8px;background:#0f0f11;color:#f2f2f2;border:1px solid #2a2a2e;border-radius:12px;padding:12px;font-size:15px}
#setup{display:none}#setup.on{display:block}
</style>
</head>
<body>
<h1>Renew insurance</h1>
<div class="card"><p class="note">Renewal date</p><p class="when" id="exp">—</p><p class="left" id="left"></p></div>
<button class="btn" type="button" id="mine">My current insurer</button>
<div class="card" id="setup" style="margin-top:10px">
  <p class="note">Save your insurer once and this button will open it next time.</p>
  <input id="iName" placeholder="Insurer name, e.g. Admiral"/>
  <input id="iWeb" placeholder="Website, e.g. admiral.com" inputmode="url"/>
  <button class="btn" type="button" id="iSave">Save insurer</button>
</div>
<button class="btn" type="button" id="cmp">Compare quotes</button>
<p class="left" id="msg"></p>
<a class="btn" href="home.html">Back</a>
<script>
function state(){try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");if(s&&s.cars&&s.cars.length)return s}catch(e){}return null}
function car(){var s=state();return s?(s.cars[s.i]||s.cars[0]):{}}
function vrn(){return String(car().plate||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function url(u){u=String(u||"").trim();if(!u)return "";return /^https?:\/\//i.test(u)?u:"https://"+u}
function nice(iso){if(!iso)return "Not set";return new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function left(iso){if(!iso)return "Set it in Reminders on the home page";var n=new Date();n.setHours(12,0,0,0);var d=Math.round((new Date(iso+"T12:00:00")-n)/86400000);return d<0?-d+" days overdue":d===0?"Due today":d+" days left"}
function paint(){
  var c=car();
  document.getElementById("exp").textContent=nice(c.ins);
  document.getElementById("left").textContent=left(c.ins);
  document.getElementById("mine").textContent=c.insName?"My current insurer · "+c.insName:"My current insurer";
  document.getElementById("iName").value=c.insName||"";document.getElementById("iWeb").value=c.insWeb||"";
}
document.getElementById("mine").onclick=function(){
  var c=car();
  if(c.insWeb){window.open(url(c.insWeb),"_blank","noopener");return}
  document.getElementById("setup").classList.add("on");document.getElementById("iName").focus();
};
document.getElementById("iSave").onclick=function(){
  var s=state();if(!s){document.getElementById("msg").textContent="Add a car first.";return}
  var c=s.cars[s.i]||s.cars[0];
  c.insName=document.getElementById("iName").value.trim();c.insWeb=url(document.getElementById("iWeb").value);
  localStorage.setItem("gt.garage",JSON.stringify(s));
  document.getElementById("setup").classList.remove("on");document.getElementById("msg").textContent="Insurer saved.";paint();
};
document.getElementById("mine").addEventListener("contextmenu",function(e){e.preventDefault();document.getElementById("setup").classList.toggle("on")});
document.getElementById("cmp").onclick=function(){
  var v=vrn(),base="https://www.gocompare.com/journeys/car/vehicle";
  var u=v?base+"?registration="+v+"&vrn="+v+"&reg="+v+"&registrationNumber="+v:base;
  try{if(v&&navigator.clipboard)navigator.clipboard.writeText(v)}catch(x){}
  if(v)document.getElementById("msg").textContent=v+" copied — paste it on GoCompare if the box is empty";
  window.open(u,"_blank","noopener");
};
paint();
</script>
<script src="./icons.js?v=29"></script>
</body>
</html>
