<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>G & Tip</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100%}
body{display:flex;flex-direction:column;align-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
h1{font-size:22px;margin:8px 0 4px;font-weight:650}
.muted{color:#8b8b8b;font-size:13px;margin:0 0 16px;text-align:center}
.gauge-wrap{position:relative;width:280px;height:280px;margin:10px auto}
canvas{background:#141416;border-radius:50%;border:1px solid #2a2a2e}
.vals{display:flex;gap:24px;margin:16px 0;font-size:15px}
.vals b{font-size:20px;display:block}
.btn{margin-top:12px;padding:12px 20px;background:#1c1c1e;color:#fff;border:0;border-radius:14px;font-weight:600;text-decoration:none;display:inline-block}
.note{font-size:12px;color:#7a7a7a;margin-top:20px;text-align:center;max-width:320px}
</style>
</head>
<body>
<h1>G-force & Tip</h1>
<p class="muted">Mount the phone firmly. Works best fixed on the dash.</p>
<div class="gauge-wrap">
  <canvas id="c" width="280" height="280"></canvas>
</div>
<div class="vals">
  <div>Lateral<br><b id="lat">0.00</b></div>
  <div>Longitudinal<br><b id="lon">0.00</b></div>
  <div>Tip<br><b id="tip">0°</b></div>
</div>
<p class="note">The ball shows lean (tip). The crosshair shows G-force.</p>
<button class="btn" id="allow" type="button">Allow motion sensors</button>
<a class="btn" href="drive-hub.html" style="margin-top:8px">Back</a>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const latEl = document.getElementById('lat');
const lonEl = document.getElementById('lon');
const tipEl = document.getElementById('tip');
const allowBtn = document.getElementById('allow');
let lat = 0, lon = 0, tip = 0;

function draw() {
  const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2, r = 110;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = '#2a2a2e';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#333';
  ctx.beginPath(); ctx.moveTo(cx-r, cy); ctx.lineTo(cx+r, cy); ctx.moveTo(cx, cy-r); ctx.lineTo(cx, cy+r); ctx.stroke();
  const tipX = cx + Math.sin(tip * Math.PI/180) * r * 0.65;
  const tipY = cy + Math.cos(tip * Math.PI/180) * r * 0.15;
  ctx.fillStyle = '#e10600';
  ctx.beginPath(); ctx.arc(tipX, tipY, 14, 0, Math.PI*2); ctx.fill();
  const gx = cx + (lat || 0) * r * 0.7;
  const gy = cy - (lon || 0) * r * 0.7;
  ctx.fillStyle = '#73BDE0';
  ctx.beginPath(); ctx.arc(gx, gy, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#666';
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.fill();
}
draw();

function onMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || (a.x == null && a.y == null)) return;
  lat = (a.x || 0) / 9.81;
  lon = (a.y || 0) / 9.81;
  tip = Math.atan2(a.x || 0, a.y || 0) * 180 / Math.PI;
  latEl.textContent = lat.toFixed(2);
  lonEl.textContent = lon.toFixed(2);
  tipEl.textContent = Math.round(Math.abs(tip)) + '°';
  draw();
}

allowBtn.onclick = async function() {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      const state = await DeviceMotionEvent.requestPermission();
      if (state !== 'granted') {
        alert('Permission was not granted');
        return;
      }
    }
    window.addEventListener('devicemotion', onMotion);
    allowBtn.textContent = 'Sensors on';
    allowBtn.disabled = true;
  } catch (err) {
    alert('Error: ' + (err.message || err));
  }
};

// Auto-start on Android if no permission API (Chrome)
if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') {
  window.addEventListener('devicemotion', onMotion);
  allowBtn.style.display = 'none';
}
</script>
</body>
</html>
