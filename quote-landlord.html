<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landlord EICR Quote | The Lancaster Electrician</title>
    <meta name="description" content="Request a landlord or agent EICR quote in Lancaster. One rental or a small portfolio, with the option of a Gold QR record on each board.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; color: #1e2937; }
        .top { background: #0b1220; color: #94a3b8; padding: 14px 22px; display: flex; justify-content: space-between; }
        .top a { color: #bfdbfe; text-decoration: none; font-weight: 600; }
        .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 56px; display: grid; grid-template-columns: 280px 1fr; gap: 22px; }
        .side h1 { color: white; font-size: 32px; letter-spacing: -0.03em; line-height: 1.15; }
        .side p, .side a { color: #cbd5e1; margin-top: 12px; line-height: 1.55; font-size: 15px; }
        .side a { color: #fbbf24; font-weight: 700; }
        .card { background: white; border-radius: 22px; padding: 26px 24px 30px; }
        label { display: block; margin: 14px 0 6px; font-weight: 650; color: #92400e; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px 13px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 16px; font-family: inherit; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .submit, .wa { width: 100%; margin-top: 14px; padding: 15px; border: 0; border-radius: 12px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; }
        .submit { background: #d97706; }
        .wa { background: #16a34a; }
        @media (max-width: 800px) { .wrap, .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="top"><a href="quote.html">Back to quote choice</a><a href="gold.html">How Gold works</a></div>
<div class="wrap">
    <aside class="side">
        <h1>Landlord or agent quote</h1>
        <p>For one rental or a small portfolio. Say how many properties, whether a tenant is in, and if you want the Gold record on each board.</p>
        <p><a href="gold.html">See how Gold works</a></p>
    </aside>
    <div class="card">
        <form id="qform" action="https://formsubmit.co/Chris.pearson.testing@gmail.com" method="POST">
            <input type="hidden" name="customer_type" value="Landlord / agent">
            <input type="hidden" name="_subject" value="LANDLORD EICR quote — The Lancaster Electrician">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_next" value="https://thelancasterelectrician.com/thankyou.html">
            <input type="hidden" name="_captcha" value="false">
            <div class="row">
                <div><label>Your name</label><input type="text" name="name" id="name" required></div>
                <div><label>Phone</label><input type="tel" name="phone" id="phone" required></div>
            </div>
            <div class="row">
                <div><label>Email (optional)</label><input type="email" name="email" id="email"></div>
                <div>
                    <label>Landlord or agent?</label>
                    <select name="role" id="role" required>
                        <option value="">Select...</option>
                        <option value="Landlord">Landlord</option>
                        <option value="Letting / managing agent">Letting or managing agent</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div><label>How many properties need a test?</label><input type="number" name="property_count" id="count" min="1" placeholder="1 or 6" required></div>
                <div>
                    <label>Main reason</label>
                    <select name="reason" id="reason" required>
                        <option value="">Select...</option>
                        <option value="5-year EICR due">Five-year EICR due or expired</option>
                        <option value="New tenancy">New tenancy</option>
                        <option value="Insurance">Insurance</option>
                        <option value="Portfolio catch-up">Portfolio catch-up</option>
                    </select>
                </div>
            </div>
            <label>First property address</label>
            <input type="text" name="address" id="address" placeholder="Start with the first house or flat" required>
            <div class="row">
                <div><label>Postcode</label><input type="text" name="postcode" id="postcode" required></div>
                <div>
                    <label>Tenant in at that property?</label>
                    <select name="occupied" id="occupied" required>
                        <option value="">Select...</option>
                        <option value="Tenant in situ">Tenant in</option>
                        <option value="Void / empty">Empty</option>
                        <option value="Mix / not sure">Mix, or not sure</option>
                    </select>
                </div>
            </div>
            <label>Other addresses, if more than one</label>
            <textarea name="other_addresses" id="others" rows="3" placeholder="Other streets or postcodes"></textarea>
            <div class="row">
                <div>
                    <label>Typical size</label>
                    <select name="property_size" id="size" required>
                        <option value="">Select...</option>
                        <option value="1-2 bed">1–2 bedroom</option>
                        <option value="3 bed">3 bedroom</option>
                        <option value="Mix / larger">Mix or larger</option>
                    </select>
                </div>
                <div><label>Consumer units per property</label><input type="number" name="fuse_boxes" id="boards" min="1" placeholder="Usually 1" required></div>
            </div>
            <div class="row">
                <div><label>Last EICR on the first property</label><input type="text" name="last_test" id="last" placeholder="Expired / 2021 / never"></div>
                <div><label>Access or preferred dates</label><input type="text" name="availability" id="when" placeholder="Tenant notice needed?" required></div>
            </div>
            <label>Gold — QR on each board, plus a landlord overview?</label>
            <select name="gold_interest" id="gold">
                <option value="Yes — interested in Gold">Yes, interested in Gold</option>
                <option value="Tell me both prices">Tell me both prices</option>
                <option value="Standard only">Standard only</option>
            </select>
            <label>Anything else</label>
            <textarea name="extra_info" id="extra" rows="3" placeholder="HMO, old boards, a previous unsatisfactory report"></textarea>
            <button type="submit" class="submit">Email this landlord quote request</button>
            <button type="button" class="wa" id="wa">Send the same details on WhatsApp</button>
        </form>
    </div>
</div>
<script>
function details() {
    const g = id => (document.getElementById(id).value || '').trim();
    return ['LANDLORD / AGENT EICR quote request','Name: '+g('name')+' ('+g('role')+')','Phone: '+g('phone'),'Email: '+g('email'),'Properties: '+g('count'),'Reason: '+g('reason'),'First property: '+g('address')+' '+g('postcode'),'Occupied: '+g('occupied'),'Other addresses: '+g('others'),'Typical size: '+g('size')+' | Boards: '+g('boards'),'Last EICR: '+g('last'),'Access: '+g('when'),'Gold: '+g('gold'),'Notes: '+g('extra')].join('\n');
}
document.getElementById('wa').onclick = function() {
    const f = document.getElementById('qform');
    if (!f.reportValidity()) return;
    window.location.href = 'https://wa.me/447587590435?text=' + encodeURIComponent('Hi Chris, I would like a landlord EICR quote.\n\n' + details());
};
</script>
</body>
</html>
