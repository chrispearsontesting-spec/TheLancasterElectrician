<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<script src="./app-lock.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>Insurance</title>
<link rel="stylesheet" href="./ui.css?v=78"/>
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
h1{font-size:22px;margin:0 0 4px;font-weight:650}
.sub{color:#8b8b8b;margin:0 0 16px;font-size:14px}
.card{background:#141416;border:1px solid #2a2a2e;border-radius:18px;padding:14px;margin-bottom:12px}
.when{color:#cfcfcf;font-size:20px;font-weight:650;margin:0}
.left{color:#8b8b8b;font-size:13px;margin:6px 0 0}
.btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#1c1c1e;color:#f2f2f2;text-decoration:none;border:0;border-radius:18px;padding:16px 18px;font-weight:600;font-size:16px;margin-top:10px}
.btn[disabled]{opacity:.45}
.note{color:#8b8b8b;font-size:13px;line-height:1.45;margin:0}
iframe{width:100%;height:240px;border:0;border-radius:12px;background:#111;display:none}
iframe.on{display:block;margin-top:10px}
#doc canvas{width:100%;height:auto;border-radius:12px;margin-top:10px;background:#111}
#pick{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
label.btn{cursor:pointer}
#docAcc{background:#141416 !important;border:1px solid #2a2a2e !important;border-radius:18px;overflow:hidden;margin:14px 0;padding:0}
#docToggle{width:100%;margin:0;background:transparent !important;border:0 !important;color:#f3efe6;font-size:16px;font-weight:600;text-align:left;padding:16px 18px;display:flex !important;align-items:center !important;justify-content:flex-start !important;gap:12px;border-radius:0}
#docToggle .lab{flex:1;text-align:left}
#docToggle .chev{margin-left:auto;color:#8b8b8b;font-size:18px}
#docAcc .accBody{display:none;padding:0 14px 14px}
#docAcc.open .accBody{display:block}
#docAcc.open .chev{transform:rotate(45deg)}
.chev{display:inline-block}
#insDate{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.split{display:flex !important;justify-content:space-between !important}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.stack > .btn,.stack label.btn,#docToggle{min-height:52px;padding:14px 16px !important;font-size:16px;font-weight:650}
.split{display:flex !important;align-items:center !important;justify-content:center !important;gap:18px !important}
#docToggle{display:flex !important;justify-content:center !important;align-items:center !important;position:relative}
#docToggle .chev{position:absolute;right:16px}
label.btn,#renew{display:flex !important;justify-content:center !important;align-items:center !important}

</style>
</head>
<body>
<h1>Insurance</h1>
<div class="card"><p class="note">Renewal date</p><p class="when" id="exp">—</p><p class="left" id="expLeft"></p><p class="left">Change this date in Reminders on the home page.</p></div>
<div class="stack">
<div class="card" style="margin:0">
  <p class="when" style="font-size:17px">Insurance documents</p>
  <p class="note" style="margin-top:4px">Certificate, policy schedule, no claims discount proof and more. PDFs or photos.</p>
  <input id="docTitle" placeholder="Title (optional), e.g. No claims discount" style="width:100%;margin-top:12px;background:#0f0f11;color:#f2f2f2;border:1px solid #2a2a2e;border-radius:12px;padding:12px;font-size:15px"/>
  <label class="btn" for="pick" id="up" data-iconed="1">Upload insurance documents</label>
  <input id="pick" type="file" multiple accept=".pdf,application/pdf,image/*"/>
  <p class="left" id="pdfName"></p>
  <div id="list"></div>
</div>
<a class="btn" id="renew" data-iconed="1" href="renew.html?v=12">Renew</a>
<a class="btn" href="home.html" data-iconed="1">Back</a>
</div>
<style>
.doc{display:flex;align-items:center;gap:8px;border-top:1px solid #2a2a2e;padding:10px 0;margin-top:10px}
.doc .t{flex:1;min-width:0}.doc .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc .t span{color:#8b8b8b;font-size:12px}
.doc button,.doc a{background:#1c1c1e;color:#f2f2f2;border:0;border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px;text-decoration:none}
.doc .del{color:#ff8a80}
</style>
<script>
function state(){
  try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");if(s&&s.cars&&s.cars.length)return s}catch(e){}
  return {i:0,cars:[{plate:"",ins:"",insWeb:"",nick:"Car"}]};
}
function car(){var s=state();return s.cars[s.i]||s.cars[0]}
function nice(iso){if(!iso)return "Not set";var d=new Date(iso+"T12:00:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function leftTxt(iso){
  if(!iso)return "Set it in Reminders on the home page";
  var end=new Date(iso+"T12:00:00"),now=new Date();now.setHours(12,0,0,0);
  var days=Math.round((end-now)/86400000);
  if(days<0)return Math.abs(days)+" days overdue";
  if(days===0)return "Due today";
  return days+" days left";
}
function vrn(){return String((car().plate||"none")).toUpperCase().replace(/[^A-Z0-9]/g,"")}
function key(){return "gt.insPdf."+vrn()}      /* legacy single doc (kept, still read) */
function listKey(){return "gt.insDocs."+vrn()} /* new: array of docs */
function db(){
  return new Promise(function(res,rej){
    var r=indexedDB.open("dipstick",2);
    r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("files")) r.result.createObjectStore("files")};
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){rej(r.error)};
  });
}
async function get(k){
  try{var d=await db();return await new Promise(function(res,rej){var t=d.transaction("files").objectStore("files").get(k);t.onsuccess=function(){res(t.result||null)};t.onerror=function(){rej(t.error)}})}catch(e){return null}
}
async function put(k,v){
  var d=await db();
  return new Promise(function(res,rej){var t=d.transaction("files","readwrite").objectStore("files").put(v,k);t.onsuccess=function(){res()};t.onerror=function(){rej(t.error)}});
}
async function del(k){
  var d=await db();
  return new Promise(function(res,rej){var t=d.transaction("files","readwrite").objectStore("files").delete(k);t.onsuccess=function(){res()};t.onerror=function(){rej(t.error)}});
}
async function docs(){
  var arr=await get(listKey());arr=Array.isArray(arr)?arr:[];
  var old=await get(key());
  if(old&&old.blob) arr=[{id:"legacy",title:"Policy",name:old.name||"policy.pdf",type:"application/pdf",blob:old.blob,at:old.at||0,legacy:1}].concat(arr);
  return arr;
}
function esc(t){return String(t||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
async function show(){
  var arr=await docs(),list=document.getElementById("list");
  list.innerHTML="";
  document.getElementById("pdfName").textContent=arr.length?arr.length+" document"+(arr.length>1?"s":"")+" saved":"No documents yet";
  arr.forEach(function(d){
    var type=d.type||(d.blob&&d.blob.type)||"application/pdf";
    var blob=d.blob.type?d.blob:new Blob([d.blob],{type:type});
    var row=document.createElement("div");row.className="doc";
    row.innerHTML="<div class='t'><b>"+esc(d.title||d.name)+"</b><span>"+esc(d.name)+(d.at?" · "+new Date(d.at).toLocaleDateString("en-GB"):"")+"</span></div>";
    var v=document.createElement("a");v.textContent="View";v.href=URL.createObjectURL(blob);v.target="_blank";v.rel="noopener";
    var x=document.createElement("button");x.type="button";x.className="del";x.textContent="Delete";
    x.onclick=async function(){
      if(!confirm("Delete "+(d.title||d.name)+"?"))return;
      if(d.legacy) await del(key());
      else{var a=await get(listKey());a=(Array.isArray(a)?a:[]).filter(function(y){return y.id!==d.id});await put(listKey(),a)}
      show();
    };
    row.appendChild(v);row.appendChild(x);list.appendChild(row);
  });
}
var c=car();
document.getElementById("exp").textContent=nice(c.ins);
document.getElementById("expLeft").textContent=leftTxt(c.ins);
var pick=document.getElementById("pick");
pick.addEventListener("change", async function(){
  var fs=Array.prototype.slice.call(pick.files||[]);
  if(!fs.length){document.getElementById("pdfName").textContent="No file was returned. Try again.";return}
  var title=document.getElementById("docTitle").value.trim();
  document.getElementById("pdfName").textContent="Saving "+fs.length+" file"+(fs.length>1?"s":"")+"…";
  try{
    var a=await get(listKey());a=Array.isArray(a)?a:[];
    for(var i=0;i<fs.length;i++){
      var f=fs[i],type=f.type||(/\.pdf$/i.test(f.name)?"application/pdf":"application/octet-stream");
      var blob=new Blob([await f.arrayBuffer()],{type:type});
      a.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:title?(fs.length>1?title+" ("+(i+1)+")":title):"",name:f.name||"document",type:type,blob:blob,at:Date.now()});
    }
    await put(listKey(),a);
    document.getElementById("docTitle").value="";pick.value="";
    show();
  }catch(e){
    document.getElementById("pdfName").textContent="Could not save: "+(e&&e.message?e.message:"try a smaller file");
  }
});
show();
</script>
<script src="./icons.js?v=29"></script>
</body>
</html>
