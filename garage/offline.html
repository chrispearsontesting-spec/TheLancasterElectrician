<!DOCTYPE html>
<html lang="en-GB">

<title>Offline · Driv3</title>
<style>

html,body{margin:0;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{margin:0 auto;max-width:440px;min-height:100vh;padding:calc(48px + env(safe-area-inset-top)) 20px 28px;display:flex;flex-direction:column;gap:14px}

p{color:#b5b5b5;line-height:1.5;margin:0}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:14px;background:#d4ab29;color:#0b0c0e;font-size:16px;font-weight:650;padding:14px;text-align:center;text-decoration:none}
.btn.alt{background:#1a1c20;color:#f2f2f2}
</style>
</head>
<body>
<img src="./icon-192.png" alt=""/>
<h1>No signal right now</h1>

<button class="btn" type="button" onclick="location.reload()">Try again</button>
