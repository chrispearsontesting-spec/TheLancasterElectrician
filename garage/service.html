<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<link rel="stylesheet" href="./ui.css"/>
<title>General costs and guides</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(10px + env(safe-area-inset-top)) 12px 28px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:#9aa3b0;font-size:13px;margin:0 0 16px}
label{display:block;color:#9aa3b0;font-size:12px;margin:10px 0 4px}
select,input[type=search]{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-size:16px}
.row{display:flex;gap:8px}
.row input{flex:1}
.go{background:#2a2e36;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;white-space:nowrap}
.status{min-height:22px;margin:8px 0 4px;font-size:13px;color:#9aa3b0}
.status.ok{color:#9fd8ff;font-weight:700}
.card{background:#14161b;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.card h2{margin:0;padding:14px 14px 8px;font-size:15px;font-weight:800}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.note{padding:10px 14px 14px;color:#9aa3b0;font-size:12px;line-height:1.4}
.hide{display:none}
.btns{padding:0 14px 14px}
.btn{display:block;background:#2a2e36;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:800;font-size:15px;text-align:center;width:100%;margin-top:8px;cursor:pointer}
</style>
</head>
<body>
<h1>General costs and guides</h1>
<p class="sub" id="carLine">Volvo XC60 D5</p>
<label>Search a part or job</label>
<form id="qForm"><div class="row"><input type="search" id="qBox" placeholder="e.g. timing belt kit" autocomplete="off"/><button class="go" type="submit">Search</button></div></form>
<p class="status" id="status"></p>
<label>Or pick a common job</label>
<select id="jobPick"><option value="">Select a job</option></select>
<div class="card hide" id="quoteBox"><div id="quotes"></div><p class="note" id="jobNote"></p></div>
<div class="card"><h2>Where to buy</h2><div class="btns"><a class="btn" id="btnGsf" target="_blank" rel="noopener" href="#">GSF Car Parts</a><a class="btn" id="btnEbay" target="_blank" rel="noopener" href="#">eBay</a></div></div>
<div class="card"><h2>How to guides</h2><div class="btns"><a class="btn" id="btnYt" target="_blank" rel="noopener" href="#">YouTube</a><a class="btn" id="btnHaynes" target="_blank" rel="noopener" href="#">Haynes</a></div></div>
<a class="btn" href="home.html">Back</a>
<script>
var WORK=[
  {id:"service",name:"Interim service (oil + filter)",buy:"service kit",hrs:1,plo:40,phi:95,note:"Oil and filter. Full service is the next step."},
  {id:"full",name:"Full service",buy:"full service kit",hrs:1.8,plo:70,phi:160,note:"Oil, filters and plugs or fuel filter."},
  {id:"beltwp",name:"Timing belt + water pump",buy:"timing belt kit water pump",hrs:5,plo:90,phi:220,note:"Do the pump while it is open. Some engines use a chain."},
  {id:"belt",name:"Timing belt only",buy:"timing belt kit",hrs:4.5,plo:45,phi:140,note:"Usually false economy not to do the pump."},
  {id:"clutch",name:"Clutch kit",buy:"clutch kit",hrs:6.5,plo:180,phi:380,note:"Gearbox out. Dual-mass flywheel extra if worn."},
  {id:"clutchdmf",name:"Clutch + dual-mass flywheel",buy:"clutch kit dual mass flywheel",hrs:7,plo:380,phi:750,note:"Common on diesels."},
  {id:"shaft",name:"Driveshaft (one side)",buy:"driveshaft",hrs:2.2,plo:90,phi:240,note:"Clicking on lock is the usual clue."},
  {id:"fpads",name:"Front pads and discs",buy:"front brake pads discs",hrs:1.6,plo:85,phi:240,note:"Premium / SUV discs cost more."},
  {id:"rpads",name:"Rear pads and discs",buy:"rear brake pads discs",hrs:1.6,plo:75,phi:220,note:""},
  {id:"batt",name:"Battery",buy:"car battery",hrs:0.5,plo:80,phi:200,note:"Stop-start AGM batteries sit at the top of the range."},
  {id:"alt",name:"Alternator",buy:"alternator",hrs:2.2,plo:130,phi:380,note:""},
  {id:"start",name:"Starter motor",buy:"starter motor",hrs:2,plo:110,phi:300,note:""},
  {id:"damp",name:"Pair of dampers",buy:"shock absorbers",hrs:2.2,plo:130,phi:380,note:"Air springs are a different, dearer job."}
];
var RATE=85;
function car(){
  try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");if(s&&s.cars&&s.cars.length)return s.cars[s.i]||s.cars[0]}catch(e){}
  return {nick:"Volvo XC60 D5",name:"Volvo XC60 D5",plate:"SB61LGZ",fuel:"diesel"};
}
function qname(c){return String(c.nick||c.name||"").trim()||"car"}
function clsOf(c){
  var n=qname(c).toLowerCase()+" "+String(c.fuel||"");
  if(/bmw|mercedes|benz|audi|porsche|lexus|jaguar|land rover|range rover|volvo|mini cooper|maserati|alfa romeo/.test(n)) return {k:"premium",m:1.4,lab:"premium"};
  if(/xc60|xc90|xc40|x5|x3|q5|q7|touareg|sharan|discovery|defender|rav4|cr-v|sportage|tucson|kuga|qashqai|tiguan|karoq|ateca|tucson|outlander|santa fe|forester/.test(n)) return {k:"suv",m:1.2,lab:"SUV"};
  if(/fiesta|corsa|polo|ibiza|fabia|yaris|aygo|108|107|i10|i20|picanto|up!|citigo|adam|micra|swift|jazz/.test(n)) return {k:"small",m:0.85,lab:"small car"};
  return {k:"family",m:1,lab:"family car"};
}
function gbp(n){return "\u00a3"+Math.round(n/10)*10}
function row(n,p){return "<div class='item'><span>"+n+"</span><b>"+p+"</b></div>"}
function term(){
  var typed=document.getElementById("qBox").value.trim();
  if(typed)return typed;
  var id=document.getElementById("jobPick").value;
  var job=WORK.filter(function(w){return w.id===id})[0];
  return job?job.buy:"";
}
function links(){
  var name=qname(car()), buy=term()||"service kit";
  var q=encodeURIComponent(name+" "+buy);
  document.getElementById("btnGsf").href="https://www.gsfcarparts.com/catalogsearch/result/?q="+q;
  document.getElementById("btnEbay").href="https://www.ebay.co.uk/sch/i.html?_nkw="+q;
  document.getElementById("btnYt").href="https://www.youtube.com/results?search_query="+encodeURIComponent(name+" "+buy+" how to UK");
  document.getElementById("btnHaynes").href="https://uk.haynes.com/search?q="+encodeURIComponent(name);
}
function draw(){
  var c=car(), name=qname(c), cls=clsOf(c);
  document.getElementById("carLine").textContent=name+(c.plate?(" \u00b7 "+String(c.plate).toUpperCase()):"")+" \u00b7 "+cls.lab+" guide";
  var typed=document.getElementById("qBox").value.trim();
  var id=document.getElementById("jobPick").value;
  var job=WORK.filter(function(w){return w.id===id})[0];
  if(job && !typed){
    var m=cls.m, lab=job.hrs*RATE*m;
    var partsLo=job.plo*m, partsHi=job.phi*m;
    var indLo=lab*0.9+partsLo, indHi=lab*1.15+partsHi;
    var dealLo=indLo*1.45, dealHi=indHi*1.55;
    document.getElementById("quotes").innerHTML=
      row("DIY (parts only)",gbp(partsLo)+"\u2013"+gbp(partsHi))+
      row("Independent",gbp(indLo)+"\u2013"+gbp(indHi))+
      row("Main dealer",gbp(dealLo)+"\u2013"+gbp(dealHi));
    document.getElementById("jobNote").textContent=(job.note?job.note+" ":"")+"UK 2026 guide for a "+cls.lab+". Not an invoice. GSF/eBay show live part prices for this car.";
    document.getElementById("quoteBox").className="card";
  }else document.getElementById("quoteBox").className="card hide";
  links();
}
var sel=document.getElementById("jobPick");
sel.innerHTML="<option value=''>Select a job</option>"+WORK.map(function(w){return "<option value='"+w.id+"'>"+w.name+"</option>"}).join("");
sel.onchange=function(){document.getElementById("qBox").value="";draw()};
document.getElementById("qForm").addEventListener("submit",function(e){e.preventDefault();document.getElementById("status").textContent="Search ready — GSF, eBay and YouTube now use that part.";document.getElementById("status").className="status ok";draw();});
(function(){
  var p=new URLSearchParams(location.search);
  if(p.get("job")) sel.value=p.get("job");
  if(p.get("q")) document.getElementById("qBox").value=p.get("q");
  draw();
})();
</script>
</body>
</html>
