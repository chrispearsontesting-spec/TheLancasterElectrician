<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="icon" href="./icon.svg"/>
<link rel="apple-touch-icon" href="./icon-192.png"/>
<link rel="stylesheet" href="./ui.css?v=77"/>
<title>Dipstick</title>
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:calc(10px + env(safe-area-inset-top)) 12px 28px}
.hero{position:relative;height:150px;border-radius:18px 18px 0 0;overflow:hidden;background:#1c1c1e;cursor:pointer;border:1px solid rgba(255,255,255,0.08);border-bottom:0}
.hero img{width:100%;height:150px;object-fit:cover;display:block}
.hint{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 8px;border-radius:8px}
.plate{position:absolute;right:10px;bottom:10px;display:flex;border-radius:4px;overflow:hidden;border:2px solid #222;font-family:Arial,Helvetica,sans-serif;font-weight:900;box-shadow:0 1px 4px rgba(0,0,0,.4);transform:scale(0.82);transform-origin:bottom right}
.plate .uk{background:#003399;color:#fc0;padding:6px 5px;font-size:9px;line-height:1;text-align:center;display:flex;align-items:center;justify-content:center;min-width:22px;letter-spacing:0.5px}
.plate .reg{background:#f4d000;color:#111;padding:6px 10px;letter-spacing:0.12em;font-size:14px;display:flex;align-items:center}
.bar{background:#141416;border-radius:0 0 18px 18px;padding:8px 0 10px;margin-bottom:10px;width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,0.08);border-top:0}
.nameRow{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 8px;box-sizing:border-box;height:44px}
.nameRow .side{display:flex;gap:8px;z-index:2;width:88px;flex-shrink:0;align-items:center}
.nameRow .side.left{justify-content:flex-start}
.nameRow .side.right{justify-content:flex-end}
.nameRow button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,0.08);background:#1c1c1e;color:#f2f2f2;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin:0;flex-shrink:0}
.name{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:6px;z-index:1;pointer-events:none;white-space:nowrap;max-width:160px;overflow:hidden}
.makeLogo{height:22px;max-width:64px;width:auto;object-fit:contain;vertical-align:middle}
.modelBadgeImg{height:22px;width:auto}
.dots{text-align:center;color:#8b8b8b;font-size:12px;margin:6px 0 0;height:16px;line-height:16px}
.card{background:#141416;border:1px solid #2a2a2e;border-radius:18px;overflow:hidden;margin-bottom:12px}
.card.hide{display:none}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #2a2a2e}
.item h3{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
.when{margin:3px 0 0;color:#b0b0b0;font-size:14px;font-weight:500}
.left{margin:2px 0 0;color:#7a7a7a;font-size:12px}
.acts{display:flex;flex-direction:column;gap:6px;width:118px;align-items:stretch}
.acts .btn{width:100% !important;min-width:0;display:flex !important;align-items:center !important;justify-content:center !important;text-align:center !important;box-sizing:border-box;padding:6px 8px !important;font-size:12px;border-radius:14px !important;gap:0 !important}
.datePick{display:none;width:100%;background:#161618;color:#f2f2f2;border:1px solid #2a2a2e;border-radius:12px;padding:8px}
.datePick.on{display:block}
.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);padding:18px 14px;overflow:auto;z-index:20}
.sheet.on{display:block}
.panel{background:#141416;border-radius:18px;padding:14px;max-width:440px;margin:0 auto}
label{display:block;color:#8b8b8b;font-size:12px;margin:8px 0 4px}
input,select{width:100%;background:#161618;border:1px solid #2a2a2e;color:#f2f2f2;border-radius:12px;padding:10px;font-size:16px}
.plateEntry{display:flex;align-items:center;gap:8px;margin:8px 0 12px;width:100%}
.plateEntry .ukPlate{display:flex;align-items:stretch;border:2px solid #222;border-radius:6px;overflow:hidden;background:#f4d000;flex:1;height:48px;min-width:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.plateEntry .ukStrip{background:#003399;color:#fc0;width:38px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:0.5px;flex-shrink:0}
.plateEntry .ukPlate input{flex:1;min-width:0;border:0 !important;background:transparent !important;color:#111 !important;font-family:Arial,Helvetica,sans-serif !important;font-weight:900 !important;font-size:18px !important;letter-spacing:0.12em !important;text-transform:uppercase;padding:0 10px !important;text-align:center;outline:none;width:auto !important;border-radius:0 !important;height:100% !important}
.plateEntry .ukPlate input::placeholder{color:#666 !important;letter-spacing:0.08em;font-weight:700;opacity:0.7}
.plateEntry button.btn{height:48px;padding:0 14px;font-size:14px;border-radius:12px;flex-shrink:0;width:auto !important;min-width:90px}
.plateEntry .camBtn{height:48px;width:48px;min-width:48px;padding:0;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#1c1c1e;border:1px solid #2a2a2e;color:#f2f2f2;font-size:20px;cursor:pointer}
.found{background:#1c1c1e;border:1px solid #2a2a2e;border-radius:12px;padding:12px;margin:10px 0;font-size:14px;line-height:1.5}
.found b{color:#fff}
.found .muted{color:#8b8b8b;font-size:13px}
.mark{margin-left:8px;font-weight:800}
.mark.ok{color:#3dd68c}
.mark.bad{color:#ff2a2a;animation:flashRed .55s ease-in-out infinite}
.cFlash .when,.cFlash .left{color:#ef4444;animation:flashRed .85s ease-in-out infinite}
.cOver .when,.cOver .left{color:#ff2a2a;animation:flashRed .55s ease-in-out infinite}
@keyframes flashRed{0%,100%{opacity:1}50%{opacity:.28}}

.makeLogo{height:22px;max-width:70px;width:auto;object-fit:contain;vertical-align:middle}
.modelBadge{display:inline-block;background:#2a2a2e;color:#f3efe6;border:1px solid #444;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700;letter-spacing:.5px;vertical-align:middle}
.name{display:flex;align-items:center;justify-content:center;gap:6px;min-height:32px}

.modelBadge.volvo{font-family:"Arial Black",Impact,sans-serif;letter-spacing:1px;background:linear-gradient(#3a3a3e,#1a1a1c);border-color:#666}
.modelBadge.audi{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.8px;background:#111;border-color:#888}
.modelBadge.bmw{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:800;letter-spacing:1.2px;background:#1a1a1a;color:#fff;border:1px solid #555}
.modelBadge.mercedes{font-family:"Palatino Linotype",Palatino,serif;letter-spacing:1px;background:#222;border-color:#777}
.modelBadge.vw{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:.6px}
.modelBadge.ford{font-family:"Arial Black",Impact,sans-serif;letter-spacing:.4px}
.modelBadge.toyota{font-family:"Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:1px}
.modelBadge.porsche{font-family:"Courier New",monospace;font-weight:700;letter-spacing:1px;background:#1a1a1a}
.modelBadge.tesla{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:300;letter-spacing:2px;background:#000;border-color:#333}
.modelBadge.landrover{font-family:"Times New Roman",serif;font-weight:600;letter-spacing:.5px}
.modelBadge.jaguar{font-family:"Palatino Linotype",serif;font-style:italic;letter-spacing:.8px}

.makeLogo.dark{filter:brightness(0) invert(1) brightness(1.3)}
.modelBadgeImg{height:26px;width:auto;vertical-align:middle}
</style>
</head>
<body>
<input id="photoPick" type="file" accept="image/*,image/gif" hidden/>
<input id="plateCam" type="file" accept="image/*" capture="environment" hidden/>
<div class="hero" id="hero"></div>
<div class="bar"><div class="nameRow">
<div class="side left">
<button type="button" id="btnAdd">+</button>
<button type="button" id="prev">&#8592;</button>
</div>
<div class="name" id="caption">Your car</div>
<div class="side right">
<button type="button" id="next">&#8594;</button>
<button type="button" id="btnEdit">&#9998;</button>
</div>
</div><p class="dots" id="dots"></p></div>
<button class="btn wide" type="button" id="datesToggle" data-ico="cal"><span class="lab">Reminders</span></button>
<div class="card hide" id="dues"></div>
<a class="btn wide" href="drive-hub.html" data-ico="wheel">Drive</a>
<a class="btn wide" href="service.html" data-ico="wrench">Maintenance</a>
<a class="btn wide" href="./" data-ico="map">Route costs</a>
<a class="btn wide" href="buy.html" data-ico="search">Buying guide</a>
<a class="btn wide" href="history.html" data-ico="cal">History</a>
<div class="sheet" id="sheet"><div class="panel">
<h2 id="sheetTitle">Add car</h2>
<label>Number plate</label>
<div class="plateEntry">
<div class="ukPlate">
<span class="ukStrip">UK</span>
<input id="fPlate" type="text" placeholder="AB12 CDE" maxlength="8" autocomplete="off"/>
</div>
<button class="camBtn" type="button" id="btnCam" title="Scan plate">&#128247;</button>
<button class="btn" type="button" id="btnLookup">Lookup</button>
</div>
<div id="foundDetails" class="found" style="display:none"></div>
<p class="left" id="plateHint">Enter plate and tap Lookup, or use the camera.</p>
<label>MOT</label><input id="fMot" type="date"/>
<label>Tax</label><input id="fTax" type="date"/>
<label>Insurance</label><input id="fIns" type="date"/>
<label>Full service</label><input id="fOil" type="date"/>
<label>Timing belt date</label><input id="fBeltDate" type="date"/>
<label>Belt years</label><input id="fBeltYears" type="number"/>
<label>Belt miles</label><input id="fBeltMiles" type="number"/>
<label>Tyres fitted</label><input id="fTyreDate" type="date"/>
<label>Tyre life (miles)</label><input id="fTyreLife" type="number"/>
<label>Miles / year</label><input id="fMiles" type="number"/>
<label>UK MPG</label><input id="fMpg" type="number" step="0.1"/>
<label>Fuel</label><select id="fFuel"><option value="diesel">Diesel</option><option value="petrol">Petrol</option><option value="hybrid">Hybrid</option><option value="electric">Electric</option></select>
<label>Garage name</label><input id="fGarage"/>
<label>Garage phone</label><input id="fPhone" type="tel"/>
<label>Garage email</label><input id="fEmail" type="email"/>
<label>Insurer website</label><input id="fInsWeb"/>
<button class="btn wide" type="button" id="btnSave" data-ico="save">Save</button>
<button class="btn wide" type="button" id="btnDelete" style="background:#3a1a1a;color:#ff6b6b;margin-top:8px">Delete car</button>
<button class="btn wide" type="button" id="btnClose" data-ico="back">Back</button>
</div></div>
<div class="sheet" id="contact"><div class="panel"><h2 id="cTitle">Book</h2><p id="cBody"></p><div id="cLinks"></div><button class="btn wide" type="button" id="btnCClose" data-ico="back">Back</button></div></div>
<script src="ncap.js"></script>
<script src="ncap-url.js"></script>
<script src="mot-config.js"></script>
<script src="mot-client.js"></script>
<script src="plate-fill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="./home-app.js?v=72"></script>
<script src="./home-insure.js"></script>
<script src="./icons.js?v=30"></script>
<script>
(function(){
  var dues=document.getElementById("dues");
  var btn=document.getElementById("datesToggle");
  function lab(){return btn.querySelector(".lab")||btn}
  function setOpen(on){
    dues.classList.toggle("hide",!on);
    lab().textContent="Reminders";
    try{sessionStorage.setItem("gt.datesOpen",on?"1":"0")}catch(e){}
  }
  setOpen(sessionStorage.getItem("gt.datesOpen")==="1");
  btn.onclick=function(){setOpen(dues.classList.contains("hide"))};
})();
</script>
</body>
</html>
