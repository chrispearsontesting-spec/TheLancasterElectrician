<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Buying guide</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--ice:#9fd8ff;--line:rgba(255,255,255,.12);--grey:#2a2e36}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin:0 0 14px}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
input[type=text]{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px;font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;margin-top:8px;background:var(--ice);color:#0b0c0f;text-align:center;text-decoration:none}
.grey{background:var(--grey);color:var(--ink);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#14161b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-right:6px}
.high{background:#5b1d1d;color:#fecaca}
.med{background:#4a3514;color:#fde68a}
.low{background:#1e3a34;color:#a7f3d0}
.count{float:right;color:var(--dim);font-size:12px;font-weight:700}
.acc{border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.accBtn{width:100%;background:none;border:0;color:var(--ink);text-align:left;padding:14px 0;font-size:16px;font-weight:800;cursor:pointer}
.accBtn:after{content:"+";float:right;color:var(--dim);font-weight:700}
.acc.open .accBtn:after{content:"\2212"}
.accBody{display:none;padding:0 0 12px}
.acc.open .accBody{display:block}
.fault{border-bottom:1px solid var(--line)}
.fault:last-child{border-bottom:0}
.faultBtn{width:100%;background:none;border:0;color:var(--ink);text-align:left;padding:12px 0;font-size:15px;font-weight:800;cursor:pointer}
.more{display:none;padding:0 0 12px;color:#c9c2b4;font-size:14px;line-height:1.45}
.fault.open .more{display:block}
.more p{margin:0 0 8px}
.muted{color:var(--dim);font-size:12px}
.saved a{color:var(--ice);font-weight:800;text-decoration:none}
.saved p{margin:6px 0}
ul{margin:8px 0 0;padding-left:18px;color:#c9c2b4;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<h1>Buying guide</h1>
<p class="sub">One screen. Tap a heading to open it.</p>
<label>Number plate</label>
<input id="plate" type="text" placeholder="L806 DKH" autocapitalize="characters"/>
<label>Car search</label>
<input id="q" type="text" placeholder="e.g. Ford Fiesta EcoBoost"/>
<button class="btn" type="button" id="go">Show guide</button>
<button class="btn grey" type="button" id="saveBtn">Save to viewings</button>
<p class="muted" id="status"></p>
<div class="card">
  <b id="carName">Car</b>
  <p class="muted" id="carMeta"></p>
  <div class="acc"><button type="button" class="accBtn">Ratings</button><div class="accBody" id="ratings"></div></div>
  <div class="acc"><button type="button" class="accBtn">Known weak points <span class="count" id="faultCount"></span></button><div class="accBody" id="faults"></div></div>
  <div class="acc"><button type="button" class="accBtn">Should already have been done</button><div class="accBody"><ul id="dues"></ul></div></div>
  <div class="acc"><button type="button" class="accBtn">On the viewing</button><div class="accBody"><ul id="views"></ul></div></div>
  <div class="acc"><button type="button" class="accBtn">Major MOT failures <span class="count" id="motMajorCount">0</span></button><div class="accBody" id="motMajors"><p class="muted">Load a plate to see official fails.</p></div></div>
  <div class="acc"><button type="button" class="accBtn">MOT history <span class="count" id="motHistCount"></span></button><div class="accBody"><div id="motBox"><p class="muted">Official tests load here.</p></div><a class="btn grey" id="motLink" href="https://www.gov.uk/check-mot-history" target="_blank" rel="noopener">Open official MOT history</a></div></div>
</div>
<div class="row">
  <a class="btn grey" id="yt" href="#" target="_blank" rel="noopener">YouTube</a>
  <a class="btn grey" id="parts" href="#" target="_blank" rel="noopener">Parts</a>
</div>
<div class="card saved">
  <div class="acc"><button type="button" class="accBtn">Saved viewings</button><div class="accBody"><div id="savedList"></div><a class="btn grey" href="view.html">Open viewing page</a></div></div>
</div>
<a class="btn grey" href="home.html">Back</a>
<script src="cars-uk-1.js"></script>
<script src="faults.js"></script>
<script src="faults-extra.js"></script>
<script src="faults-classic.js"></script>
<script src="models-classic.js"></script>
<script src="jobs-advice.js"></script>
<script src="ved.js"></script>
<script src="ncap.js"></script>
<script src="ncap-url.js"></script>
<script src="ratings-ui.js"></script>
<script src="mot-config.js"></script>
<script src="mot-client.js"></script>
<script>
function $(id){return document.getElementById(id)}
function garageCar(){
  try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");return s&&s.cars&&s.cars.length?(s.cars[s.i]||s.cars[0]):null}catch(e){return null}
}
function loadView(){try{return JSON.parse(localStorage.getItem("gt.viewings.v1")||"[]")}catch(e){return []}}
function saveView(list){localStorage.setItem("gt.viewings.v1",JSON.stringify(list))}
var SUFFIX={A:1983,B:1984,C:1985,D:1986,E:1987,F:1988,G:1989,H:1990,J:1991,K:1992,L:1993,M:1994,N:1995,P:1996,R:1997,S:1998,T:1999,V:1999,W:2000,X:2000,Y:2001};
function plateYear(p){
  var k=String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(k.length<4)return null;
  if(/^[A-Z]{2}\d{2}[A-Z]{3}$/.test(k)){
    var n=parseInt(k.slice(2,4),10);
    if(n>=1&&n<=49)return 2000+n;
    if(n>=50&&n<=99)return 2000+(n-50);
  }
  if(/^[A-Z]\d{1,3}[A-Z]{3}$/.test(k)&&SUFFIX[k.charAt(0)])return SUFFIX[k.charAt(0)];
  if(/^[A-Z]{1,3}\d{1,3}[A-Z]$/.test(k)&&SUFFIX[k.slice(-1)])return SUFFIX[k.slice(-1)];
  return null;
}
function cap(s){return String(s||"").replace(/\b\w/g,function(c){return c.toUpperCase()})}
function guessFuel(text){
  var t=String(text||"").toLowerCase();
  if(/\b(ev|electric|leaf)\b/.test(t))return "electric";
  if(/\b(hybrid|phev|prius|recharge)\b/.test(t))return "hybrid";
  if(/\b(d5|d4|tdi|diesel|td4)\b/.test(t))return "diesel";
  return "petrol";
}
function findClassic(name){
  var hay=String(name||"").toLowerCase(),list=window.CLASSIC_MODELS||[],best=null,score=0,i;
  for(i=0;i<list.length;i++){
    if(hay.indexOf(list[i][1])<0)continue;
    var pts=list[i][1].length+(hay.indexOf(list[i][0])>=0?20:0);
    if(pts>score){best=list[i];score=pts}
  }
  return score>=3?best:null;
}
function matchFault(name,year){
  var hay=String(name||"").toLowerCase(),list=window.FAULTS||[],best=null,score=0,i,j;
  for(i=0;i<list.length;i++){
    var p=list[i],keys=p.k||[],ok=keys.length;
    for(j=0;j<keys.length;j++)if(hay.indexOf(keys[j])<0)ok=false;
    if(!ok)continue;
    var pts=keys.length*10;
    if(year&&p.y0&&p.y1)pts+=(year>=p.y0&&year<=p.y1)?50:-15;
    if(pts>score){best=p;score=pts}
  }
  return score>=10?best:null;
}
function eraPack(year,fuel){
  var era=window.FAULT_ERA||{};
  if(year&&year<1992)return era.pre92||null;
  if(year&&year<2001)return era.nineties||null;
  var g=window.FAULT_GENERIC||{};
  return g[fuel]||g.petrol||g.default||null;
}
var current={name:"",plate:"",year:null,title:""};
function keyFor(){return (current.plate||current.name||"car").toUpperCase().replace(/\s+/g,"")}
function paintSaved(){
  var list=loadView();
  if(!list.length){$("savedList").innerHTML="<p class='muted'>None yet.</p>";return}
  $("savedList").innerHTML=list.map(function(c){
    return "<p><a href='buy.html?plate="+encodeURIComponent(c.plate||"")+"&q="+encodeURIComponent(c.name||"")+"'>"+(c.name||"Car")+(c.plate?(" \u00b7 "+c.plate):"")+"</a></p>";
  }).join("");
}
function faultBlock(f,pack){
  var adv=(window.adviceFor?window.adviceFor(f.t,pack):{})||{};
  var href="service.html?job="+encodeURIComponent(adv.job||"beltwp")+"&q="+encodeURIComponent(adv.buy||f.t);
  return "<div class='fault'><button type='button' class='faultBtn'><span class='tag "+f.s+"'>"+f.s+"</span>"+f.t+"</button><div class='more'><p>"+(f.d||"")+"</p><p><b>When it is due.</b> "+(adv.interval||"")+"</p><p><b>What to ask for.</b> "+(adv.detail||"")+"</p><a class='btn grey' href='"+href+"'>Likely cost and parts</a></div></div>";
}
function paint(car){
  var classic=findClassic(car.name);
  var year=car.year||null;
  var pack=matchFault(car.name,year)||eraPack(year,car.fuel)||eraPack(classic?classic[2]:null,car.fuel)||{};
  var title=car.name||"Car";
  if(pack.k&&pack.name)title=pack.name;
  else if(classic){title=cap(classic[0]+" "+classic[1]);if(classic[2])title+=" ("+classic[2]+"-"+classic[3]+")"}
  current={name:car.name,plate:car.plate,year:year,title:title,fuel:car.fuel};
  $("carName").textContent=title;
  var meta=[];
  if(car.plate)meta.push(car.plate);
  if(pack.engine)meta.push(pack.engine);
  else if(car.fuel)meta.push(car.fuel);
  if(year)meta.push("reg ~"+year);
  $("carMeta").textContent=meta.join(" \u00b7 ");
  if(window.ratingsHtml)$("ratings").innerHTML=window.ratingsHtml(title,year,car.fuel,car.plate);
  var faults=pack.faults||[];
  $("faults").innerHTML=faults.map(function(f){return faultBlock(f,pack)}).join("")||"<p class='muted'>Generic checks still apply.</p>";
  $("faultCount").textContent=faults.length?String(faults.length):"";
  $("dues").innerHTML=(pack.due||[]).map(function(x){return "<li>"+x+"</li>"}).join("");
  var views=(year&&year<2001&&window.VIEW_CHECKS_CLASSIC)?window.VIEW_CHECKS_CLASSIC:(window.VIEW_CHECKS||[]);
  $("views").innerHTML=views.map(function(x){return "<li>"+x+"</li>"}).join("");
  var q=classic?(classic[0]+" "+classic[1]):car.name;
  $("yt").href="https://www.youtube.com/results?search_query="+encodeURIComponent(q+" common problems rust");
  $("parts").href="https://www.gsfcarparts.com/catalogsearch/result/?q="+encodeURIComponent(q);
  var raw=String(car.plate||"").replace(/\s/g,"");
  $("motLink").href=raw?"https://www.check-mot.service.gov.uk/results?registration="+encodeURIComponent(raw):"https://www.gov.uk/check-mot-history";
  if(window.loadMotHistory)window.loadMotHistory(raw);
  $("status").textContent=pack.k?("Guide ready for "+pack.name):("Checks ready for "+title);
  paintSaved();
}
function run(){
  try{
    var plate=$("plate").value.trim(), q=$("q").value.trim(), g=garageCar();
    var name=q||(g&&(g.nick||g.name))||"";
    if(!name){$("status").textContent="Type a make and model first.";return}
    paint({name:name,plate:plate,fuel:guessFuel(name),year:plateYear(plate)});
  }catch(err){$("status").textContent="Search error: "+err.message}
}
document.addEventListener("click",function(e){
  var acc=e.target.closest(".accBtn");
  if(acc){
    var box=acc.parentNode;
    box.className=box.className.indexOf("open")>=0?"acc":"acc open";
    return;
  }
  var b=e.target.closest(".faultBtn");
  if(!b)return;
  var box=b.parentNode;
  box.className=box.className.indexOf("open")>=0?"fault":"fault open";
});
$("go").onclick=run;
$("saveBtn").onclick=function(){
  if(!current.name)run();
  if(!current.name)return;
  var list=loadView(),id=keyFor(),i,found=-1;
  for(i=0;i<list.length;i++)if(list[i].id===id)found=i;
  var row={id:id,name:current.title||current.name,plate:current.plate||"",year:current.year,fuel:current.fuel,ticks:{}};
  if(found>=0)list[found]=Object.assign(list[found],row); else list.unshift(row);
  saveView(list);$("status").textContent="Saved to viewings: "+row.name;paintSaved();
};
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")run()});
$("plate").addEventListener("keydown",function(e){if(e.key==="Enter")run()});
(function init(){
  var p=new URLSearchParams(location.search);
  if(p.get("plate"))$("plate").value=p.get("plate");
  if(p.get("q"))$("q").value=p.get("q");
  var g=garageCar();
  if(!$("plate").value)$("plate").value=(g&&g.plate)||"";
  if(!$("q").value)$("q").value=(g&&(g.nick||g.name))||"";
  if($("q").value)run(); else paintSaved();
})();
</script>
</body>
</html>
