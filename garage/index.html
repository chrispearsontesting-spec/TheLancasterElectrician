<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Garage route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="./ui.css"/>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--line:rgba(255,255,255,.12);--ring:#6b7280;--ice:#9fd8ff}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 24px}
h1{font-size:22px;margin:0 0 10px}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
input{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px;font-size:16px}
.suggest{position:relative}
.suggest-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:#171a20;border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.suggest-hit{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:11px 12px;font-size:14px}
.suggest-hit:last-child{border-bottom:0}
.suggest-hit b{font-weight:600}
.btn{width:100%;border:0;border-radius:999px;padding:13px;font-weight:800;margin-top:8px;background:radial-gradient(circle at 50% 20%,#6e6e6e 0%,#2c2c2c 40%,#101010 78%);color:#fff;border:1px solid var(--ring)}
.ghost{background:radial-gradient(circle at 50% 28%,#5c5c5c 0%,#2a2a2a 45%,#121212 80%);color:#fff;border:1px solid var(--ring)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#14161b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.prices{background:linear-gradient(180deg,#1a1d24 0%,#12141a 100%);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px 14px 12px;margin:0 0 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.prices .kicker{color:#9aa3b0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcell{background:#0e1014;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 8px;text-align:center}
.pcell span{display:block;color:#9aa3b0;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.pcell b{display:block;color:#f3efe6;font-size:22px;margin-top:4px;font-weight:800}
.pcell em{display:block;color:#9fd8ff;font-size:11px;font-style:normal;margin-top:2px}
.prices .when{margin:10px 0 0;color:#9aa3b0;font-size:11px;text-align:center}
.err{color:#e7b1a0;font-size:13px;min-height:16px}
.muted{color:var(--dim);font-size:12px}
#map{height:220px;border-radius:14px;margin-top:10px;border:1px solid var(--line);background:#e8eef4}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.triple{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.triple.withYear{grid-template-columns:1fr 1fr 1fr}
.mode span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase}
.mode b{display:block;font-size:22px;margin-top:2px}
.split{background:#171a20;border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.hide{display:none}
.opts{display:flex;gap:8px;margin-top:10px}
.opt{flex:1;display:flex;align-items:center;gap:8px;background:#171a20;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:14px;font-weight:600}
.opt input{width:18px;height:18px;accent-color:#9aa3b0;padding:0;margin:0}
#yearBox{margin-top:8px}
</style>
</head>
<body>
<h1>Route cost</h1>
<div class="prices">
  <p class="kicker">UK average fuel price</p>
  <div class="pgrid" id="priceGrid">
    <div class="pcell"><span>Diesel</span><b id="pDiesel">195.2p</b><em>per litre</em></div>
    <div class="pcell"><span>Petrol</span><b id="pPetrol">171.1p</b><em>per litre</em></div>
  </div>
  <p class="when" id="priceWhen"></p>
</div>
<label>From</label>
<input id="from" autocomplete="off" placeholder="Start typing a place"/>
<label>To</label>
<input id="to" autocomplete="off" placeholder="Start typing a place"/>
<div>
  <label id="mpgLabel">Diesel MPG</label>
  <input id="mpgOverride" type="number" step="0.1" value="38"/>
</div>
<div id="phevBox" class="hide">
  <label>Electric range (miles)</label>
  <input id="evRange" type="number" placeholder="e.g. 30"/>
</div>
<button class="btn" id="go" type="button">Check route</button>
<p class="err" id="err"></p>
<div id="map" class="hide"></div>
<div class="card hide" id="result">
  <b id="rTitle">Route</b>
  <p class="muted" id="rMeta"></p>
  <div class="opts" id="routeOpts">
    <label class="opt"><input type="checkbox" id="isReturn" checked/> Return</label>
    <label class="opt"><input type="checkbox" id="isYear"/> Yearly commute</label>
  </div>
  <div id="yearBox" class="hide">
    <div class="row">
      <div><label>Days / week</label><input id="days" type="number" min="1" max="7" value="5"/></div>
      <div><label>Weeks / year</label><input id="weeks" type="number" min="1" max="52" value="46"/></div>
    </div>
  </div>
  <div class="triple" id="costRow">
    <div class="mode split"><span>One way</span><b id="rOne">-</b><span class="muted" id="rOneMeta"></span></div>
    <div class="mode split"><span>Return</span><b id="rRet">-</b><span class="muted" id="rRetMeta"></span></div>
    <div class="mode split hide" id="yearCol"><span>Year</span><b id="rAnn">-</b><span class="muted" id="rAnnMeta"></span></div>
  </div>
  <div class="pair">
    <div class="mode"><span>Steady</span><b id="rEco">-</b><span class="muted" id="rEcoMeta"></span></div>
    <div class="mode"><span>Quick</span><b id="rQuick">-</b><span class="muted" id="rQuickMeta"></span></div>
  </div>
  <p class="muted hide" id="rYear"></p>
  <p class="muted" id="rRoads"></p>
  <div class="row">
    <button class="btn ghost" id="saveFav" type="button">Save</button>
    <button class="btn ghost" id="setHome" type="button">Set home</button>
  </div>
</div>
<a class="btn ghost" href="timeline.html" style="display:block;text-align:center;text-decoration:none;margin-top:12px">Journey log</a>
<a class="btn ghost" href="home.html" style="display:block;text-align:center;text-decoration:none;margin-top:8px">Back</a>
<input id="plate" type="hidden"/>
<input id="q" type="hidden"/>
<div id="favs" class="hide"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="trip-specs.js"></script>
<script src="cars-uk-1.js"></script>
<script src="cars-uk-2.js"></script>
<script src="cars-uk-3.js"></script>
<script src="cars-uk-4.js"></script>
<script src="cars-uk-5.js"></script>
<script src="cars-uk-6.js"></script>
<script src="cars-uk-7.js"></script>
<script src="./trip-engine.js"></script>
<script src="./route-app.js"></script>
<script src="./route-prices.js"></script>
<script src="./route-map.js"></script>
<script src="./route-save.js"></script>
<script src="./place-suggest.js"></script>
<script src="./route-clear.js"></script>
<script>if(typeof paintPrices==="function")paintPrices();</script>
</body>
</html>
