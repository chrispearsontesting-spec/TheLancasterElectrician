<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Garage</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--teal:#0d9488;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(12px + env(safe-area-inset-top)) 14px 28px}
.hero{width:100%;height:210px;object-fit:cover;border-radius:18px;display:block;background:#171a20}
.plate{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#f4f1ea;color:#111;font-weight:800;letter-spacing:.08em;padding:6px 14px;border-radius:6px;font-size:15px;border:2px solid #222}
.heroWrap{position:relative;margin-bottom:10px}
.nameRow{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:8px 0 12px}
.nameRow button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#171a20;color:var(--ink);font-size:20px}
.name{text-align:center;font-weight:800;font-size:18px}
.card{background:#14161b;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row span{color:var(--dim)}
.row b{font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:13px 8px;font-weight:800;background:var(--teal);color:#fff;font-size:14px}
.stack .btn{width:100%;margin-top:8px}
.muted{color:var(--dim);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="heroWrap">
  <img class="hero" alt="Volvo XC60 D5" src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/Volvo_XC_60_D5_AWD_2011_%2814544675804%29.jpg/1280px-Volvo_XC_60_D5_AWD_2011_%2814544675804%29.jpg"/>
  <div class="plate">SB61 LGZ</div>
</div>
<div class="nameRow">
  <button type="button" aria-label="Previous">&#8249;</button>
  <div class="name">Volvo XC60 D5</div>
  <button type="button" aria-label="Next">&#8250;</button>
</div>
<div class="card">
  <div class="row"><span>MOT expiry</span><b>12 Nov 2026</b></div>
  <div class="row"><span>Tax expiry</span><b>1 Oct 2026</b></div>
  <div class="row"><span>Insurance expiry</span><b>18 Mar 2027</b></div>
  <div class="row"><span>Oil / service</span><b>due 1,200 mi</b></div>
  <div class="row"><span>Timing belt</span><b>due 8,400 mi</b></div>
  <div class="row"><span>Tyres</span><b>check soon</b></div>
</div>
<div class="actions">
  <a class="btn" href="https://www.gov.uk/check-mot-history">History</a>
  <a class="btn" href="https://www.gov.uk/check-mot-status">Check</a>
  <a class="btn" href="https://www.gov.uk/vehicle-tax">Pay</a>
</div>
<div class="stack">
  <a class="btn" href="./">Trip cost</a>
  <a class="btn" href="https://www.gov.uk/get-vehicle-information-from-dvla">Vehicle check</a>
</div>
<p class="muted">Dates are placeholders until DVLA is linked.</p>
</body>
</html>
