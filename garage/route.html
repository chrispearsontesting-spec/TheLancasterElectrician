<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--line:rgba(255,255,255,.12);--ring:#6b7280;--ice:var(--accent)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 24px}
h1{font-size:22px;margin:0 0 10px}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
input{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px;font-size:16px}
.suggest{position:relative}
.suggest-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:#171a20;border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.suggest-hit{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:11px 12px;font-size:14px}
.suggest-hit:last-child{border-bottom:0}
.suggest-hit b{font-weight:600}
.btn{width:100%;border:0;border-radius:999px;padding:13px;font-weight:800;margin-top:8px;background:radial-gradient(circle at 50% 20%,#6e6e6e 0%,#2c2c2c 40%,#101010 78%);color:#fff;border:1px solid var(--ring)}
.ghost{background:radial-gradient(circle at 50% 28%,#5c5c5c 0%,#2a2a2a 45%,#121212 80%);color:#fff;border:1px solid var(--ring)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#14161b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.prices{background:linear-gradient(180deg,#1a1d24 0%,#12141a 100%);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px 14px 12px;margin:0 0 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.prices .kicker{color:#9aa3b0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcell{background:#0e1014;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 8px;text-align:center;color:inherit;width:100%;cursor:pointer}
.pcell.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.08);box-shadow:inset 0 0 0 1px var(--accent)}
.pcell span{display:block;color:#9aa3b0;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.pcell b{display:block;color:#f3efe6;font-size:22px;margin-top:4px;font-weight:800}
.pcell em{display:block;color:var(--accent);font-size:11px;font-style:normal;margin-top:2px}
.prices .when{margin:10px 0 0;color:#9aa3b0;font-size:11px;text-align:center}
.err{color:#e7b1a0;font-size:13px;min-height:16px}
.muted{color:var(--dim);font-size:12px}
#map{height:260px;border-radius:16px;margin-top:10px;border:1px solid var(--line);background:#e7eef6;overflow:hidden}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(255,255,255,.8)}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.85)!important}
.crow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.crow b{font-size:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.triple{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.triple.withYear{grid-template-columns:1fr 1fr 1fr}
.mode span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase}
.mode b{display:block;font-size:22px;margin-top:2px}
.split{background:#171a20;border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.hide{display:none}
.cycles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.cycle{border:1px solid rgba(255,255,255,.12);background:#171a20;color:#f3efe6;border-radius:12px;padding:10px 8px;font-weight:700}
.cycle.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.opts{display:flex;gap:8px;margin-top:10px}
.opt{flex:1;display:flex;align-items:center;gap:8px;background:#171a20;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:14px;font-weight:600}
.opt input{width:18px;height:18px;accent-color:#9aa3b0;padding:0;margin:0}
#yearBox{margin-top:8px}
.routeActs,.routeActs a{display:flex !important;justify-content:center !important;align-items:center !important;text-align:center !important;font-size:16px !important}
#go,a[href="calendar.html#routes"],a[href="home.html"]{display:flex !important;justify-content:center !important;align-items:center !important;text-align:center !important;font-size:16px !important;margin-top:8px}
/* Simplified layout (t262u): journey first, settings folded, one accent action */
body{padding-top:calc(64px + env(safe-area-inset-top)) !important}
.card.rc{background:#141416 !important;border:1px solid #2a2a2e !important;border-radius:18px;padding:14px;margin:0 0 12px}
.card.rc label:first-child{margin-top:0}
#go{background:var(--accent) !important;background-image:none !important;color:var(--on-accent) !important;border:0 !important;box-shadow:none !important;min-height:54px;border-radius:16px !important;font-weight:700 !important;margin-top:14px !important}
#go .ico{color:var(--on-accent) !important}
#result{border-radius:18px !important;margin:0 0 12px}
#map{margin:0 0 12px}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:28px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .ft{font-weight:650;font-size:15px}
details.fold>summary .fsum{margin-left:auto;color:#8b8b8b;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.fold>summary::after{content:"";width:8px;height:8px;border:solid #6b6f76;border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 4px 3px 2px;transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
details.fold[open]>summary{margin-bottom:12px}
#setFold .prices{background:none !important;border:0 !important;box-shadow:none !important;padding:0 !important;margin:0 0 6px !important}
#setFold .pgrid{grid-template-columns:repeat(4,1fr);gap:6px}
#setFold .pcell{padding:8px 4px}
#setFold .pcell b{font-size:16px}
#setFold .pcell span,#setFold .pcell em{font-size:10px}
.cycle.on,.pcell.on{border-color:rgba(var(--accent-rgb),.5) !important;box-shadow:none !important}
#err:empty{display:none !important}
#tripCard .err{margin:10px 0 0}
</style>
</head>
<body>
<header class="appbar"><h1>Route costs</h1></header>
<section class="card rc" id="tripCard">
<label for="from">From</label>
<input id="from" autocomplete="off" placeholder="Start typing a place"/>
<label for="to">To</label>
<input id="to" autocomplete="off" placeholder="Start typing a place"/>
<button class="btn" id="go" type="button">Check route</button>
<p class="err" id="err"></p>
</section>
<div id="map" class="hide"></div>
<div class="card hide" id="result">
  <b id="rTitle">Route</b>
  <p class="muted" id="rMeta"></p>
  <div class="opts" id="routeOpts">
    <label class="opt"><input type="checkbox" id="isReturn" checked/> Return</label>
    <label class="opt"><input type="checkbox" id="isYear"/> Yearly commute</label>
  </div>
  <div id="yearBox" class="hide">
    <div class="row">
      <div><label>Days / week</label><input id="days" type="number" min="1" max="7" value="5"/></div>
      <div><label>Weeks / year</label><input id="weeks" type="number" min="1" max="52" value="46"/></div>
    </div>
  </div>
  <div class="triple" id="costRow">
    <div class="mode split"><span>One way</span><b id="rOne">-</b><span class="muted" id="rOneMeta"></span></div>
    <div class="mode split"><span>Return</span><b id="rRet">-</b><span class="muted" id="rRetMeta"></span></div>
    <div class="mode split hide" id="yearCol"><span>Year</span><b id="rAnn">-</b><span class="muted" id="rAnnMeta"></span></div>
  </div>
  <div class="pair">
    <div class="mode"><span>Steady</span><b id="rEco">-</b><span class="muted" id="rEcoMeta"></span></div>
    <div class="mode"><span>Quick</span><b id="rQuick">-</b><span class="muted" id="rQuickMeta"></span></div>
  </div>
  <p class="muted hide" id="rYear"></p>
  <p class="muted" id="rRoads"></p>
  <div class="row">
    <button class="btn ghost" id="saveFav" type="button">Save</button>
    <button class="btn ghost" id="setHome" type="button">Set home</button>
  </div>
</div>
  <div class="card hide" id="compareCard">
    <b>Same journey, other cars</b>
    <div id="compareBody"></div>
  </div>
<details class="card rc fold" id="setFold">
<summary><span class="ft">Fuel &amp; economy</span><span class="fsum" id="setSum"></span></summary>
<div class="prices">
  <p class="kicker">UK average fuel price</p>
  <div class="pgrid" id="priceGrid">
    <button class="pcell on" type="button" data-fuel="diesel"><span>Diesel</span><b id="pDiesel">199.9p</b><em>per litre</em></button>
    <button class="pcell" type="button" data-fuel="petrol"><span>Petrol</span><b id="pPetrol">174.8p</b><em>per litre</em></button>
    <button class="pcell" type="button" data-fuel="offpeak"><span>Off-peak</span><b id="pOff">14.0p</b><em>per kWh</em></button>
    <button class="pcell" type="button" data-fuel="peak"><span>Day rate</span><b id="pPeak">26.3p</b><em>per kWh</em></button>
  </div>
  <p class="when" id="priceWhen">23 Sep 2026 · UK national average</p>
</div>
<div>
  <label id="mpgLabel">Economy</label>
  <div class="cycles" id="cycles">
    <button class="cycle on" type="button" data-cycle="combined">Combined</button>
    <button class="cycle" type="button" data-cycle="custom">Custom</button>
  </div>
  <p class="muted" id="fuelNote">Combined figure. Tap Custom if yours differs.</p>
  <input id="mpgOverride" type="number" step="0.1" value="38"/>
</div>
<div id="phevBox" class="hide">
  <label>Electric range (miles)</label>
  <input id="evRange" type="number" placeholder="e.g. 30"/>
</div>
</details>
<a class="btn" href="calendar.html#routes" data-ico="cal">Saved routes (Drive diary)</a>
<a class="btn backBtn" href="home.html">Back</a>

<input id="plate" type="hidden"/>
<input id="q" type="hidden"/>
<div id="favs" class="hide"></div>
<script src="./vendor/maplibre/maplibre-gl.js?v=4.7.1"></script>
<script src="trip-specs.js"></script>
<script src="cars-uk-1.js"></script>
<script src="cars-uk-2.js"></script>
<script src="cars-uk-3.js"></script>
<script src="cars-uk-4.js"></script>
<script src="cars-uk-5.js"></script>
<script src="cars-uk-6.js"></script>
<script src="cars-uk-7.js"></script>
<script src="./trip-engine.js"></script>
<script src="./route-app.js?v=24"></script>
<script src="./route-prices.js?v=23"></script>
<script src="./route-map.js?v=32"></script>
<script src="./route-save.js"></script>
<script src="./place-suggest.js"></script>
<script src="./route-clear.js"></script>
<script src="./mpg-uk.js?v=36"></script>
<script src="./fuel-pick.js?v=38"></script>
<script src="./compare.js?v=40"></script>
<script>
(function(){
  function apply(p){
    if(!p)return;
    if(document.getElementById("pDiesel")&&p.diesel_ppl) document.getElementById("pDiesel").textContent=(+p.diesel_ppl).toFixed(1)+"p";
    if(document.getElementById("pPetrol")&&p.petrol_ppl) document.getElementById("pPetrol").textContent=(+p.petrol_ppl).toFixed(1)+"p";
    if(document.getElementById("priceWhen")&&p.date) document.getElementById("priceWhen").textContent=p.date+" \u00b7 UK national average";
    if(window.PRICE){
      if(+p.diesel_ppl) PRICE.diesel=+p.diesel_ppl;
      if(+p.petrol_ppl) PRICE.petrol=+p.petrol_ppl;
      if(+p.electric_pkwh) PRICE.electric=+p.electric_pkwh;
      if(+p.offpeak_pkwh) PRICE.offpeak=+p.offpeak_pkwh;
      if(p.date) PRICE.date=p.date;
    }
  }
  fetch("prices.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(apply).catch(function(){});
})();
</script>
<script>
(function(){ // Fuel & economy summary line, e.g. "Diesel 195.4p · 42 mpg"
  function sum(){ var on=document.querySelector(".pcell.on"), m=document.getElementById("mpgOverride"), t="";
    if(on) t=on.querySelector("span").textContent+" "+on.querySelector("b").textContent;
    if(m&&m.value&&!/kwh/i.test(on?on.textContent:"")) t+=(t?" · ":"")+m.value+" mpg";
    document.getElementById("setSum").textContent=t; }
  document.addEventListener("click",function(e){ if(e.target.closest(".pcell,.cycle")) setTimeout(sum,30); });
  document.addEventListener("input",function(e){ if(e.target.id==="mpgOverride") sum(); });
  window.addEventListener("load",function(){ sum(); setTimeout(sum,800); }); sum();
})();
</script>
</body>
