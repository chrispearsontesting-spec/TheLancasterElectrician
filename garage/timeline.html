<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Journey log</title>
<link rel="stylesheet" href="./ui.css"/>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--line:rgba(255,255,255,.12);--ring:#6b7280}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
h1{font-size:22px;margin:0 0 6px}
.muted{color:var(--dim);font-size:13px;line-height:1.45}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:13px;font-weight:800;margin-top:10px;background:radial-gradient(circle at 50% 28%,#5c5c5c 0%,#2a2a2a 45%,#121212 80%);color:#fff;text-align:center;text-decoration:none;border:1px solid var(--ring)}
.route{width:100%;text-align:left;background:#14161b;border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:14px;margin-top:10px}
.route .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.route b.title{display:block;font-size:16px}
.route .cost{font-size:18px;font-weight:800;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;color:#d7dde6;background:#1d2128;border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.more{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.kv span{color:var(--dim)}
.empty{background:#14161b;border:1px dashed var(--line);border-radius:16px;padding:18px;margin-top:14px;color:var(--dim)}
.hide{display:none}
</style>
</head>
<body>
<h1>Journey log</h1>
<p class="muted">Saved routes from Route cost. Tap a card for the full breakdown.</p>
<div id="list"></div>
<p class="empty" id="empty">No saved journeys yet. Check a route, then tap Save.</p>
<a class="btn" href="./index.html">Back to route cost</a>
<script src="./trip-engine.js"></script>
<script>
function kindLabel(t){
  if(t.isYear) return "Yearly commute";
  if(t.isReturn) return "Return";
  return "One way";
}
function headline(t){
  if(t.isYear && t.yearGBP!=null) return moneyTxt(t.yearGBP);
  if(t.isReturn && t.retGBP!=null) return moneyTxt(t.retGBP);
  if(t.oneGBP!=null) return moneyTxt(t.oneGBP);
  var s=scoreTrip(t);
  return moneyTxt(s.gbp);
}
function render(){
  var list=tripStore();
  var box=document.getElementById("list");
  var empty=document.getElementById("empty");
  empty.className=list.length?"empty hide":"empty";
  box.innerHTML=list.map(function(t,i){
    var miles=(+t.miles||0).toFixed(1);
    var mins=t.mins||Math.round((+t.oneSecs||0)/60);
    var tags=[kindLabel(t)];
    if(t.isReturn) tags.push("Return");
    if(t.isYear) tags.push((t.days||5)+" d / wk \u00b7 "+(t.weeks||46)+" wks");
    tags.push(miles+" mi each way");
    var extra="";
    extra+="<div class='kv'><span>One way</span><b>"+moneyTxt(t.oneGBP)+"</b></div>";
    extra+="<div class='kv'><span>Return</span><b>"+moneyTxt(t.retGBP)+"</b></div>";
    if(t.isYear) extra+="<div class='kv'><span>Year ("+(t.days||5)+" \u00d7 "+(t.weeks||46)+")</span><b>"+moneyTxt(t.yearGBP)+"</b></div>";
    extra+="<div class='kv'><span>Time one way</span><b>"+(mins||"-")+" min</b></div>";
    extra+="<div class='kv'><span>MPG used</span><b>"+(t.rated?Number(t.rated).toFixed(1):"-")+"</b></div>";
    extra+="<div class='kv'><span>Fuel price</span><b>"+(t.ppl?Number(t.ppl).toFixed(1)+"p":"-")+"</b></div>";
    if(t.roads&&t.roads.length) extra+="<p class='muted'>"+t.roads.join(" \u00b7 ")+"</p>";
    extra+="<p class='muted'>"+new Date(t.when||Date.now()).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+"</p>";
    return "<button type='button' class='route' data-i='"+i+"'><div class='top'><div><b class='title'>"+(t.title||(t.from+" \u2192 "+t.to))+"</b><div class='muted'>"+miles+" mi \u00b7 "+kindLabel(t)+"</div></div><div class='cost'>"+headline(t)+"</div></div><div class='tags'>"+tags.map(function(x){return "<span class='tag'>"+x+"</span>"}).join("")+"</div><div class='more hide'>"+extra+"</div></button>";
  }).join("");
}
document.getElementById("list").addEventListener("click",function(e){
  var b=e.target.closest(".route"); if(!b)return;
  var more=b.querySelector(".more");
  if(more) more.className=more.className.indexOf("hide")>=0?"more":"more hide";
});
render();
</script>
</body>
</html>
