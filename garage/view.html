<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Today's viewings</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--ice:#9fd8ff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin:0 0 16px}
.card{background:#14161b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;margin-top:8px;background:var(--ice);color:#0b0c0f;text-align:center;text-decoration:none}
.ghost{background:#171a20;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
b{font-size:16px}
.muted{color:var(--dim);font-size:12px;margin:4px 0 0}
.del{background:transparent;border:0;color:#fca5a5;font-weight:800;padding:8px}
.empty{color:var(--dim);padding:20px 8px;text-align:center}
</style>
</head>
<body>
<h1>Today's viewings</h1>
<p class="sub">Cars you saved from the buying guide. Tap one to open its checks on the drive.</p>
<div id="list"></div>
<a class="btn" href="buy.html">Add a car to view</a>
<a class="btn ghost" href="home.html">Back</a>
<script>
function load(){
  try{return JSON.parse(localStorage.getItem("gt.viewings.v1")||"[]")}catch(e){return []}
}
function save(list){localStorage.setItem("gt.viewings.v1",JSON.stringify(list))}
function ticks(car){
  var n=0,k;
  if(!car.ticks)return 0;
  for(k in car.ticks)if(car.ticks[k])n++;
  return n;
}
function render(){
  var list=load(), box=document.getElementById("list");
  if(!list.length){box.innerHTML="<p class='empty'>Nothing saved yet. Open the buying guide, look a car up, then tap Save to viewings.</p>";return}
  box.innerHTML=list.map(function(c,i){
    var href="buy.html?plate="+encodeURIComponent(c.plate||"")+"&q="+encodeURIComponent(c.name||"");
    return "<div class='card'><div class='row'><div><b>"+ (c.name||"Car") +"</b><p class='muted'>"+[c.plate||"",c.year?("reg ~"+c.year):"",ticks(c)?(ticks(c)+" checks ticked"):""].filter(Boolean).join(" \u00b7 ")+"</p></div><button class='del' data-i='"+i+"'>Remove</button></div><a class='btn' href='"+href+"'>Open guide</a></div>";
  }).join("");
  box.querySelectorAll(".del").forEach(function(btn){
    btn.onclick=function(){
      var next=load();
      next.splice(parseInt(btn.getAttribute("data-i"),10),1);
      save(next);render();
    };
  });
}
render();
</script>
</body>
</html>
