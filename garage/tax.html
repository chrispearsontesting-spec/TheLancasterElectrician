<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Check tax</title>
<script src="./mot-config.js"></script>
<style>
body{margin:0 auto;max-width:440px;padding:16px;font-family:-apple-system,sans-serif;background:#fff;color:#111}
h1{font-size:18px;margin:8px 0}
.plate{display:flex;align-items:center;justify-content:center;background:#f5c518;color:#111;font-weight:800;font-size:28px;letter-spacing:2px;border-radius:8px;padding:12px 16px;margin:16px auto;width:fit-content}
.box{border-radius:4px;color:#fff;text-align:center;padding:28px 16px;margin:14px 0;font-weight:700}
.ok{background:#2f7d32}.bad{background:#c0392b}.wait{background:#444}
.box b{display:block;font-size:22px;margin-bottom:6px}
a{color:#1d4ed8}
</style>
</head>
<body>
<h1>Check if a vehicle is taxed and has an MOT</h1>
<div class="plate" id="plate">—</div>
<div class="box wait" id="tax"><b>Checking…</b></div>
<div class="box wait" id="mot"><b>Checking…</b></div>
<p id="note"></p>
<a id="gov" href="https://vehicleenquiry.service.gov.uk/" target="_blank">Open the official GOV.UK page</a>
<script>
var plate=new URLSearchParams(location.search).get("plate")||"";
plate=plate.toUpperCase().replace(/[^A-Z0-9]/g,"");
document.getElementById("plate").textContent=plate||"—";
var proxy=(window.MOT_PROXY||"").replace(/\/$/,"");
if(!proxy||!plate){ document.getElementById("tax").innerHTML="<b>No plate</b>"; }
else Promise.all([
  fetch(proxy+"/?plate="+plate+"&tax=1").then(function(r){return r.json()}).catch(function(){return {}}),
  fetch(proxy+"/?plate="+plate).then(function(r){return r.json()}).catch(function(){return {}})
]).then(function(both){
  var d=both[0]||{}, m=both[1]||{};
  var tax=document.getElementById("tax"), mot=document.getElementById("mot");
  var taxed=/taxed/i.test(d.tax)&&!/untaxed/i.test(d.tax);
  tax.className="box "+(d.tax==="SORN"||taxed?"ok":"bad");
  tax.innerHTML="<b>"+(d.tax||"Unknown")+"</b>";
  var tests=m.motTests||[], latest=tests[0]||{}, exp=latest.expiryDate||"";
  var nice=exp?exp.slice(8,10).replace(/^0/,"")+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+exp.slice(5,7)-1]+" "+exp.slice(0,4):"";
  var due=exp?new Date(exp+"T00:00:00"):null, overdue=due&&due<new Date();
  mot.className="box "+(overdue?"bad":"ok");
  mot.innerHTML="<b>MOT</b>"+(nice?(overdue?"Expired: ":"Expires: ")+nice:"No date returned");
}).catch(function(){
  document.getElementById("tax").className="box bad";
  document.getElementById("tax").innerHTML="<b>Could not check</b>";
  document.getElementById("note").textContent="The check worker needs a one-time update. Open the official page for now.";
});
</script>
</body>
</html>
