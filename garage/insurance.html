<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>Insurance</title>
<link rel="stylesheet" href="./ui.css?v=28"/>
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:440px;background:#0b0c0e;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}
h1{font-size:22px;margin:0 0 4px;font-weight:650}
.sub{color:#8b8b8b;margin:0 0 16px;font-size:14px}
.card{background:#141416;border:1px solid #2a2a2e;border-radius:18px;padding:14px;margin-bottom:12px}
.when{color:#cfcfcf;font-size:20px;font-weight:650;margin:0}
.left{color:#8b8b8b;font-size:13px;margin:6px 0 0}
.btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#1c1c1e;color:#f2f2f2;text-decoration:none;border:0;border-radius:18px;padding:16px 18px;font-weight:600;font-size:16px;margin-top:10px}
.btn[disabled]{opacity:.45}
.note{color:#8b8b8b;font-size:13px;line-height:1.45;margin:0}
iframe{width:100%;height:240px;border:0;border-radius:12px;background:#111;display:none}
iframe.on{display:block;margin-top:10px}
#doc canvas{width:100%;height:auto;border-radius:12px;margin-top:10px;background:#111}
#pick{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
label.btn{cursor:pointer}
#docAcc{margin-top:8px;background:transparent !important;border:0 !important;padding:0}
#docToggle{display:flex !important;justify-content:center !important;align-items:center !important;gap:8px !important;position:relative}
#docToggle .chev{position:absolute;right:16px}
#docAcc .accBody{display:none}
#docAcc.open .accBody{display:block}
#docAcc.open .chev{transform:rotate(45deg)}
.chev{display:inline-block}
#insDate{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.split{display:flex !important;justify-content:space-between !important}
</style>
</head>
<body>
<button class="btn split" type="button" id="saveDate" data-iconed="1"><span>Change expiry</span><span id="exp">—</span></button>
<input id="insDate" type="date"/>
<input id="pick" type="file" accept=".pdf,application/pdf,*/*"/>
<label class="btn" for="pick" id="up" data-iconed="1">Upload policy PDF</label>
<div class="acc" id="docAcc">
  <button type="button" class="btn" id="docToggle" data-iconed="1"><span>View policy</span><span class="chev">+</span></button>
  <div class="accBody" id="doc"></div>
</div>
<a class="btn" id="renew" data-iconed="1" href="#">Renew</a>
<p class="left" id="pdfName" hidden></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="./icons.js?v=28"></script>
<script>
function state(){
  try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");if(s&&s.cars&&s.cars.length)return s}catch(e){}
  return {i:0,cars:[{plate:"",ins:"",insWeb:"",nick:"Car"}]};
}
function car(){var s=state();return s.cars[s.i]||s.cars[0]}
function plate(p){p=String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(p.length>=7)return p.slice(0,4)+" "+p.slice(4);return p||"No plate yet"}
function nice(iso){if(!iso)return "Set date in Edit";var d=new Date(iso+"T12:00:00");return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function daysLeft(iso){
  if(!iso)return null;
  var end=new Date(iso+"T12:00:00"),now=new Date();now.setHours(12,0,0,0);
  return Math.round((end-now)/86400000);
}
function leftTxt(iso){
  var days=daysLeft(iso);
  if(days==null)return "Set expiry in Edit";
  if(days<0)return Math.abs(days)+" days overdue";
  if(days===0)return "Due today";
  return days+" days left";
}
function key(){return "gt.insPdf."+String((car().plate||"none")).toUpperCase().replace(/[^A-Z0-9]/g,"")}
function db(){
  return new Promise(function(res,rej){
    var r=indexedDB.open("dipstick",2);
    r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("files")) r.result.createObjectStore("files")};
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){rej(r.error)};
  });
}
async function getPdf(){
  try{
    var d=await db();
    return await new Promise(function(res,rej){
      var t=d.transaction("files").objectStore("files").get(key());
      t.onsuccess=function(){res(t.result||null)};
      t.onerror=function(){rej(t.error)};
    });
  }catch(e){return null}
}
async function putPdf(blob,name){
  var d=await db();
  return new Promise(function(res,rej){
    var t=d.transaction("files","readwrite").objectStore("files").put({blob:blob,name:name,at:Date.now()},key());
    t.onsuccess=function(){res()};
    t.onerror=function(){rej(t.error)};
  });
}
async function show(){
  var rec=await getPdf();
  var doc=document.getElementById("doc");
  doc.innerHTML="";
  if(!rec||!rec.blob){
    document.getElementById("pdfName").textContent="No document yet";
    return;
  }
  document.getElementById("pdfName").textContent=rec.name||"Policy PDF";
  var blob=rec.blob.type==="application/pdf"?rec.blob:new Blob([rec.blob],{type:"application/pdf"});
  var url=URL.createObjectURL(blob);
  var open=document.createElement("a");
  open.className="btn";
  open.href=url;
  open.target="_blank";
  open.textContent="Open full PDF";
  doc.appendChild(open);
  try{
    if(!window.pdfjsLib) return;
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    var data=await blob.arrayBuffer();
    var pdf=await pdfjsLib.getDocument({data:data}).promise;
    var n=Math.min(pdf.numPages,6), i;
    for(i=1;i<=n;i++){
      var page=await pdf.getPage(i);
      var vp=page.getViewport({scale:1.2});
      var cv=document.createElement("canvas");
      cv.width=vp.width;cv.height=vp.height;
      await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      doc.appendChild(cv);
    }
  }catch(e){
    doc.insertAdjacentHTML("beforeend","<p class='left'>Saved. Use Open full PDF if the preview does not draw.</p>");
  }
}
var c=car();
document.getElementById("exp").textContent=nice(c.ins);
document.getElementById("insDate").value=c.ins||"";
document.getElementById("saveDate").onclick=function(){
  var input=document.getElementById("insDate");
  input.focus();
  if(input.showPicker) input.showPicker();
};
document.getElementById("insDate").onchange=function(){
  var iso=this.value;
  if(!iso) return;
  var s=state();
  s.cars[s.i].ins=iso;
  localStorage.setItem("gt.garage", JSON.stringify(s));
  document.getElementById("exp").textContent=nice(iso);
};
document.getElementById("renew").href=c.insWeb||"https://www.gov.uk/vehicle-insurance";
var pick=document.getElementById("pick");
pick.addEventListener("change", async function(){
  var f=pick.files&&pick.files[0];
  if(!f){document.getElementById("pdfName").textContent="No file was returned. Try Downloads again.";return}
  document.getElementById("pdfName").textContent="Got "+(f.name||"file")+" ("+Math.max(1,Math.round(f.size/1024))+" KB). Saving…";
  try{
    var bytes=await f.arrayBuffer();
    var blob=new Blob([bytes],{type:"application/pdf"});
    await putPdf(blob,f.name||"policy.pdf");
    await document.getElementById("docToggle").addEventListener("click",function(){
  document.getElementById("docAcc").classList.toggle("open");
});
show();
  }catch(e){
    document.getElementById("pdfName").textContent="Could not save: "+(e&&e.message?e.message:"try a smaller PDF");
  }
});
document.getElementById("docToggle").addEventListener("click",function(){
  document.getElementById("docAcc").classList.toggle("open");
});
show();
</script>
</body>
</html>
