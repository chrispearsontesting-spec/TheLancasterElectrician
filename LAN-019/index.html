<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN-019 - EICR</title><link rel="stylesheet" href="../assets/headers.css"><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;margin:0;padding:20px 0;background:linear-gradient(180deg,#0f172a,#1e2937);min-height:100vh;visibility:hidden}.container{max-width:480px;margin:0 auto;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.35)}.header h1{font-size:28px}.content{padding:30px 24px 40px;text-align:center}.expiry{font-weight:700;font-size:18px;color:#b91c1c;margin:8px 0 25px}</style></head><body><div class="container"><div class="header blue"><svg class="header-icon bulb" viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4" stroke="#93c5fd" stroke-width="1.8" stroke-linecap="round"/><path d="M12 2a6.5 6.5 0 00-4.2 11.5c.5.4.8 1 .9 1.6h6.6c.1-.6.4-1.2.9-1.6A6.5 6.5 0 0012 2z" fill="#93c5fd" fill-opacity=".25" stroke="#bfdbfe" stroke-width="1.4"/><path d="M10 14.5h4" stroke="#93c5fd" stroke-width="1.4" stroke-linecap="round"/></svg><svg class="header-icon plug" viewBox="0 0 24 24" fill="none"><rect x="4" y="2.5" width="16" height="19" rx="3" stroke="#bfdbfe" stroke-width="1.5" fill="#93c5fd" fill-opacity=".15"/><rect x="10.5" y="5" width="3" height="5.5" rx=".6" fill="#93c5fd"/><rect x="6.5" y="13.5" width="3" height="5.5" rx=".6" fill="#93c5fd"/><rect x="14.5" y="13.5" width="3" height="5.5" rx=".6" fill="#93c5fd"/></svg><div class="header-inner"><h1>Electrical System Overview</h1><p class="address">Property address to be added • POSTCODE</p></div></div><div class="content"><p style="font-size:17px;line-height:1.6">EICR Test Date: To be confirmed</p><p><strong>Expiry Date:</strong> <span class="expiry">[DATE]</span></p><div class="buttons"><a href="documents.html" class="button" style="background:#2563eb">📚 View Documents &amp; History</a><a href="../../troubleshooting.html" class="button" style="background:#8b5cf6">🔧 Troubleshooting Guide</a><a class="button" style="background:#f59e0b">🔔 Set Expiry Reminder</a><a href="https://thelancasterelectrician.com" class="button" style="background:#25D366">📞 Contact The Lancaster Electrician</a></div></div></div><script>(function(){if(sessionStorage.getItem('eicrAccessGranted')==='true'){document.body.style.visibility='visible';return}const a=document.querySelector('.address');const t=a?a.textContent:'';const m=t.match(/\b([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})\b/i);if(!m){document.body.style.visibility='visible';return}const ok=m[1].toUpperCase().replace(/\s/g,'');const e=prompt("Enter your property postcode to view your secure EICR portal:");if(e&&e.toUpperCase().replace(/\s/g,'')===ok){sessionStorage.setItem('eicrAccessGranted','true');document.body.style.visibility='visible'}else{alert("Incorrect postcode.");window.location.href="https://thelancasterelectrician.com"}})();</script></body></html>
