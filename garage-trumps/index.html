<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Garage</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--gold:#e4c48a;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;height:100dvh}
#deck{display:flex;width:200%;height:100%;transform:translateX(-50%);transition:transform .28s ease}
#deck.game{transform:translateX(0)}
.page{width:50%;height:100%;padding:calc(16px + env(safe-area-inset-top)) 16px 22px;overflow:auto}
.hint{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.hero{border-radius:22px;overflow:hidden;border:1px solid rgba(228,196,138,.35);background:#14110c}
.hero img{width:100%;height:190px;object-fit:cover;display:block;background:#1a1712}
.hero .cap{padding:12px 14px}
.hero h1{margin:0;font-size:20px}
.addshot{display:block;text-align:center;padding:68px 16px;color:var(--gold);font-weight:800}
.due,.money{margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#14161b}
.due .r,.money .r{display:flex;justify-content:space-between;padding:11px 12px;border-top:1px solid var(--line);font-size:14px}
.due .r:first-child,.money .r:first-child{border-top:0}
.soon{color:#e4c48a}.late{color:#e7b1a0}
.btn{width:100%;border:0;border-radius:14px;padding:12px;font-weight:800;margin-top:8px}
.gold{background:var(--gold);color:#111}.ghost{background:#171a20;color:var(--ink);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input,select{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font-size:16px}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);padding:calc(20px + env(safe-area-inset-top)) 14px 20px;overflow:auto;z-index:5}
.sheet.on{display:block}
.panel{background:#14161b;border-radius:18px;padding:14px;max-width:440px;margin:0 auto}
.qr{width:120px;height:120px;background:#fff;border-radius:12px;float:right;margin:0 0 8px 8px}
.win{background:#2a2418;border:1px solid rgba(228,196,138,.35);border-radius:16px;padding:12px;margin-top:10px;clear:both}
.grid{display:grid;grid-template-columns:1fr 1fr}
.stat{padding:10px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.stat:nth-child(2n){border-right:0}
.stat span{display:block;color:var(--dim);font-size:10px;text-transform:uppercase}
.stat b{font-size:18px}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#3a3f48}
.dots i.on{background:var(--gold)}
</style>
</head>
<body>
<div id="deck">
<section class="page">
<div class="hint">Swipe left back to garage</div>
<img class="qr" id="qr" alt="QR"/>
<div class="hero" id="card"></div>
<p class="hint" id="joinStr" style="text-transform:none;letter-spacing:0;font-size:11px;clear:both;word-break:break-all"></p>
<label>Rounds</label>
<select id="rounds"><option>3</option><option selected>5</option><option>7</option></select>
<button class="btn gold" id="deal">Deal next</button>
<button class="btn ghost" id="recap">Who won</button>
<div id="out"></div>
</section>
<section class="page">
<div class="hint" id="navHint">Swipe right for Trumps</div>
<div class="hero" id="hero"></div>
<div class="dots" id="dots"></div>
<div class="due" id="dues"></div>
<div class="money" id="money"></div>
<div class="row3">
<button class="btn ghost" id="addCar">+ Car</button>
<button class="btn ghost" id="openSet">Edit</button>
<button class="btn gold" id="toGame">Trumps</button>
</div>
<button class="btn ghost" id="delCar" style="display:none">Remove this car</button>
</section>
</div>
<div class="sheet" id="sheet">
<div class="panel">
<h2 style="margin:0 0 8px">This car</h2>
<label>Name</label><input id="carName" placeholder="Your car details here"/>
<label>Photo — stays on this phone</label>
<input id="photo" type="file" accept="image/*" capture="environment"/>
<label>MOT</label><input id="mot" type="date"/>
<label>Tax</label><input id="tax" type="date"/>
<label>Insurance</label><input id="ins" type="date"/>
<label>Oil / service</label><input id="oil" type="date"/>
<label>Tyres fitted</label><input id="tyreDate" type="date"/>
<label>Tyre life miles</label><input id="tyreLife" type="number" placeholder="20000"/>
<label>Miles per year</label><input id="miles" type="number" placeholder="12000"/>
<label>UK MPG (combined)</label><input id="mpg" type="number" step="0.1" placeholder="38"/>
<label>Fuel</label>
<select id="fuel"><option value="petrol">Petrol</option><option value="diesel">Diesel</option></select>
<label>Pence per litre</label><input id="ppl" type="number" step="0.1"/>
<label>Insurance pounds / year</label><input id="insCost" type="number"/>
<label>Tax pounds / year</label><input id="taxCost" type="number"/>
<label>Trumps stats</label>
<div class="row2"><input id="s060" placeholder="0-60 s"/><input id="bhp" placeholder="BHP"/></div>
<div class="row2"><input id="nm" placeholder="Torque Nm"/><input id="boot" placeholder="Boot L"/></div>
<label>Remind days before</label>
<select id="lead"><option>7</option><option selected>14</option><option>30</option></select>
<button class="btn gold" id="save">Save</button>
<button class="btn ghost" id="close">Back</button>
</div>
</div>
<script>
var SEED={petrol:162.1,diesel:183.6,asof:"2 Sep 2026"};
function $(id){return document.getElementById(id)}
function uid(){return "c"+Math.random().toString(36).slice(2,8)}
function blank(){return {id:uid(),nick:"Your car details here",name:"Your car details here",s060:"",bhp:"",nm:"",boot:"",mpg:"",photo:"",mot:"",tax:"",ins:"",oil:"",tyreDate:"",tyreLife:"20000",miles:"12000",fuel:"petrol",ppl:"",insCost:"",taxCost:"",lead:14}}
function state(){try{var s=JSON.parse(localStorage.getItem("gt.garage")||"null");if(s&&s.cars&&s.cars.length)return s}catch(e){} var old=null,d={};try{old=JSON.parse(localStorage.getItem("gt.me")||"null")}catch(e){} try{d=JSON.parse(localStorage.getItem("gt.dates")||"{}")}catch(e){} var c=blank(); if(old){c.nick=old.nick||old.name||c.nick;c.name=c.nick;c.photo=old.photo||"";c.s060=old.s060||"";c.bhp=old.bhp||"";c.nm=old.nm||"";c.boot=old.boot||""} Object.keys(d).forEach(function(k){c[k]=d[k]}); return {i:0,cars:[c]}}
function saveState(s){localStorage.setItem("gt.garage",JSON.stringify(s))}
function car(){var s=state();return s.cars[s.i]||s.cars[0]}
function code(){var c=localStorage.getItem("gt.code");if(!c){c="GT-"+Math.random().toString(36).slice(2,6).toUpperCase();localStorage.setItem("gt.code",c)}return c}
function days(iso){if(!iso)return null;return Math.round((new Date(iso+"T12:00:00")-new Date())/86400000)}
function label(n){if(n==null)return "Set date";if(n<0)return Math.abs(n)+" days overdue";if(n===0)return "Due today";return n+" days"}
function tone(n,lead){if(n==null)return "";if(n<0)return "late";if(n<=+(lead||14))return "soon";return ""}
function tyreLeft(c){if(!c.tyreDate||!c.tyreLife||!c.miles)return null;var used=(new Date()-new Date(c.tyreDate+"T12:00:00"))/86400000/365*(+c.miles);return Math.max(0,Math.round(100*(1-used/+c.tyreLife)))}
function fuelCost(c){var miles=+(c.miles||0),mpg=+(c.mpg||0),ppl=+(c.ppl||SEED[c.fuel||"petrol"]);if(!miles||!mpg)return null;var y=miles/mpg*4.546*ppl/100;return {month:y/12,year:y,ppl:ppl}}
function paint(){var s=state(),c=s.cars[s.i]||s.cars[0],more=s.cars.length>1;$("navHint").textContent=more?"Right = Trumps  ·  Left = next car ("+(s.i+1)+"/"+s.cars.length+")":"Swipe right for Trumps";$("dots").innerHTML=s.cars.map(function(_,i){return "<i class='"+(i===s.i?"on":"")+"'></i>"}).join("");$("delCar").style.display=more?"block":"none";var shot=c.photo?'<img src="'+c.photo+'" alt="car"/>':'<label class="addshot">Tap to add a photo<input id="photoTop" type="file" accept="image/*" capture="environment" style="display:none"></label>';$("hero").innerHTML=shot+'<div class="cap"><h1>'+(c.nick||c.name)+'</h1><div class="dim">'+(c.mpg?c.mpg+" mpg UK":"Set UK MPG in Edit")+'</div></div>';var top=$("photoTop");if(top)top.onchange=$("photo").onchange;var tl=tyreLeft(c);$("dues").innerHTML=[["MOT",label(days(c.mot)),tone(days(c.mot),c.lead)],["Tax",label(days(c.tax)),tone(days(c.tax),c.lead)],["Insurance",label(days(c.ins)),tone(days(c.ins),c.lead)],["Oil / service",label(days(c.oil)),tone(days(c.oil),c.lead)],["Tyres",tl==null?"Set tyres":tl+"% left",tl!=null&&tl<=20?"soon":""]].map(function(r){return '<div class="r"><span>'+r[0]+'</span><b class="'+r[2]+'">'+r[1]+'</b></div>'}).join("");var f=fuelCost(c),ins=+(c.insCost||0),tax=+(c.taxCost||0),month=(ins+tax)/12+(f?f.month:0);$("money").innerHTML='<div class="r"><span>UK MPG</span><b>'+(c.mpg||"Set in Edit")+'</b></div><div class="r"><span>Fuel this month</span><b>'+(f?"£"+f.month.toFixed(0):"Need miles + MPG")+'</b></div><div class="r"><span>Fuel this year</span><b>'+(f?"£"+f.year.toFixed(0):"—")+'</b></div><div class="r"><span>Tax + insurance / year</span><b>'+(ins||tax?"£"+(ins+tax).toFixed(0):"Set in Edit")+'</b></div><div class="r"><span>Running / month</span><b>'+(month?"£"+month.toFixed(0):"—")+'</b></div><div class="r"><span>UK '+(c.fuel||"petrol")+' avg</span><b>'+(c.ppl||SEED[c.fuel||"petrol"])+'p · '+SEED.asof+'</b></div>';var cardShot=c.photo?'<img src="'+c.photo+'" alt=""/>':'<div class="addshot">Add photo</div>';$("card").innerHTML=cardShot+'<div class="cap"><h1>'+(c.nick||c.name)+'</h1></div><div class="grid">'+[["0–60",(c.s060||"—")+"s"],["BHP",c.bhp||"—"],["MPG",c.mpg||"—"],["Torque",(c.nm||"—")+" Nm"],["Boot",(c.boot||"—")+" L"],["Fuel",c.fuel||"—"]].map(function(x){return '<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join('')+'</div>';var payload=["GTJOIN",code(),c.nick||c.name,c.s060||"",c.bhp||"",c.nm||"",c.boot||"",c.mpg||""].join("|");var url=location.origin+location.pathname.replace(/index.html$/,"")+"?join="+encodeURIComponent(payload);$("joinStr").textContent=url;$("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+encodeURIComponent(url);$("carName").value=c.nick||"";$("mot").value=c.mot||"";$("tax").value=c.tax||"";$("ins").value=c.ins||"";$("oil").value=c.oil||"";$("tyreDate").value=c.tyreDate||"";$("tyreLife").value=c.tyreLife||"";$("miles").value=c.miles||"";$("mpg").value=c.mpg||"";$("fuel").value=c.fuel||"petrol";$("ppl").value=c.ppl||SEED[c.fuel||"petrol"];$("insCost").value=c.insCost||"";$("taxCost").value=c.taxCost||"";$("s060").value=c.s060||"";$("bhp").value=c.bhp||"";$("nm").value=c.nm||"";$("boot").value=c.boot||"";$("lead").value=String(c.lead||14)}
$("openSet").onclick=function(){$("sheet").className="sheet on"};
$("close").onclick=function(){$("sheet").className="sheet"};
$("toGame").onclick=function(){$("deck").className="game"};
$("addCar").onclick=function(){var s=state();s.cars.push(blank());s.i=s.cars.length-1;saveState(s);paint();$("sheet").className="sheet on"};
$("delCar").onclick=function(){var s=state();if(s.cars.length<2)return;s.cars.splice(s.i,1);s.i=Math.max(0,s.i-1);saveState(s);paint()};
var x0=0;
document.getElementById("deck").addEventListener("touchstart",function(e){x0=e.changedTouches[0].clientX});
document.getElementById("deck").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-x0,onGame=$("deck").className==="game";if(dx>50){if(!onGame)$("deck").className="game";return}if(dx<-50){if(onGame){$("deck").className="";return}var s=state();if(s.cars.length<2)return;s.i=(s.i+1)%s.cars.length;saveState(s);paint()}});
$("save").onclick=function(){var s=state(),c=s.cars[s.i];c.nick=$("carName").value||"Your car details here";c.name=c.nick;c.mot=$("mot").value;c.tax=$("tax").value;c.ins=$("ins").value;c.oil=$("oil").value;c.tyreDate=$("tyreDate").value;c.tyreLife=$("tyreLife").value;c.miles=$("miles").value;c.mpg=$("mpg").value;c.fuel=$("fuel").value;c.ppl=$("ppl").value;c.insCost=$("insCost").value;c.taxCost=$("taxCost").value;c.s060=$("s060").value;c.bhp=$("bhp").value;c.nm=$("nm").value;c.boot=$("boot").value;c.lead=+$("lead").value;saveState(s);paint();$("sheet").className="sheet"};
$("photo").onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var cv=document.createElement("canvas"),w=720,h=Math.round(img.height/img.width*720);cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);var s=state();s.cars[s.i].photo=cv.toDataURL("image/jpeg",0.72);saveState(s);paint()};img.src=r.result};r.readAsDataURL(f)};
var JOBS=[{t:"Flash flood.",fn:function(){return 4},w:"Gets through.",l:"Paddles."},{t:"Ikea run.",fn:function(c){return +(c.boot||300)/15},w:"One trip.",l:"Two trips."},{t:"Last orders.",fn:function(c){return 12-(parseFloat(c.s060)||10)},w:"First pint.",l:"Last dregs."},{t:"Long motorway.",fn:function(c){return +(c.mpg||30)},w:"Sips fuel.",l:"Drinks it."},{t:"Wet dog.",fn:function(c){return +(c.boot||300)/20},w:"Boot.",l:"Lap."}];
var st={i:0,order:[],scores:{},log:[]};
function rival(){try{var r=JSON.parse(localStorage.getItem("gt.rival")||"null");if(r)return r}catch(e){}return {name:"Friend's car details here",s060:"",bhp:"",nm:"",boot:"",mpg:""}}
$("deal").onclick=function(){var me=car(),them=rival();if(!st.order.length){var n=+$("rounds").value;st={i:0,order:JOBS.map(function(_,i){return i}).sort(function(){return Math.random()-.5}).slice(0,n),scores:{},log:[]}}if(st.i>=st.order.length){$("recap").click();return}var job=JOBS[st.order[st.i++]],a={c:me,s:job.fn(me)},b={c:them,s:job.fn(them)};var ranked=[a,b].sort(function(x,y){return y.s-x.s}),kn=function(x){return x.nick||x.name};st.scores[kn(ranked[0].c)]=(st.scores[kn(ranked[0].c)]||0)+3;st.scores[kn(ranked[1].c)]=(st.scores[kn(ranked[1].c)]||0)+1;st.log.push({t:job.t,win:kn(ranked[0].c)});$("out").innerHTML='<div class="win"><div class="dim">'+st.log.length+' / '+st.order.length+'</div><h3 style="margin:6px 0">'+job.t+'</h3><b>'+kn(ranked[0].c)+' — '+job.w+'</b><p>'+kn(ranked[1].c)+' — '+job.l+'</p></div>'};
$("recap").onclick=function(){var board=Object.keys(st.scores).map(function(k){return {k:k,s:st.scores[k]}}).sort(function(a,b){return b.s-a.s});$("out").innerHTML='<div class="win"><h3>'+(board[0]?board[0].k:"?")+' takes the table</h3>'+board.map(function(b){return '<div>'+b.k+' — '+b.s+' pts</div>'}).join('')+'</div>';st={i:0,order:[],scores:{},log:[]}};
(function(){var q=new URLSearchParams(location.search).get("join");if(!q)return;var p=decodeURIComponent(q).split("|");if(p[0]!=="GTJOIN")return;localStorage.setItem("gt.rival",JSON.stringify({name:p[2]||"Friend's car",nick:p[2],s060:p[3],bhp:p[4],nm:p[5],boot:p[6],mpg:p[7]}));if(p[1])localStorage.setItem("gt.code",p[1]);$("deck").className="game"})();
paint();
</script>
</body>
</html>
