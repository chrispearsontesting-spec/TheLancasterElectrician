<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0b0c0f"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<title>Garage</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--gold:#e4c48a;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100%}
.wrap{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 28px}
.hint{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.hero{border-radius:22px;overflow:hidden;border:1px solid rgba(228,196,138,.35);background:#14110c}
.hero-pic{position:relative}
.hero img,.addshot{width:100%;height:200px;object-fit:cover;display:block;background:#1a1712}
.addshot{display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;min-height:200px}
.hero h1{margin:0;font-size:20px;padding:10px 14px 12px}
.platebox{position:absolute;right:8px;bottom:8px;display:flex;align-items:stretch;background:#f7d117;border:2px solid #1a1a1a;border-radius:3px;box-shadow:0 2px 10px rgba(0,0,0,.45);max-width:72%}
.gb{background:#003399;color:#fff;width:16px;display:flex;align-items:flex-end;justify-content:center;padding:3px 0 3px;font-size:7px;font-weight:800}
.reg{color:#111;font-weight:900;letter-spacing:.1em;padding:3px 7px 2px;font-size:13px;font-family:Impact,"Arial Black",sans-serif;white-space:nowrap}
.box{margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#14161b}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;border-top:1px solid var(--line);font-size:13px}
.rk{display:block;font-weight:700}
.rc{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:15px;text-align:center;text-decoration:none;display:block}
.gold{background:var(--gold);color:#111}
.ghost{background:#171a20;color:var(--ink);border:1px solid var(--line)}
.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);padding:calc(18px + env(safe-area-inset-top)) 14px 24px;overflow:auto;z-index:20}
.sheet.on{display:block}
.panel{background:#14161b;border-radius:18px;padding:14px;max-width:440px;margin:0 auto}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
input,select{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font-size:16px}
.copy{color:#c9c2b4;font-size:13px;line-height:1.45;margin:10px 0}
.hide{display:none}
.win{background:#2a2418;border:1px solid rgba(228,196,138,.35);border-radius:16px;padding:14px;margin-top:12px}
.invite{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.invite img{width:96px;height:96px;background:#fff;border-radius:10px;display:block;margin:8px auto}
.invite .url{font-size:10px;color:var(--dim);word-break:break-all;margin:8px 0}
#strip{width:100%;height:240px;border-radius:16px;border:1px solid rgba(228,196,138,.35);background:#14110c;display:block}
</style>
</head>
<body>
<div class="wrap" id="garageView">
<p class="hint" id="navHint">Garage</p>
<div class="hero" id="hero"></div>
<div class="dots" id="dots"></div>
<div class="box" id="dues"></div>
<div class="box" id="money"></div>
<div class="row">
<button class="btn ghost" type="button" id="btnAdd">+ Car</button>
<button class="btn ghost" type="button" id="btnEdit">Edit</button>
<button class="btn gold" type="button" id="btnGame">Trumps</button>
</div>
<div class="row2">
<button class="btn ghost" type="button" id="btnQuotes">Job quotes</button>
<button class="btn ghost" type="button" id="btnDiyPage">DIY service</button>
</div>
<button class="btn gold" type="button" id="btnRace" style="margin-top:8px">Race</button>
<button class="btn ghost hide" type="button" id="btnDel" style="margin-top:8px">Remove this car</button>
</div>
<div class="wrap hide" id="jobsView">
<p class="hint">Work on this car</p>
<button class="btn ghost" type="button" id="btnJobsBack">Back to garage</button>
<div class="hero" id="jobsHero" style="margin-top:10px"></div>
<div class="pad" style="padding:10px"><select id="jobPick"></select><div id="jobOut"></div><div id="diyOut"></div></div>
</div>
<div class="wrap hide" id="gameView">
<p class="hint">Garage Trumps</p>
<button class="btn ghost" type="button" id="btnBack">Back to garage</button>
<div id="card" class="hide"></div>
<p class="hint hide" id="vsLine"></p>
<div id="arena" style="margin-top:10px"></div>
<div id="out" class="hide"></div>
<label>Rounds</label>
<select id="rounds"><option>3</option><option selected>5</option><option>7</option></select>
<div class="row2">
<button class="btn gold" type="button" id="btnDeal">Twist</button>
<button class="btn ghost" type="button" id="btnRecap">Score</button>
</div>
<div class="invite">
<p class="hint">Friend scans this to join</p>
<img id="qr" alt="QR"/>
<p class="url" id="joinStr"></p>
<button class="btn ghost" type="button" id="btnCopy">Copy invite link</button>
</div>
</div>
<div class="wrap hide" id="raceView">
<p class="hint">Strip</p>
<button class="btn ghost" type="button" id="btnRaceBack">Back to garage</button>
<p class="hint" id="careerLine" style="margin-top:10px">Level 1</p>
<canvas id="strip"></canvas>
<div class="row2" style="margin-top:10px">
<button class="btn gold" type="button" id="btnDrag">Drag</button>
<button class="btn ghost" type="button" id="btnDirt">Off-road</button>
</div>
<div class="row" style="margin-top:8px">
<button class="btn ghost" type="button" id="btnDown">Down</button>
<button class="btn gold" type="button" id="btnShift">Shift</button>
<button class="btn ghost" type="button" id="btnNos">Nitrous</button>
</div>
<label>Body</label>
<select id="bodyPick">
<option value="hatch">Hatch</option>
<option value="hot">Hot hatch</option>
<option value="saloon">Saloon</option>
<option value="estate">Estate</option>
<option value="suv" selected>SUV</option>
<option value="off">Off-roader</option>
<option value="coupe">Coupe</option>
<option value="van">Van</option>
</select>
<label>Colour</label>
<select id="colourPick">
<option value="#c0c6ce">Silver</option>
<option value="#1c1c1c">Black</option>
<option value="#8b1e1e">Red</option>
<option value="#1e3a8a">Blue</option>
<option value="#f3efe6">White</option>
<option value="#2f4f2f">Green</option>
<option value="#c5a44e">Gold</option>
<option value="#6b7280">Grey</option>
<option value="#7c2d12">Bronze</option>
<option value="#0f766e">Teal</option>
</select>
<label>Wheels</label>
<select id="wheelPick">
<option value="five">Five spoke</option>
<option value="mesh">Mesh</option>
<option value="steel">Steelies</option>
<option value="dish">Deep dish</option>
<option value="off">Off-road</option>
<option value="slim">Slim</option>
</select>
<p class="copy">Watch the tacho. Green band = Shift. Early or late costs time. Five gears on a long strip. One nitrous bottle. Off-road: change down on the descents or you launch it.</p>
<div id="raceOut"></div>
</div>
<div class="sheet" id="sheet">
<div class="panel">
<h2 style="margin:0 0 8px">This car</h2>
<label>Name</label><input id="carName"/>
<label>Number plate</label><input id="plate" style="text-transform:uppercase"/>
<div id="plateHits"></div>
<label>Photo or GIF</label><input id="photo" type="file" accept="image/*,image/gif"/>
<label>Car class</label>
<select id="cls"><option value="small">Small</option><option value="family" selected>Family</option><option value="suv">SUV</option><option value="premium">Premium</option></select>
<label>MOT</label><input id="mot" type="date"/>
<label>Tax</label><input id="tax" type="date"/>
<label>Insurance</label><input id="ins" type="date"/>
<label>Oil / service</label><input id="oil" type="date"/>
<label>Last timing belt</label><input id="beltDate" type="date"/>
<label>Belt years</label><input id="beltYears" type="number"/>
<label>Belt miles</label><input id="beltMiles" type="number"/>
<label>Tyres fitted</label><input id="tyreDate" type="date"/>
<label>Tyre life miles</label><input id="tyreLife" type="number"/>
<label>Miles per year</label><input id="miles" type="number"/>
<label>UK MPG</label><input id="mpg" type="number" step="0.1"/>
<label>Tank litres</label><input id="tank" type="number"/>
<label>Top speed mph</label><input id="mph" type="number"/>
<label>Fuel</label>
<select id="fuel"><option value="petrol">Petrol</option><option value="diesel">Diesel</option><option value="hybrid">Hybrid</option><option value="electric">Electric</option></select>
<label>Oil litres</label><input id="oilL" type="number" step="0.1"/>
<label>Pence per litre</label><input id="ppl" type="number"/>
<label>Insurance / year</label><input id="insCost" type="number"/>
<label>Tax / year</label><input id="taxCost" type="number"/>
<label>0-60 / BHP</label>
<div class="row" style="grid-template-columns:1fr 1fr"><input id="s060"/><input id="bhp"/></div>
<label>Torque / boot</label>
<div class="row" style="grid-template-columns:1fr 1fr"><input id="nm"/><input id="boot"/></div>
<label>MOT garage</label><input id="motName"/>
<label>MOT phone</label><input id="motPhone" type="tel"/>
<label>MOT email</label><input id="motEmail" type="email"/>
<label>MOT website</label><input id="motWeb"/>
<label>Insurer website</label><input id="insWeb"/>
<label>Tyre website</label><input id="tyreWeb"/>
<label>Tyre phone</label><input id="tyrePhone" type="tel"/>
<button class="btn gold" type="button" id="btnSave" style="margin-top:12px">Save</button>
<button class="btn ghost" type="button" id="btnClose" style="margin-top:8px">Back</button>
</div>
</div>
<div class="sheet" id="contact">
<div class="panel">
<h2 id="cTitle">Contact</h2>
<p id="cBody" class="hint" style="text-transform:none;letter-spacing:0"></p>
<div id="cLinks"></div>
<button class="btn ghost" type="button" id="btnCClose">Back</button>
</div>
</div>
<script src="app.js?v=20"></script>
<script src="diy.js?v=20"></script>
<script src="jobs.js?v=20"></script>
<script src="lookup.js?v=20"></script>
<script src="swipe.js?v=20"></script>
<script src="game.js?v=20"></script>
<script src="race.js?v=20"></script>
</body>
</html>
