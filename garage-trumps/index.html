<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Garage</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--gold:#e4c48a;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;height:100dvh}
#deck{display:flex;width:200%;height:100%;transform:translateX(-50%);transition:transform .28s ease}
#deck.game{transform:translateX(0)}
.page{width:50%;height:100%;padding:calc(16px + env(safe-area-inset-top)) 16px 22px;overflow:auto}
.hint{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.hero{border-radius:22px;overflow:hidden;border:1px solid rgba(228,196,138,.35);background:#14110c}
.hero img{width:100%;height:180px;object-fit:cover;display:block;background:#1a1712}
.hero .cap{padding:10px 14px 6px}
.hero h1{margin:0;font-size:20px}
.addshot{display:block;text-align:center;padding:60px 16px;color:var(--gold);font-weight:800}
.plate{margin:8px 14px 12px;background:#f7d117;color:#111;font-weight:900;letter-spacing:.12em;text-align:center;border-radius:6px;padding:8px 10px;font-size:22px;border:3px solid #111;font-family:Impact,"Arial Black",sans-serif}
.plate.empty{opacity:.45}
.due,.money{margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#14161b}
.due .r,.money .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.due .r:first-child,.money .r:first-child{border-top:0}
.acts{display:flex;gap:6px;flex-shrink:0}
.acts button,.acts a{border:1px solid var(--line);background:#0f1217;color:var(--gold);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;text-decoration:none}
.soon{color:#e4c48a}.late{color:#e7b1a0}
.btn{width:100%;border:0;border-radius:14px;padding:12px;font-weight:800;margin-top:8px}
.gold{background:var(--gold);color:#111}.ghost{background:#171a20;color:var(--ink);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input,select{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font-size:16px}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);padding:calc(20px + env(safe-area-inset-top)) 14px 20px;overflow:auto;z-index:5}
.sheet.on{display:block}
.panel{background:#14161b;border-radius:18px;padding:14px;max-width:440px;margin:0 auto}
.qr{width:120px;height:120px;background:#fff;border-radius:12px;float:right;margin:0 0 8px 8px}
.win{background:#2a2418;border:1px solid rgba(228,196,138,.35);border-radius:16px;padding:12px;margin-top:10px;clear:both}
.grid{display:grid;grid-template-columns:1fr 1fr}
.stat{padding:10px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.stat:nth-child(2n){border-right:0}
.stat span{display:block;color:var(--dim);font-size:10px;text-transform:uppercase}
.stat b{font-size:18px}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#3a3f48}
.dots i.on{background:var(--gold)}
.linkout{display:block;margin-top:8px;text-align:center;color:var(--gold);font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div id="deck">
<section class="page">
<div class="hint">Swipe left back to garage</div>
<img class="qr" id="qr" alt="QR"/>
<div class="hero" id="card"></div>
<p class="hint" id="joinStr" style="text-transform:none;letter-spacing:0;font-size:11px;clear:both;word-break:break-all"></p>
<label>Rounds</label>
<select id="rounds"><option>3</option><option selected>5</option><option>7</option></select>
<button class="btn gold" id="deal">Deal next</button>
<button class="btn ghost" id="recap">Who won</button>
<div id="out"></div>
</section>
<section class="page">
<div class="hint" id="navHint">Swipe right for Trumps</div>
<div class="hero" id="hero"></div>
<div class="dots" id="dots"></div>
<div class="due" id="dues"></div>
<div class="money" id="money"></div>
<div class="row3">
<button class="btn ghost" id="addCar">+ Car</button>
<button class="btn ghost" id="openSet">Edit</button>
<button class="btn gold" id="toGame">Trumps</button>
</div>
<button class="btn ghost" id="delCar" style="display:none">Remove this car</button>
</section>
</div>
<div class="sheet" id="sheet">
<div class="panel">
<h2 style="margin:0 0 8px">This car</h2>
<label>Name</label><input id="carName" placeholder="Your car details here"/>
<label>Number plate</label><input id="plate" placeholder="AB12 CDE" style="text-transform:uppercase"/>
<label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"/>
<label>MOT</label><input id="mot" type="date"/>
<label>Tax</label><input id="tax" type="date"/>
<label>Insurance</label><input id="ins" type="date"/>
<label>Oil / service</label><input id="oil" type="date"/>
<label>Tyres fitted</label><input id="tyreDate" type="date"/>
<label>Tyre life miles</label><input id="tyreLife" type="number" placeholder="20000"/>
<label>Miles per year</label><input id="miles" type="number" placeholder="12000"/>
<label>UK MPG</label><input id="mpg" type="number" step="0.1" placeholder="38"/>
<label>Tank litres</label><input id="tank" type="number" placeholder="70"/>
<label>Top speed mph</label><input id="mph" type="number" placeholder="130"/>
<label>Fuel</label>
<select id="fuel"><option value="petrol">Petrol</option><option value="diesel">Diesel</option></select>
<label>Pence per litre</label><input id="ppl" type="number" step="0.1"/>
<label>Insurance pounds / year</label><input id="insCost" type="number"/>
<label>Tax pounds / year</label><input id="taxCost" type="number"/>
<label>0-60 / BHP</label>
<div class="row2"><input id="s060" placeholder="0-60"/><input id="bhp" placeholder="BHP"/></div>
<label>Torque / boot</label>
<div class="row2"><input id="nm" placeholder="Nm"/><input id="boot" placeholder="Boot L"/></div>
<p class="hint" style="text-transform:none;letter-spacing:0;margin-top:12px">Contacts stay off the home page.</p>
<label>MOT garage name</label><input id="motName"/>
<label>MOT phone</label><input id="motPhone" type="tel"/>
<label>MOT email</label><input id="motEmail" type="email"/>
<label>MOT website</label><input id="motWeb" placeholder="https://"/>
<label>Insurer website</label><input id="insWeb" placeholder="https://"/>
<label>Tyre supplier website</label><input id="tyreWeb" placeholder="https://www.blackcircles.com"/>
<label>Tyre supplier phone</label><input id="tyrePhone" type="tel"/>
<button class="btn gold" id="save">Save</button>
<button class="btn ghost" id="close">Back</button>
</div>
</div>
<div class="sheet" id="contact">
<div class="panel">
<h2 id="cTitle" style="margin:0 0 8px">Contact</h2>
<p id="cBody" class="hint" style="text-transform:none;letter-spacing:0"></p>
<div id="cLinks"></div>
<button class="btn ghost" id="cClose">Back</button>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
