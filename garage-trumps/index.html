<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0b0c0f"/>
<title>Garage</title>
<style>
:root{--bg:#0b0c0f;--ink:#f3efe6;--dim:#9aa3b0;--gold:#e4c48a;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;height:100dvh}
#deck{display:flex;width:200%;height:100%;transition:transform .28s ease}
#deck.game{transform:translateX(-50%)}
.page{width:50%;height:100%;padding:calc(16px + env(safe-area-inset-top)) 16px 20px;overflow:auto}
.hint{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.hero{border-radius:22px;overflow:hidden;border:1px solid rgba(228,196,138,.35);background:#14110c}
.hero img{width:100%;height:190px;object-fit:cover;display:block;background:#1a1712}
.hero .cap{padding:12px 14px 10px}
.hero h1{margin:0;font-size:20px;letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:1fr 1fr}
.stat{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.stat:nth-child(2n){border-right:0}
.stat span{display:block;color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.stat b{font-size:18px}
.due{margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#14161b}
.due .r{display:flex;justify-content:space-between;padding:11px 12px;border-top:1px solid var(--line);font-size:14px}
.due .r:first-child{border-top:0}
.soon{color:#e4c48a}.late{color:#e7b1a0}
.btn{width:100%;border:0;border-radius:14px;padding:12px;font-weight:800;margin-top:8px}
.gold{background:var(--gold);color:#111}.ghost{background:#171a20;color:var(--ink);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{width:100%;background:#171a20;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font-size:16px}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);padding:calc(20px + env(safe-area-inset-top)) 14px 20px;overflow:auto;z-index:5}
.sheet.on{display:block}
.panel{background:#14161b;border-radius:18px;padding:14px;max-width:440px;margin:0 auto}
.qr{width:120px;height:120px;background:#fff;border-radius:12px;float:right;margin:0 0 8px 8px}
.win{background:#2a2418;border:1px solid rgba(228,196,138,.35);border-radius:16px;padding:12px;margin-top:10px;clear:both}
</style>
</head>
<body>
<div id="deck">
<section class="page" id="widget">
<div class="hint">Swipe left for Garage Trumps</div>
<div class="hero" id="hero"></div>
<div class="due" id="dues"></div>
<div class="row2">
<button class="btn ghost" id="openSet">Settings</button>
<button class="btn gold" id="toGame">Trumps</button>
</div>
</section>
<section class="page" id="game">
<div class="hint">Swipe right for garage</div>
<img class="qr" id="qr" alt="Join QR"/>
<div class="hero" id="card"></div>
<p class="hint" id="joinStr" style="text-transform:none;letter-spacing:0;font-size:11px;clear:both;word-break:break-all"></p>
<label>Rounds</label>
<select id="rounds"><option>3</option><option selected>5</option><option>7</option></select>
<button class="btn gold" id="deal">Deal next</button>
<button class="btn ghost" id="recap">Who won</button>
<div id="out"></div>
</section>
</div>
<div class="sheet" id="sheet">
<div class="panel">
<h2 style="margin:0 0 8px">Settings</h2>
<label>Car name</label><input id="carName" placeholder="Your car details here"/>
<label>0-60 seconds</label><input id="s060" placeholder="8.3"/>
<label>BHP</label><input id="bhp" placeholder="215"/>
<label>Torque Nm</label><input id="nm" placeholder="440"/>
<label>Boot litres</label><input id="boot" placeholder="495"/>
<label>Photo</label><input id="photo" type="file" accept="image/*"/>
<label>MOT</label><input id="mot" type="date"/>
<label>Tax</label><input id="tax" type="date"/>
<label>Insurance</label><input id="ins" type="date"/>
<label>Oil / service</label><input id="oil" type="date"/>
<label>Remind days before</label><select id="lead"><option>7</option><option selected>14</option><option>30</option></select>
<label>Insurance pounds / year</label><input id="insCost" type="number"/>
<label>Tax pounds / year</label><input id="taxCost" type="number"/>
<label>Garage phone</label><input id="gPhone" type="tel"/>
<label>Garage email</label><input id="gEmail" type="email"/>
<button class="btn gold" id="save">Save</button>
<button class="btn ghost" id="cal">Add to Calendar</button>
<a class="btn ghost" id="callG" href="#" style="display:block;text-align:center;text-decoration:none;margin-top:8px">Call garage</a>
<button class="btn ghost" id="close">Back to widget</button>
</div>
</div>
<script>
var LIB=[{name:"Your car details here",nick:"Your car details here",year:"",s060:"\u2014",bhp:"\u2014",nm:"\u2014",boot:"\u2014",awd:0,clear:1}];
function $(id){return document.getElementById(id)}
function load(){try{return JSON.parse(localStorage.getItem("gt.me")||"null")}catch(e){return null}}
function dates(){try{return JSON.parse(localStorage.getItem("gt.dates")||"{}")}catch(e){return {}}}
function saveCar(c){localStorage.setItem("gt.me",JSON.stringify(c))}
function saveDates(d){localStorage.setItem("gt.dates",JSON.stringify(d))}
function code(){var c=localStorage.getItem("gt.code");if(!c){c="GT-"+Math.random().toString(36).slice(2,6).toUpperCase();localStorage.setItem("gt.code",c)}return c}
function days(iso){if(!iso)return null;return Math.round((new Date(iso+"T12:00:00")-new Date())/86400000)}
function label(n){if(n==null)return "Set date";if(n<0)return Math.abs(n)+" days overdue";if(n===0)return "Due today";return n+" days"}
function tone(n){if(n==null)return "";if(n<0)return "late";if(n<=+(dates().lead||14))return "soon";return ""}
function paint(){
  var c=load()||LIB[0], d=dates();
  var img=c.photo?c.photo:"";
  var block='<div class="hero"><img src="'+img+'" alt=""/><div class="cap"><h1>'+(c.nick||c.name)+'</h1><div class="dim">'+(c.year||"")+'</div></div><div class="grid">'+[["0-60",(c.s060||"\u2014")+"s"],["BHP",c.bhp||"\u2014"],["Torque",(c.nm||"\u2014")+" Nm"],["Boot",(c.boot||"\u2014")+" L"]].map(function(s){return '<div class="stat"><span>'+s[0]+'</span><b>'+s[1]+'</b></div>'}).join('')+'</div></div>';
  $("hero").innerHTML=block; $("card").innerHTML=block;
  $("dues").innerHTML=[["MOT",d.mot],["Tax",d.tax],["Insurance",d.ins],["Oil / service",d.oil]].map(function(r){var n=days(r[1]);return '<div class="r"><span>'+r[0]+'</span><b class="'+tone(n)+'">'+label(n)+'</b></div>'}).join('');
  var payload=["GTJOIN",code(),c.nick||c.name,c.s060||"",c.bhp||"",c.nm||"",c.boot||"",c.awd||0].join("|");
  var url=location.origin+location.pathname.replace(/index.html$/,"")+"?join="+encodeURIComponent(payload);
  $("joinStr").textContent=url;
  $("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+encodeURIComponent(url);
  $("mot").value=d.mot||""; $("tax").value=d.tax||""; $("ins").value=d.ins||""; $("oil").value=d.oil||"";
  $("lead").value=String(d.lead||14); $("insCost").value=d.insCost||""; $("taxCost").value=d.taxCost||"";
  $("gPhone").value=d.gPhone||""; $("gEmail").value=d.gEmail||"";
  $("callG").href=d.gPhone?("tel:"+d.gPhone.replace(/\\s/g,"")):"#";
  $("carName").value=c.nick||c.name||"";
  $("s060").value=c.s060&&c.s060!=="\u2014"?c.s060:""; $("bhp").value=c.bhp&&c.bhp!=="\u2014"?c.bhp:"";
  $("nm").value=c.nm&&c.nm!=="\u2014"?c.nm:""; $("boot").value=c.boot&&c.boot!=="\u2014"?c.boot:"";
}
$("openSet").onclick=function(){$("sheet").className="sheet on"};
$("close").onclick=function(){$("sheet").className="sheet"};
$("toGame").onclick=function(){$("deck").className="game"};
var x0=0;
document.getElementById("deck").addEventListener("touchstart",function(e){x0=e.changedTouches[0].clientX});
document.getElementById("deck").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-x0; if(dx<-40)$("deck").className="game"; if(dx>40)$("deck").className="";});
$("save").onclick=function(){
  var c=load()||Object.assign({},LIB[0]);
  c.nick=$("carName").value||"Your car details here"; c.name=c.nick;
  c.s060=$("s060").value||"\u2014"; c.bhp=$("bhp").value||"\u2014"; c.nm=$("nm").value||"\u2014"; c.boot=$("boot").value||"\u2014";
  saveDates({mot:$("mot").value,tax:$("tax").value,ins:$("ins").value,oil:$("oil").value,lead:+$("lead").value,insCost:$("insCost").value,taxCost:$("taxCost").value,gPhone:$("gPhone").value,gEmail:$("gEmail").value});
  saveCar(c); paint(); $("sheet").className="sheet";
};
$("photo").onchange=function(){var f=this.files&&this.files[0]; if(!f)return; var r=new FileReader(); r.onload=function(){var c=load()||Object.assign({},LIB[0]); c.photo=r.result; saveCar(c); paint();}; r.readAsDataURL(f);};
$("cal").onclick=function(){
  var d=dates(), lead=+(d.lead||14), ev=[];
  [["MOT",d.mot],["Tax",d.tax],["Insurance",d.ins],["Oil",d.oil]].forEach(function(x){if(!x[1])return; var s=new Date(x[1]+"T12:00:00"); s.setDate(s.getDate()-lead); ev.push("BEGIN:VEVENT\nSUMMARY:"+x[0]+" reminder\nDTSTART;VALUE=DATE:"+s.toISOString().slice(0,10).replace(/-/g,"")+"\nEND:VEVENT");});
  var a=document.createElement("a"); a.href="data:text/calendar,"+encodeURIComponent("BEGIN:VCALENDAR\nVERSION:2.0\n"+ev.join("\n")+"\nEND:VCALENDAR"); a.download="garage.ics"; a.click();
};
var JOBS=[{t:"Flash flood. Eight miles to high ground.",fn:function(c){return (c.clear||1)*6+(c.awd||0)*5},w:"Height wins.",l:"Street furniture."},{t:"Ikea run.",fn:function(c){return (c.boot||300)/15},w:"Swallows the Billy.",l:"Allen key only."},{t:"Last orders, 1.2 miles.",fn:function(c){return (12-(parseFloat(c.s060)||10))*3+(parseFloat(c.bhp)||120)/80},w:"First to the door.",l:"Arrives as a rumour."},{t:"Wet dog, four mates.",fn:function(c){return (parseFloat(c.boot)||300)/20+5},w:"Dog in the boot.",l:"Dog on a lap."},{t:"Black ice hill.",fn:function(c){return (c.awd||0)*6+(c.clear||1)*2},w:"Four driven wheels.",l:"A graceful slide."},{t:"Tip run.",fn:function(c){return (parseFloat(c.boot)||300)/12},w:"One trip.",l:"Two trips."},{t:"School run.",fn:function(c){return 5},w:"Gets there.",l:"Also gets there."}];
var st={i:0,order:[],scores:{},log:[]};
function rival(){try{var r=JSON.parse(localStorage.getItem("gt.rival")||"null"); if(r) return r;}catch(e){} return {name:"Friend's car details here",s060:"\u2014",bhp:"\u2014",nm:"\u2014",boot:"\u2014",awd:0,clear:1};}
$("deal").onclick=function(){
  var me=load()||LIB[0], them=rival();
  if(!st.order.length){var n=+$("rounds").value, idx=JOBS.map(function(_,i){return i}).sort(function(){return Math.random()-.5}); st={i:0,order:idx.slice(0,n),scores:{},log:[]};}
  if(st.i>=st.order.length){$("recap").click();return}
  var job=JOBS[st.order[st.i++]];
  var a={c:me,s:job.fn(me)}, b={c:them,s:job.fn(them)};
  var ranked=[a,b].sort(function(x,y){return y.s-x.s});
  var kn=function(c){return c.nick||c.name};
  st.scores[kn(ranked[0].c)]=(st.scores[kn(ranked[0].c)]||0)+3;
  st.scores[kn(ranked[1].c)]=(st.scores[kn(ranked[1].c)]||0)+1;
  st.log.push({t:job.t,win:kn(ranked[0].c)});
  $("out").innerHTML='<div class="win"><div class="dim">'+st.log.length+' / '+st.order.length+'</div><h3 style="margin:6px 0">'+job.t+'</h3><b>'+kn(ranked[0].c)+' \u2014 '+job.w+'</b><p>'+kn(ranked[1].c)+' \u2014 '+job.l+'</p></div>';
};
$("recap").onclick=function(){
  var board=Object.keys(st.scores).map(function(k){return {k:k,s:st.scores[k]}}).sort(function(a,b){return b.s-a.s});
  $("out").innerHTML='<div class="win"><h3>'+(board[0]?board[0].k:"?")+' takes the table</h3>'+board.map(function(b){return '<div>'+b.k+' \u2014 '+b.s+' pts</div>'}).join('')+'<p>'+st.log.map(function(r,i){return (i+1)+'. '+r.t+' \u2192 '+r.win}).join('<br>')+'</p></div>';
  st={i:0,order:[],scores:{},log:[]};
};
function takeJoin(){
  var q=new URLSearchParams(location.search).get("join"); if(!q) return;
  var p=decodeURIComponent(q).split("|"); if(p[0]!=="GTJOIN") return;
  localStorage.setItem("gt.rival", JSON.stringify({name:p[2]||"Friend's car",nick:p[2],s060:p[3],bhp:p[4],nm:p[5],boot:p[6],awd:+p[7]||0,clear:1}));
  if(p[1]) localStorage.setItem("gt.code", p[1]);
  $("deck").className="game";
}
takeJoin(); paint();
</script>
</body>
</html>
