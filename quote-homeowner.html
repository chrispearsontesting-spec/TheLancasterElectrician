<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeowner EICR Quote | The Lancaster Electrician</title>
    <meta name="description" content="Request a homeowner EICR quote in Lancaster. Tell Chris the size, age and access, and get a price for Standard and Gold.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; color: #1e2937; }
        .top { background: #0b1220; color: #94a3b8; padding: 14px 22px; display: flex; justify-content: space-between; }
        .top a { color: #bfdbfe; text-decoration: none; font-weight: 600; }
        .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 56px; display: grid; grid-template-columns: 280px 1fr; gap: 22px; }
        .side { color: #cbd5e1; }
        .side h1 { color: white; font-size: 32px; letter-spacing: -0.03em; line-height: 1.15; }
        .side p { margin-top: 12px; line-height: 1.55; font-size: 15px; }
        .card { background: white; border-radius: 22px; padding: 26px 24px 30px; }
        label { display: block; margin: 14px 0 6px; font-weight: 650; color: #1e3a8a; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px 13px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 16px; font-family: inherit; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .submit, .wa { width: 100%; margin-top: 14px; padding: 15px; border: 0; border-radius: 12px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; }
        .submit { background: #059669; }
        .wa { background: #16a34a; }
        @media (max-width: 800px) { .wrap, .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="top"><a href="quote.html">Back to quote choice</a><a href="index.html">Home</a></div>
<div class="wrap">
    <aside class="side">
        <h1>Homeowner quote</h1>
        <p>For the home you live in, or a house or flat you are buying or selling. A few details are enough to price Standard and Gold.</p>
    </aside>
    <div class="card">
        <form id="qform" action="https://formsubmit.co/Chris.pearson.testing@gmail.com" method="POST">
            <input type="hidden" name="customer_type" value="Homeowner">
            <input type="hidden" name="_subject" value="HOMEOWNER EICR quote — The Lancaster Electrician">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_next" value="https://thelancasterelectrician.com/thankyou.html">
            <input type="hidden" name="_captcha" value="false">
            <div class="row">
                <div><label>Your name</label><input type="text" name="name" id="name" required></div>
                <div><label>Phone</label><input type="tel" name="phone" id="phone" required></div>
            </div>
            <label>Email (optional)</label>
            <input type="email" name="email" id="email">
            <label>Address</label>
            <input type="text" name="address" id="address" placeholder="House number and street" required>
            <div class="row">
                <div><label>Postcode</label><input type="text" name="postcode" id="postcode" required></div>
                <div>
                    <label>Why do you need the EICR?</label>
                    <select name="reason" id="reason" required>
                        <option value="">Select...</option>
                        <option value="Peace of mind">Peace of mind</option>
                        <option value="Selling the property">Selling the property</option>
                        <option value="Buying the property">Buying the property</option>
                        <option value="Insurance">Insurance asked for it</option>
                        <option value="Known electrical issue">Known electrical issue</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div>
                    <label>Property size</label>
                    <select name="property_size" id="size" required>
                        <option value="">Select...</option>
                        <option value="1-2 bed">1–2 bedroom</option>
                        <option value="3 bed">3 bedroom</option>
                        <option value="4+ bed">4+ bedroom / large house</option>
                    </select>
                </div>
                <div>
                    <label>Approximate age</label>
                    <select name="property_age" id="age" required>
                        <option value="">Select...</option>
                        <option value="Pre-1960">Pre-1960</option>
                        <option value="1960-1990">1960–1990</option>
                        <option value="1990-2010">1990–2010</option>
                        <option value="2010+">2010 or newer</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div><label>Consumer units</label><input type="number" name="fuse_boxes" id="boards" min="1" placeholder="Usually 1" required></div>
                <div><label>Last electrical test</label><input type="text" name="last_test" id="last" placeholder="Never / 2018 / not sure"></div>
            </div>
            <label>Garage, annex or separate supply?</label>
            <input type="text" name="outbuildings" id="out" placeholder="No / yes — garage board">
            <label>When can the property be accessed?</label>
            <input type="text" name="availability" id="when" placeholder="Weekday evenings, next two weeks" required>
            <label>Gold — QR on the board and a digital record?</label>
            <select name="gold_interest" id="gold">
                <option value="Tell me both prices">Tell me both prices</option>
                <option value="Yes — Gold">Yes — Gold</option>
                <option value="Standard only">Standard only</option>
            </select>
            <label>Anything else</label>
            <textarea name="extra_info" id="extra" rows="3" placeholder="Trips, old board, rewire, sale date"></textarea>
            <button type="submit" class="submit">Email this quote request</button>
            <button type="button" class="wa" id="wa">Send the same details on WhatsApp</button>
        </form>
    </div>
</div>
<script>
function details() {
    const g = id => (document.getElementById(id).value || '').trim();
    return ['HOMEOWNER EICR quote request','Name: '+g('name'),'Phone: '+g('phone'),'Email: '+g('email'),'Address: '+g('address')+' '+g('postcode'),'Reason: '+g('reason'),'Size: '+g('size')+' | Age: '+g('age'),'Boards: '+g('boards')+' | Last test: '+g('last'),'Outbuildings: '+g('out'),'Access: '+g('when'),'Gold: '+g('gold'),'Notes: '+g('extra')].join('\n');
}
document.getElementById('wa').onclick = function() {
    const f = document.getElementById('qform');
    if (!f.reportValidity()) return;
    window.location.href = 'https://wa.me/447587590435?text=' + encodeURIComponent('Hi Chris, I would like a homeowner EICR quote.\n\n' + details());
};
</script>
</body>
</html>
