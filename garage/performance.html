<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<script src="./app-lock.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0e"/>
<title>Performance</title>
<link rel="stylesheet" href="./tool-bar.css?v=1"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0c0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100%;overflow:hidden}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.overlay{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
.hud{background:rgba(0,0,0,.45);border-radius:14px;padding:8px 12px;text-align:center;min-width:70px;backdrop-filter:blur(4px)}
.hud b{font-size:16px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.hud span{font-size:10px;color:#ccc;text-transform:uppercase}
#gDot{flex:0 0 auto;width:88px;height:88px;min-width:88px;aspect-ratio:1/1;border-radius:50%;background:rgba(20,20,22,.55);border:1px solid rgba(255,255,255,.25);position:relative}
#gDot i{position:absolute;width:14px;height:14px;border-radius:50%;background:#73BDE0;left:50%;top:50%;transform:translate(-50%,-50%)}
.top{position:fixed;top:calc(62px + env(safe-area-inset-top));left:0;right:0;padding:0 12px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:6}
select,button,.btn{background:#1c1c1e;color:#f2f2f2;border:1px solid rgba(255,255,255,.08);border-radius:18px;min-height:40px;padding:10px 14px;font-weight:600;font-size:14px}
.disclaimer{position:fixed;left:12px;right:12px;top:calc(112px + env(safe-area-inset-top));background:rgba(28,22,8,.92);border:1px solid #5c4a1f;color:#f2f2f2;padding:10px 12px;border-radius:14px;z-index:10;font-size:13px;line-height:1.4;display:flex;gap:10px;align-items:center}
.disclaimer span{flex:1}
.disclaimer button{background:#f5b84a;color:#111;border:0;white-space:nowrap}
.disclaimer.flash{animation:fl .5s 2}
@keyframes fl{50%{background:#7a4b00}}
#bigStart{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:7;background:#1a7f3a;color:#fff;border:0;border-radius:20px;padding:18px 28px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#bigStart.hide{display:none}
.light{width:42px;height:42px;border-radius:50%;background:#333;border:2px solid #555;box-shadow:inset 0 0 8px #000}
.light.on{background:#e10600;box-shadow:0 0 12px #e10600}
#cancel{display:none}
.chart-wrap{position:fixed;inset:0;background:#0b0c0e;z-index:12;display:none;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:calc(72px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;max-width:520px;margin:0 auto}
.chart-wrap .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chart-wrap .row button{flex:1 1 45%}
#runVid{width:100%;border-radius:14px;background:#000;max-height:46vh;margin:6px 0}
.gpk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(118px + env(safe-area-inset-bottom));z-index:5;background:rgba(0,0,0,.5);border-radius:12px;padding:6px 10px;font-size:12px;color:#ddd;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.hud{flex:0 1 auto;min-width:0}
@media (max-width:480px){.overlay{gap:8px;padding-left:8px;padding-right:8px}.hud{padding:8px 8px;min-width:58px}}
.hud small{display:block;font-size:10px;color:#aaa;font-variant-numeric:tabular-nums}
.runItem{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin:6px 0;border-radius:14px}
.runItem small{color:#9a9aa0;font-weight:500}
.chart-wrap.show{display:flex}
canvas#chart{width:100%;height:auto;background:#0b0c0e;border-radius:12px;display:block}
</style>
</head>
<body>
<video id="vid" playsinline muted autoplay></video>
<header class="appbar"><a class="back" href="home.html#drive">Back</a><h1>Performance</h1></header>
<div class="top">
  <select id="run">
    <option value="60">0–60 mph</option>
    <option value="100">0–100 mph</option>
    <option value="quarter">Quarter mile</option>
    <option value="half">Half mile</option>
    <option value="100-200">100–200 km/h</option>
    <option value="track">Track mode</option>
  </select>
  <button id="cancel" type="button">Cancel run</button>
  <label style="font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="keep"/> Keep video</label>
  <button id="runsBtn" type="button">Saved runs</button>
</div>
<div id="lights" style="display:none;position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:8;gap:28px">
  <span class="light"></span><span class="light"></span><span class="light"></span>
</div>
<div id="go" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;font-size:48px;font-weight:800;color:#fff;text-shadow:0 2px 8px #000">🏁 GO</div>
<div id="react" style="position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:8;font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000;display:none"></div>
<div id="listening" style="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);font-size:13px;color:#73BDE0;display:none">Listening for “start run”</div>
<button id="bigStart" type="button">🏁 Start run</button>
<div class="gpk" id="gPeak">Peak accel 0.00 · brake 0.00 · corner 0.00 G</div>
<div class="overlay">
  <div class="hud"><b id="time">0.0</b><span>Time</span></div>
  <div id="gDot"><i id="dot"></i></div>
  <div class="hud"><b id="gNow">0.00</b><span>G</span><small id="gDet">Lat 0.00 · Long 0.00</small></div>
  <div class="hud"><b id="spd">0</b><span>mph</span></div>
</div>
<div class="disclaimer" id="disc" role="note"><span><b>Closed roads or tracks only.</b> Phone estimate, not for public roads. Tap “I understand” before your first run.</span><button id="ok" type="button">I understand</button></div>
<div class="chart-wrap" id="chartWrap">
  <h2 id="result" style="margin:0 0 8px">Run complete</h2>
  <div id="runView">
  <video id="runVid" controls playsinline style="display:none"></video>
  <canvas id="chart" width="720" height="1110" aria-label="G-force chart for this run"></canvas>
  <p id="saved" style="font-size:13px;color:#aaa;margin:8px 0"></p>
  <div class="row"><button id="dlChart" type="button">Share G chart</button><button id="dlVid" type="button" style="display:none">Save video</button></div>
  </div>
  <div id="runList" style="display:none"></div>
  <div class="row"><button id="runsBtn2" type="button">Saved runs</button><button id="again" type="button">New run</button></div>
</div>
<script src="./car-scope.js?v=1"></script>
<script src="./perf-g.js?v=2"></script>
<script>
const vid = document.getElementById('vid');
const timeEl = document.getElementById('time');
const spdEl = document.getElementById('spd');
const dot = document.getElementById('dot');
const runSel = document.getElementById('run');
const keepChk = document.getElementById('keep');
const chartWrap = document.getElementById('chartWrap');
const resultEl = document.getElementById('result');
const savedEl = document.getElementById('saved');
let stream, recorder, chunks = [], running = false, startTs = 0, speed = 0, lon = 0, samples = [], watchId = null, lastFrame = null, motionStart = false, goTs = 0, reactMs = 0;

let acked = false;
document.getElementById('ok').onclick = () => { acked = true; document.getElementById('disc').style.display = 'none'; };
function needAck(){ if(acked) return false; const d=document.getElementById('disc'); d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash'); return true; }
document.getElementById('again').onclick = () => { chartWrap.classList.remove('show'); location.replace('performance.html'); };

async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1280}}, audio:false});
    vid.srcObject = stream;
  }catch(e){ alert('Camera needed'); }
}
startCam();

const gNowEl=document.getElementById('gNow'), gDetEl=document.getElementById('gDet'), gPeakEl=document.getElementById('gPeak');
let lat=0;
function onMotion(e){
  const r = PerfG.read(e);
  if(!r) return;
  lon = r.lon; lat = r.lat;
  if(dot){
    dot.style.transform = `translate(calc(-50% + ${lat*22}px), calc(-50% - ${lon*22}px))`;
  }
  gNowEl.textContent = r.comb.toFixed(2);
  gDetEl.textContent = 'Lat ' + lat.toFixed(2) + ' · Long ' + lon.toFixed(2);
  const pk = PerfG.peaks();
  gPeakEl.textContent = 'Peak accel ' + pk.acc.toFixed(2) + ' · brake ' + pk.brk.toFixed(2) + ' · corner ' + pk.lat.toFixed(2) + ' G';
  if(running && !startTs && (Math.abs(lon) > 0.25 || motionStart)){
    startTs = performance.now();
    if(goTs && !reactMs){
      reactMs = Math.round(startTs - goTs);
      const r = document.getElementById('react');
      if(r){ r.textContent = 'Reaction ' + reactMs + ' ms'; r.style.display = 'block'; setTimeout(()=>r.style.display='none', 2500); }
    }
  }
  if(running && startTs){
    const t = (performance.now()-startTs)/1000;
    timeEl.textContent = t.toFixed(1);
    samples.push({t:+t.toFixed(3), speed:+speed.toFixed(1), lon:+lon.toFixed(3), lat:+lat.toFixed(3)});
    checkFinish(t);
  }
}

let motionOn = false;
async function enableMotion(){
  if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
    try{ await DeviceMotionEvent.requestPermission(); }catch(e){}
  }
  if(!motionOn){ motionOn = true; window.addEventListener('devicemotion', onMotion); }
}
// Android and desktop need no permission, so start the live G read-out straight away (it also calibrates while still).
if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') enableMotion();

function checkVisual(){
  if(!running || startTs || !vid.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = 64; c.height = 36;
  const ctx = c.getContext('2d');
  ctx.drawImage(vid, 0, 0, 64, 36);
  const data = ctx.getImageData(0,0,64,36).data;
  if(lastFrame){
    let diff = 0;
    for(let i=0;i<data.length;i+=16) diff += Math.abs(data[i]-lastFrame[i]);
    if(diff > 7000) motionStart = true;
  }
  lastFrame = data;
}
setInterval(checkVisual, 120);

function checkFinish(t){
  const mode = runSel.value;
  let done = false, label = '';
  if(mode==='60' && speed>=60){ done=true; label='0–60'; }
  else if(mode==='100' && speed>=100){ done=true; label='0–100'; }
  else if(mode==='quarter' && t>8){ done=true; label='Quarter'; }
  else if(mode==='half' && t>15){ done=true; label='Half'; }
  else if(mode==='100-200' && speed>=124){ done=true; label='100–200'; }
  if(done) finish(t, label);
}

let stopP = null;
async function finish(t, label){
  running = false;
  const hadRec = recorder && recorder.state==='recording';
  if(hadRec) recorder.stop();
  if(watchId) navigator.geolocation.clearWatch(watchId);
  const runLabel = runSel.options[runSel.selectedIndex].text;
  resultEl.textContent = label + '  ' + t.toFixed(2) + 's' + (reactMs ? '  ·  reaction ' + reactMs + ' ms' : '');
  // Save to shared diary
  try{
    const list = JSON.parse(localStorage.getItem("gt.driveLog")||"[]");
    list.unshift({ id: "run-"+Date.now(), type: "run", plate: (window.D3Car&&D3Car.curVrn())||"", when: Date.now(), from: runLabel, to: t.toFixed(2)+"s", time: t.toFixed(2)+"s", miles: 0, cost: 0, mpg: null });
    localStorage.setItem("gt.driveLog", JSON.stringify(list.slice(0,500)));
  }catch(e){}
  let video = null;
  if(hadRec && stopP){ try{ await stopP; }catch(e){} }
  if(keepChk.checked && chunks.length) video = new Blob(chunks, {type: (chunks[0]&&chunks[0].type) || 'video/webm'});
  chunks = [];
  const run = { id: 'run-' + Date.now(), when: Date.now(), plate: (window.D3Car&&D3Car.curVrn())||'', label: runLabel, result: resultEl.textContent, time: t.toFixed(2), reactMs, samples: samples.slice(), stats: PerfG.stats(samples), video };
  const cv = document.getElementById('chart');
  PerfG.draw(cv, run);
  run.chart = await new Promise(r => cv.toBlob(r, 'image/png'));
  let ok = true;
  try{ await PerfG.save(run); }catch(e){ ok = false; }
  showRun(run, ok ? (video ? 'Saved on this phone with its video and G chart.' : 'Saved on this phone with its G chart. Video discarded (Keep video was off).') : 'Could not save on this phone (storage full?). You can still share the chart.');
}

let shown = null;
function blobUrl(b){ return b ? URL.createObjectURL(b) : ''; }
function showRun(run, note){
  shown = run;
  chartWrap.classList.add('show');
  document.getElementById('runList').style.display = 'none';
  document.getElementById('runView').style.display = 'block';
  resultEl.textContent = run.result || (run.label + '  ' + run.time + 's');
  const v = document.getElementById('runVid');
  if(run.video){ v.src = blobUrl(run.video); v.style.display = 'block'; } else { v.removeAttribute('src'); v.style.display = 'none'; }
  document.getElementById('dlVid').style.display = run.video ? 'block' : 'none';
  PerfG.draw(document.getElementById('chart'), run);
  savedEl.textContent = note || ('Saved ' + new Date(run.when).toLocaleString('en-GB'));
}
async function shareBlob(blob, name, title){
  const f = new File([blob], name, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f], title}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById('dlChart').onclick = async () => {
  if(!shown) return;
  const b = shown.chart || await new Promise(r => document.getElementById('chart').toBlob(r, 'image/png'));
  shareBlob(b, 'driv3-run-g-chart.png', 'Driv3 run G chart');
};
document.getElementById('dlVid').onclick = () => { if(shown && shown.video) shareBlob(shown.video, 'driv3-run.' + (/mp4/.test(shown.video.type) ? 'mp4' : 'webm'), 'Driv3 run video'); };
async function showList(){
  chartWrap.classList.add('show');
  resultEl.textContent = 'Saved runs';
  document.getElementById('runView').style.display = 'none';
  const box = document.getElementById('runList'); box.style.display = 'block'; box.textContent = 'Loading…';
  let runs = []; try{ runs = (await PerfG.list()).filter(r => !window.D3Car || D3Car.owns(r.plate)); }catch(e){}
  box.innerHTML = runs.length ? '' : '<p style="color:#9a9aa0">No saved runs yet.</p>';
  runs.forEach(r => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'runItem';
    const st = r.stats || {};
    b.innerHTML = '<span>' + (r.label||'Run') + ' · ' + r.time + 's<br><small>' + new Date(r.when).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) + (r.video ? ' · video' : '') + '</small></span><small>' + ((st.maxComb||0).toFixed(2)) + ' G</small>';
    b.onclick = () => showRun(r);
    box.appendChild(b);
  });
}
document.getElementById('runsBtn').onclick = showList;
document.getElementById('runsBtn2').onclick = showList;
(function(){ const q = new URLSearchParams(location.search); const id = q.get('run');
  if(id) PerfG.get(id).then(r => r ? showRun(r) : showList()).catch(showList); else if(q.has('runs') || location.hash === '#runs') showList(); })();

document.getElementById('cancel').onclick = () => {
  running = false;
  if(recorder && recorder.state==='recording') recorder.stop();
  if(watchId) navigator.geolocation.clearWatch(watchId);
  document.getElementById('bigStart').classList.remove('hide');
  document.getElementById('cancel').style.display = 'none';
  timeEl.textContent = '0.0';
};

async function beginRun(){
  if(needAck()) return;
  document.getElementById('bigStart').classList.add('hide');
  document.getElementById('cancel').style.display = 'inline-block';
  const lights = document.querySelectorAll('.light');
  const lightsBox = document.getElementById('lights');
  const go = document.getElementById('go');
  lightsBox.style.display = 'flex';
  for(let i=0;i<3;i++){
    await new Promise(r=>setTimeout(r,1100));
    lights[i].classList.add('on');
  }
  await new Promise(r=>setTimeout(r,900));
  lightsBox.style.display = 'none';
  lights.forEach(l=>l.classList.remove('on'));
  go.style.display = 'block';
  goTs = performance.now();
  setTimeout(()=>go.style.display='none', 800);

  await enableMotion();
  PerfG.zero();
  running = true; startTs = 0; samples = []; motionStart = false; speed = 0; reactMs = 0;
  timeEl.textContent = '0.0';

  if(stream){
    chunks = [];
    try{
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
      stopP = new Promise(res => { recorder.onstop = res; });
      recorder.start();
    }catch(e){}
  }
  if(navigator.geolocation){
    watchId = navigator.geolocation.watchPosition(pos => {
      if(pos.coords.speed != null) speed = pos.coords.speed * 2.23694;
      spdEl.textContent = Math.round(speed);
    }, ()=>{}, {enableHighAccuracy:true, maximumAge:400});
  }
}

document.getElementById('bigStart').onclick = beginRun;

// Voice: say "start run"
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const listenEl = document.getElementById('listening');
function showListening(txt){ if(listenEl){ listenEl.style.display = 'block'; listenEl.textContent = txt || 'Listening for “start run”'; } }
if(!SR){
  showListening('Voice not supported – use the button');
}else{
  let listening = false;
  async function tryStart(){
    if(listening) return;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(t => t.stop());
    }catch(e){
      showListening('Tap the lock icon → Allow microphone');
      return;
    }
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = true;
    rec.lang = 'en-GB';
    rec.onresult = (e) => {
      const said = Array.from(e.results).map(r => r[0].transcript).join(' ').toLowerCase();
      showListening('Heard: ' + said.slice(-40));
      if(said.includes('start') && !running && !document.getElementById('bigStart').classList.contains('hide')){
        beginRun();
      }
    };
    rec.onerror = (ev) => {
      if(ev.error === 'not-allowed'){
        showListening('Microphone blocked – tap lock icon and allow');
      }else{
        showListening('Mic error – tap screen to retry');
      }
      listening = false;
    };
    rec.onend = () => { listening = false; setTimeout(tryStart, 800); };
    try{
      rec.start();
      listening = true;
      showListening('Listening… say “start run”');
    }catch(err){
      showListening('Could not start mic – tap screen');
      listening = false;
    }
  }
  document.addEventListener('touchstart', tryStart, {once:true, passive:true});
  document.addEventListener('click', tryStart, {once:true});
  document.getElementById('ok').addEventListener('click', tryStart);
}
</script>
</body>
</html>
