<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0c0f"/>
<meta name="screen-orientation" content="landscape"/>
<title>Drive test</title>
<style>
:root{--bg:#050608;--ink:#f3efe6;--dim:#9aa3b0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;background:#000}
#rear{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#front{position:absolute;right:12px;top:12px;width:28vw;max-width:220px;height:18vw;max-height:140px;object-fit:cover;background:#111;border-radius:12px;border:2px solid rgba(255,255,255,.35);z-index:3}
.ticker{position:absolute;left:12px;bottom:12px;z-index:4;background:rgba(8,8,10,.78);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 14px;display:flex;gap:16px;align-items:baseline}
.ticker b{font-size:28px}
.ticker span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase}
.hud{position:absolute;left:12px;top:12px;z-index:4;display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:800;background:#2a2a2a;color:#fff;border:1px solid #6b7280}
.rec{color:#ef4444;font-weight:800;font-size:13px}
.err{position:absolute;left:12px;bottom:72px;color:#e7b1a0;font-size:13px;z-index:4}
.hint{position:absolute;right:12px;bottom:12px;color:#9aa3b0;font-size:12px;z-index:4;text-align:right}
.hint a{color:#9fd8ff;text-decoration:none}
</style>
</head>
<body>
<div class="stage">
  <video id="rear" playsinline muted autoplay></video>
  <video id="front" playsinline muted autoplay></video>
  <div class="hud">
    <button class="btn" id="go" type="button">Start</button>
    <span class="rec" id="rec"></span>
  </div>
  <div class="ticker">
    <div><span>Cost</span><b id="cost">£0.00</b></div>
    <div><span>Miles</span><b id="miles">0.00</b></div>
    <div><span>Speed</span><b id="speed">0</b></div>
  </div>
  <p class="err" id="err"></p>
  <p class="hint">Turn the phone sideways. Keep this page open.<br/><a href="home.html">Back</a></p>
</div>
<script>
function garageMpg(){
  try{
    var s=JSON.parse(localStorage.getItem("gt.garage")||"null");
    var c=s&&s.cars&&(s.cars[s.i]||s.cars[0]);
    return c&&+c.mpg?+c.mpg:38;
  }catch(e){return 38}
}
function hav(a,b){
  var R=3958.8,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180;
  var x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
var watch=null,last=null,miles=0,wake=null,streams=[],mpg=garageMpg(),ppl=195.2;
function tick(spd){
  var litres=miles/Math.max(mpg,1)*4.54609;
  document.getElementById("miles").textContent=miles.toFixed(2);
  document.getElementById("cost").textContent="\u00a3"+(litres*(ppl/100)).toFixed(2);
  if(spd!=null) document.getElementById("speed").textContent=Math.round(spd)+" mph";
}
async function oneCam(mode,el){
  try{
    var s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:mode},width:{ideal:1280}},audio:false});
    el.srcObject=s;streams.push(s);return true;
  }catch(e){
    try{
      var s2=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode}},audio:false});
      el.srcObject=s2;streams.push(s2);return true;
    }catch(e2){return false}
  }
}
async function startCams(){
  var rear=await oneCam("environment",document.getElementById("rear"));
  var front=await oneCam("user",document.getElementById("front"));
  if(!rear) document.getElementById("err").textContent="Rear camera not available.";
  else if(!front) document.getElementById("err").textContent="Front camera not available on this phone at the same time. Rear still running.";
}
function startGps(){
  if(!navigator.geolocation){document.getElementById("err").textContent="No GPS.";return}
  watch=navigator.geolocation.watchPosition(function(p){
    var here={lat:p.coords.latitude,lon:p.coords.longitude};
    var mph=p.coords.speed!=null&&p.coords.speed>=0?p.coords.speed*2.23694:null;
    if(last && p.coords.accuracy<=40){
      var d=hav(last,here);
      if(d>0.002 && d<1.5) miles+=d;
    }
    last=here;tick(mph);
  },function(e){document.getElementById("err").textContent=e.message||"Location blocked";},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}
async function start(){
  document.getElementById("err").textContent="";
  miles=0;last=null;mpg=garageMpg();
  if(navigator.wakeLock){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}
  try{await screen.orientation.lock("landscape")}catch(e){}
  await startCams();
  startGps();
  document.getElementById("go").textContent="Stop";
  document.getElementById("rec").textContent="REC";
}
function stop(){
  if(watch!=null) navigator.geolocation.clearWatch(watch);
  watch=null;
  streams.forEach(function(s){s.getTracks().forEach(function(t){t.stop()})});
  streams=[];
  if(wake){try{wake.release()}catch(e){}}
  document.getElementById("go").textContent="Start";
  document.getElementById("rec").textContent="";
}
document.getElementById("go").onclick=function(){watch?stop():start()};
</script>
</body>
</html>
